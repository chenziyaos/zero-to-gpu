<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">四种切法，各付一种等待</text>
<text x="40" y="92" font-size="14" fill="#646A73">Llama 3 405B 把它们组合成 4D 并行，MFU 38% 到 43%</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">切法</text>
<text x="239" y="176" font-size="14" fill="#1F2329" font-weight="bold">切什么</text>
<text x="526" y="176" font-size="14" fill="#1F2329" font-weight="bold">等什么</text>
<text x="885" y="176" font-size="14" fill="#1F2329" font-weight="bold">Llama 3 取值</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">TP</text>
<text x="239" y="216" font-size="14" fill="#1F2329">单个权重张量</text>
<text x="526" y="216" font-size="14" fill="#1F2329">每层 2 + 2 次 all-reduce</text>
<text x="885" y="216" font-size="14" fill="#1F2329">8（一台机器）</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">CP</text>
<text x="239" y="254" font-size="14" fill="#1F2329">输入序列</text>
<text x="526" y="254" font-size="14" fill="#1F2329">K、V 的 all-gather</text>
<text x="885" y="254" font-size="14" fill="#1F2329">长序列阶段 16</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">PP</text>
<text x="239" y="292" font-size="14" fill="#1F2329">按层分段</text>
<text x="526" y="292" font-size="14" fill="#1F2329">填充和排空的气泡</text>
<text x="885" y="292" font-size="14" fill="#1F2329">16</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">DP</text>
<text x="239" y="330" font-size="14" fill="#1F2329">数据</text>
<text x="526" y="330" font-size="14" fill="#1F2329">每步梯度规约</text>
<text x="885" y="330" font-size="14" fill="#1F2329">64、128、8</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">分片</text>
<text x="239" y="368" font-size="14" fill="#1F2329">模型状态</text>
<text x="526" y="368" font-size="14" fill="#1F2329">参数 all-gather</text>
<text x="885" y="368" font-size="14" fill="#1F2329">FSDP，前向后不重分片</text>
<rect x="40" y="412" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="441" font-size="15" fill="#1F2329">三组配置：8 × 16 × 64 = 8192 卡，MFU 43%；8 × 16 × 128 = 16384 卡，41%；加 CP 16 后 8 × 16 × 16 × 8 = 16384 卡，38%。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：Llama 3 论文表 4；Megatron-LM 论文；PTD-P 论文；ZeRO 论文</text>
</svg>