<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">8B 规模、序列 8192：激活比模型状态还大</text>
<text x="40" y="92" font-size="14" fill="#646A73">每层 sbh(34 + 5as/h) 字节，s = 8192，b = 1，h = 4096，a = 32，32 层</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">情形</text>
<text x="477" y="176" font-size="14" fill="#1F2329" font-weight="bold">一个微批的激活</text>
<text x="761" y="176" font-size="14" fill="#1F2329" font-weight="bold">说明</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">不重算、不切分</text>
<text x="477" y="216" font-size="14" fill="#1F2329">约 380.1 GB</text>
<text x="761" y="216" font-size="14" fill="#1F2329">每层约 11.88 GB</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">选择性重算</text>
<text x="477" y="254" font-size="14" fill="#1F2329">约 36.5 GB</text>
<text x="761" y="254" font-size="14" fill="#1F2329">只剩 34sbhL</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">再加 TP 8 和序列并行</text>
<text x="477" y="292" font-size="14" fill="#1F2329">约 4.56 GB</text>
<text x="761" y="292" font-size="14" fill="#1F2329">34sbhL/t</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">对照：模型状态</text>
<text x="477" y="330" font-size="14" fill="#1F2329">128 GB</text>
<text x="761" y="330" font-size="14" fill="#1F2329">16 字节每参数</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">配套代码估计</text>
<text x="477" y="368" font-size="14" fill="#1F2329">2.15 GB</text>
<text x="761" y="368" font-size="14" fill="#1F2329">s × h × L × 2，小两个数量级</text>
<rect x="40" y="412" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="441" font-size="15" fill="#1F2329">论文实测：选择性重算让每层时间只多 7%，全量重算多 39%；530B 模型在 2240 卡上 MFU 54.2%，全量重算时 42.1%。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：Korthikanti et al.（激活公式、选择性重算）；zero-to-gpu/21-train-parallel/sim_memory.py 实跑</text>
</svg>