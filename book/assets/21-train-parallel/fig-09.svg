<text x="148" y="168" font-size="14" fill="#1F2329" text-anchor="end">BF16</text>
<rect x="160" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="160" y="150" width="350" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="518" y="168" font-size="13" fill="#646A73">  989</text>
<text x="148" y="210" font-size="14" fill="#1F2329" text-anchor="end">FP8</text>
<rect x="160" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="160" y="192" width="700" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="868" y="210" font-size="13" fill="#646A73">  1,979</text>
<rect x="40" y="258" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="284" font-size="14" fill="#1F2329" font-weight="bold">编码</text>
<text x="222" y="284" font-size="14" fill="#1F2329" font-weight="bold">指数 / 尾数</text>
<text x="449" y="284" font-size="14" fill="#1F2329" font-weight="bold">最大值</text>
<text x="647" y="284" font-size="14" fill="#1F2329" font-weight="bold">DeepSeek-V3 的用法</text>
<rect x="40" y="300" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="324" font-size="14" fill="#1F2329" font-weight="bold">E4M3</text>
<text x="222" y="324" font-size="14" fill="#1F2329">4 / 3</text>
<text x="449" y="324" font-size="14" fill="#1F2329">448</text>
<text x="647" y="324" font-size="14" fill="#1F2329">全部张量都用，每 128 个元素提升到 FP32 累加</text>
<rect x="40" y="338" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="362" font-size="14" fill="#1F2329" font-weight="bold">E5M2</text>
<text x="222" y="362" font-size="14" fill="#1F2329">5 / 2</text>
<text x="449" y="362" font-size="14" fill="#1F2329">57,344</text>
<text x="647" y="362" font-size="14" fill="#1F2329">此前常用于 Dgrad、Wgrad，DeepSeek-V3 不用</text>
<rect x="40" y="406" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="435" font-size="15" fill="#1F2329">DeepSeek-V3：激活按 1x128 分组缩放，嵌入、输出头、门控、归一化和注意力留在高精度；损失误差低于 0.25%。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：H100 规格页；FP8 Formats for Deep Learning；DeepSeek-V3 技术报告</text>
</svg>