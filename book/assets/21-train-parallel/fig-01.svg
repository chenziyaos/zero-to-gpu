<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">并行切分决定每张卡在等什么</text>
<text x="40" y="92" font-size="14" fill="#646A73">先算显存放不放得下，再看每种切法的等待落在时间账的哪一项</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">算显存</text>
<text x="56" y="211" font-size="14" fill="#646A73">16 字节每参数 + 激活（第 2、3</text>
<text x="56" y="234" font-size="14" fill="#646A73">章）</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">切模型</text>
<text x="347" y="211" font-size="14" fill="#646A73">ZeRO、TP、PP、CP（第 4 到 7</text>
<text x="347" y="234" font-size="14" fill="#646A73">章）</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">缩计算</text>
<text x="638" y="211" font-size="14" fill="#646A73">FP8 GEMM（第 8 章）</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">选方案</text>
<text x="929" y="211" font-size="14" fill="#646A73">由内到外排，实测（第 9 章）</text>
<rect x="40" y="284" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">W_comm</text>
<text x="56" y="346" font-size="14" fill="#646A73">TP：每层 all-reduce</text>
<text x="56" y="369" font-size="14" fill="#646A73">DP：每步梯度规约</text>
<text x="56" y="392" font-size="14" fill="#646A73">全分片：多 50% 通信</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">W_idle</text>
<text x="437" y="346" font-size="14" fill="#646A73">PP 气泡 (p−1)/m</text>
<text x="437" y="369" font-size="14" fill="#646A73">p = 8、m = 64 时 10.9%</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">T_compute</text>
<text x="819" y="346" font-size="14" fill="#646A73">FP8 稠密峰值 1,979 TFLOPS</text>
<text x="819" y="369" font-size="14" fill="#646A73">BF16 是 989 TFLOPS</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：ZeRO、Megatron-LM、PTD-P、Korthikanti et al.、Llama 3、DeepSeek-V3 论文</text>
</svg>