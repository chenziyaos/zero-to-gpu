<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">长序列：激活沿序列维切</text>
<text x="40" y="92" font-size="14" fill="#646A73">8B 形状（h = 4096，a = 32），每层激活</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">情形</text>
<text x="520" y="176" font-size="14" fill="#1F2329" font-weight="bold">每层激活</text>
<text x="761" y="176" font-size="14" fill="#1F2329" font-weight="bold">说明</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">序列 8192</text>
<text x="520" y="216" font-size="14" fill="#1F2329">约 11.88 GB</text>
<text x="761" y="216" font-size="14" fill="#1F2329">5as/h = 320</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">序列 131,072</text>
<text x="520" y="254" font-size="14" fill="#1F2329">约 2767 GB</text>
<text x="761" y="254" font-size="14" fill="#1F2329">5as/h = 5120，注意力分数项占绝大部分</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">131,072，去掉注意力分数项</text>
<text x="520" y="292" font-size="14" fill="#1F2329">约 18.3 GB</text>
<text x="761" y="292" font-size="14" fill="#1F2329">FlashAttention 不存中间注意力矩阵</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">CP 16 后每组的序列</text>
<text x="520" y="330" font-size="14" fill="#1F2329">8192</text>
<text x="761" y="330" font-size="14" fill="#1F2329">131072 ÷ 16</text>
<rect x="40" y="374" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="405" font-size="18" fill="#1F2329" font-weight="bold">序列并行（SP）</text>
<text x="56" y="435" font-size="14" fill="#646A73">和 TP 合用，通信量不变</text>
<text x="56" y="458" font-size="14" fill="#646A73">激活除以 TP 度</text>
<rect x="612" y="374" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="405" font-size="18" fill="#1F2329" font-weight="bold">Llama 3 上下文并行（CP）</text>
<text x="628" y="435" font-size="14" fill="#646A73">先 all-gather K、V，再算本地 Q</text>
<text x="628" y="458" font-size="14" fill="#646A73">TP 8、CP 16、PP 16、DP 8，MFU 38%</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：Korthikanti et al.；FlashAttention 论文；Llama 3 论文表 4 与 3.3.2 节</text>
</svg>