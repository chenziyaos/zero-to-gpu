<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">混合精度 Adam：每个参数 16 字节，参数本身只占 2 字节</text>
<text x="40" y="92" font-size="14" fill="#646A73">8B 模型的模型状态 128 GB，超过 H100 的 80 GB；纯数据并行每卡都要放一份</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">16 位参数</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="88" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="336" y="168" font-size="13" fill="#646A73">  2 字节</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">16 位梯度</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="88" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="336" y="210" font-size="13" fill="#646A73">  2 字节</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">32 位参数副本</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="175" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="423" y="252" font-size="13" fill="#646A73">  4 字节（配套代码漏算）</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">Adam 动量</text>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="175" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="423" y="294" font-size="13" fill="#646A73">  4 字节</text>
<text x="228" y="336" font-size="14" fill="#1F2329" text-anchor="end">Adam 方差</text>
<rect x="240" y="318" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="318" width="175" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="423" y="336" font-size="13" fill="#646A73">  4 字节</text>
<rect x="40" y="374" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="405" font-size="18" fill="#1F2329" font-weight="bold">应为：16 字节每参数</text>
<text x="56" y="435" font-size="14" fill="#646A73">8B：128 GB</text>
<text x="56" y="458" font-size="14" fill="#646A73">7.5B：120 GB（ZeRO 论文）</text>
<rect x="612" y="374" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="405" font-size="18" fill="#1F2329" font-weight="bold">配套代码 sim_memory.py：12 字节</text>
<text x="628" y="435" font-size="14" fill="#646A73">8B：96 GB</text>
<text x="628" y="458" font-size="14" fill="#646A73">7.5B 测试：90 GB，照样通过</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：ZeRO 论文；zero-to-gpu/21-train-parallel/sim_memory.py 实跑</text>
