<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">ZeRO：前两个阶段省显存不加通信，第三个阶段多 50%</text>
<text x="40" y="92" font-size="14" fill="#646A73">7.5B 模型、64 卡数据并行，每卡模型状态（GB）</text>
<text x="248" y="168" font-size="14" fill="#1F2329" text-anchor="end">标准数据并行</text>
<rect x="260" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="150" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="968" y="168" font-size="13" fill="#646A73">  120 GB，通信 2Ψ</text>
<text x="248" y="210" font-size="14" fill="#1F2329" text-anchor="end">Pos 分片优化器</text>
<rect x="260" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="192" width="183" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="451" y="210" font-size="13" fill="#646A73">  31.4 GB，通信 2Ψ</text>
<text x="248" y="252" font-size="14" fill="#1F2329" text-anchor="end">Pos+g 再分片梯度</text>
<rect x="260" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="234" width="97" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="365" y="252" font-size="13" fill="#646A73">  16.6 GB，通信 2Ψ</text>
<text x="248" y="294" font-size="14" fill="#1F2329" text-anchor="end">Pos+g+p 再分片参数</text>
<rect x="260" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="276" width="11" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="279" y="294" font-size="13" fill="#646A73">  1.88 GB，通信 3Ψ</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">FSDP 全分片按环算法比 DDP 多 1.5x 通信；Llama 3 分片优化器和梯度，前向后不重分片参数，少一次 all-gather。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：ZeRO 论文（表 1 与第 7 节通信分析）；PyTorch FSDP 论文</text>
