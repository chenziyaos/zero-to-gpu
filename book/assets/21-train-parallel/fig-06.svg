<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<rect x="0" y="0" width="1200" height="500" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">张量并行每层都等 all-reduce，所以只放在机内</text>
<text x="40" y="92" font-size="14" fill="#646A73">配套代码 TP 8、PP 2、DP 4 方案的每步时间（ms），TP 通信按不重叠计算</text>
<text x="188" y="168" font-size="14" fill="#1F2329" text-anchor="end">计算</text>
<rect x="200" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="150" width="700" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="908" y="168" font-size="13" fill="#646A73">  3791.71 ms</text>
<text x="188" y="210" font-size="14" fill="#1F2329" text-anchor="end">TP 通信</text>
<rect x="200" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="192" width="419" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="627" y="210" font-size="13" fill="#646A73">  2271.86 ms</text>
<text x="188" y="252" font-size="14" fill="#1F2329" text-anchor="end">PP 气泡</text>
<rect x="200" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="234" width="44" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="252" y="252" font-size="13" fill="#646A73">  236.98 ms</text>
<text x="188" y="294" font-size="14" fill="#1F2329" text-anchor="end">DP 暴露</text>
<rect x="200" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="276" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="212" y="294" font-size="13" fill="#646A73">  15.00 ms</text>
<rect x="40" y="332" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="363" font-size="18" fill="#1F2329" font-weight="bold">每次 all-reduce（序列 8192）</text>
<text x="56" y="393" font-size="14" fill="#646A73">b × s × h × 2 约 0.067 GB</text>
<text x="56" y="416" font-size="14" fill="#646A73">环形系数 1.75，NVLink 单向 450 GB/s</text>
<rect x="612" y="332" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="363" font-size="18" fill="#1F2329" font-weight="bold">经验</text>
<text x="628" y="393" font-size="14" fill="#646A73">TP 不超过单机卡数（PTD-P）</text>
<text x="628" y="416" font-size="14" fill="#646A73">Llama 3 三组配置 TP 都是 8</text>
<text x="40" y="476" font-size="12" fill="#646A73">来源：zero-to-gpu/21-train-parallel/sim_parallel.py 实跑（Python 3.14.7）；Megatron-LM 与 PTD-P 论文</text>
</svg>