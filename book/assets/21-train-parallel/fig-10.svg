<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">定 TP</text>
<text x="289" y="211" font-size="14" fill="#646A73">机内 2、4、8</text>
<polyline points="468,191 500,191" fill="none" stroke="#8F959E" stroke-width="2"/>
