<rect x="40" y="352" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="375" font-size="14" fill="#1F2329" font-weight="bold">核心利用率固定 0.8</text>
<text x="520" y="375" font-size="14" fill="#1F2329">MFU 上限 80%</text>
<text x="846" y="375" font-size="14" fill="#1F2329">按实测效率</text>
<rect x="40" y="390" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="413" font-size="14" fill="#1F2329" font-weight="bold">TP 通信不重叠</text>
<text x="520" y="413" font-size="14" fill="#1F2329">TP 8 排第十，49.7%</text>
<text x="846" y="413" font-size="14" fill="#1F2329">实测重叠和带宽</text>
<rect x="40" y="428" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="451" font-size="14" fill="#1F2329" font-weight="bold">“共 12 个可行方案”</text>
