<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">选分片</text>
<text x="754" y="211" font-size="14" fill="#646A73">放得下的最低阶段</text>
<polyline points="933,191 965,191" fill="none" stroke="#8F959E" stroke-width="2"/>
