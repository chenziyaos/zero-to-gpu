<text x="987" y="211" font-size="14" fill="#646A73">每组批不能太小</text>
<rect x="40" y="272" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="298" font-size="14" fill="#1F2329" font-weight="bold">配套代码 search 的假设</text>
<text x="520" y="298" font-size="14" fill="#1F2329" font-weight="bold">结果</text>
<text x="846" y="298" font-size="14" fill="#1F2329" font-weight="bold">应为</text>
