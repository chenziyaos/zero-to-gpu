<circle cx="535" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">定 PP、CP</text>
<text x="522" y="211" font-size="14" fill="#646A73">m 远大于 p</text>
