<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">PyTorch profiler 的 schedule：只记录稳态的几步</text>
<text x="40" y="92" font-size="14" fill="#646A73">每步结束调用 prof.step()；读表按 self 时间排序</text>
<text x="128" y="182" font-size="14" fill="#1F2329" text-anchor="end">步骤</text>
<rect x="140" y="160" width="1020" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="140" y="163" width="102" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="191" y="182" font-size="12" fill="#646A73" text-anchor="middle">wait</text>
<rect x="242" y="163" width="102" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="293" y="182" font-size="12" fill="#245BDB" text-anchor="middle">warmup</text>
<rect x="344" y="163" width="306" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="497" y="182" font-size="12" fill="#2EA121" text-anchor="middle">active 记录</text>
<rect x="650" y="163" width="102" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="701" y="182" font-size="12" fill="#646A73" text-anchor="middle">wait</text>
<rect x="752" y="163" width="102" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="803" y="182" font-size="12" fill="#245BDB" text-anchor="middle">warmup</text>
<rect x="854" y="163" width="306" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="1007" y="182" font-size="12" fill="#2EA121" text-anchor="middle">active 记录</text>
<line x1="140" y1="156" x2="140" y2="198" stroke="#DEE0E3" stroke-width="1" stroke-dasharray="6 4"/>
<text x="140" y="216" font-size="12" fill="#646A73" text-anchor="middle">0 步</text>
<line x1="344" y1="156" x2="344" y2="198" stroke="#DEE0E3" stroke-width="1" stroke-dasharray="6 4"/>
<text x="344" y="216" font-size="12" fill="#646A73" text-anchor="middle">2 步</text>
<line x1="548" y1="156" x2="548" y2="198" stroke="#DEE0E3" stroke-width="1" stroke-dasharray="6 4"/>
<text x="548" y="216" font-size="12" fill="#646A73" text-anchor="middle">4 步</text>
<line x1="752" y1="156" x2="752" y2="198" stroke="#DEE0E3" stroke-width="1" stroke-dasharray="6 4"/>
<text x="752" y="216" font-size="12" fill="#646A73" text-anchor="middle">6 步</text>
<line x1="956" y1="156" x2="956" y2="198" stroke="#DEE0E3" stroke-width="1" stroke-dasharray="6 4"/>
<text x="956" y="216" font-size="12" fill="#646A73" text-anchor="middle">8 步</text>
<line x1="1160" y1="156" x2="1160" y2="198" stroke="#DEE0E3" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1160" y="216" font-size="12" fill="#646A73" text-anchor="middle">10 步</text>
<rect x="40" y="250" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="279" font-size="15" fill="#1F2329">self 时间不含子算子，total 时间包含；按 total 排序时排前面的总是外层区间。</text>
<rect x="40" y="320" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="349" font-size="15" fill="#1F2329">NVTX 默认什么也不做，只在工具里运行时才记录；torch.cuda.nvtx.range_push / range_pop 加上 nsys -t nvtx，时间线上多一行带名字的区间。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：PyTorch torch.profiler 文档；PyTorch Profiler recipe；NVTX 文档</text>
</svg>