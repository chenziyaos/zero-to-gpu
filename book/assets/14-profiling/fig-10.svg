<text x="987" y="211" font-size="14" fill="#646A73">按精度算脊点</text>
<rect x="40" y="294" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">改一处 → 回到第 2 步用同样的范围重抓时间线 → 看步时间。核变快后空隙占比会变大，瓶颈可能已经转移。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：本篇第 1 到 8 章的工具与方法；NVIDIA Nsight Compute Profiling Guide（串行化与时钟控制）</text>
