<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一次完整分析：先填空隙，再按时间线上的总时间挑核</text>
<text x="40" y="92" font-size="14" fill="#646A73">时长以 nsys 为准；ncu 只看比例和瓶颈类型</text>
