<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">单核</text>
<text x="754" y="211" font-size="14" fill="#646A73">ncu -k -s -c</text>
<polyline points="933,202 965,202" fill="none" stroke="#8F959E" stroke-width="2"/>
