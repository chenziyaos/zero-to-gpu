<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">热点核</text>
<text x="522" y="211" font-size="14" fill="#646A73">kern_sum 排序，对回</text>
<text x="522" y="234" font-size="14" fill="#646A73">算子</text>
