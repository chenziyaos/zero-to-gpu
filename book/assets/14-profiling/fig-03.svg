<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">nsys：只抓稳态一段，空隙要用逐条记录算</text>
<text x="40" y="92" font-size="14" fill="#646A73">--capture-range 限定范围；nsys stats 生成三类表</text>
<rect x="40" y="150" width="344" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">限定范围</text>
<text x="56" y="211" font-size="14" fill="#646A73">cudaProfilerStart/Stop 或 NVTX；只抓一个</text>
<text x="56" y="234" font-size="14" fill="#646A73">rank</text>
<polyline points="390,202 422,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,196 422,202 412,208" fill="#8F959E"/>
<rect x="428" y="150" width="344" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="457" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="457" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="476" y="181" font-size="18" fill="#1F2329" font-weight="bold">抓取</text>
<text x="444" y="211" font-size="14" fill="#646A73">nsys profile -t cuda,nvtx</text>
<text x="444" y="234" font-size="14" fill="#646A73">--capture-range=cudaProfilerApi</text>
<polyline points="778,202 810,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,196 810,202 800,208" fill="#8F959E"/>
<rect x="816" y="150" width="344" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="845" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="845" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="864" y="181" font-size="18" fill="#1F2329" font-weight="bold">统计</text>
<text x="832" y="211" font-size="14" fill="#646A73">nsys stats --report ...</text>
<rect x="40" y="294" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="326" font-size="18" fill="#1F2329" font-weight="bold">cuda_gpu_kern_sum</text>
<text x="56" y="356" font-size="14" fill="#646A73">按 kernel 名汇总</text>
<text x="56" y="379" font-size="14" fill="#646A73">总时间和次数</text>
<text x="56" y="402" font-size="14" fill="#646A73">找热点核</text>
<rect x="421" y="294" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="437" y="326" font-size="18" fill="#1F2329" font-weight="bold">cuda_api_sum</text>
<text x="437" y="356" font-size="14" fill="#646A73">CPU 端 CUDA API 时间</text>
<text x="437" y="379" font-size="14" fill="#646A73">同步调用时间长要警惕</text>
<rect x="803" y="294" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="819" y="326" font-size="18" fill="#1F2329" font-weight="bold">cuda_gpu_trace</text>
<text x="819" y="356" font-size="14" fill="#646A73">逐条记录</text>
<text x="819" y="379" font-size="14" fill="#646A73">带开始时间和时长</text>
<text x="819" y="402" font-size="14" fill="#646A73">算空隙用它</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：NVIDIA Nsight Systems User Guide（--capture-range、nsys stats 报表）</text>
</svg>