<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">四种工具各看一层：利用率只说明有没有 kernel 在跑</text>
<text x="40" y="92" font-size="14" fill="#646A73">顺序从粗到细，开销从低到高</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">工具</text>
<text x="312" y="166" font-size="14" fill="#1F2329" font-weight="bold">看什么</text>
<text x="781" y="166" font-size="14" fill="#1F2329" font-weight="bold">回答的问题</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">nvidia-smi</text>
<text x="312" y="206" font-size="14" fill="#1F2329">采样周期内有 kernel 执行的时间占比</text>
<text x="781" y="206" font-size="14" fill="#1F2329">GPU 有没有空着</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">DCGM</text>
<text x="312" y="244" font-size="14" fill="#1F2329">SM Activity、Tensor Activity、DRAM Activity</text>
<text x="781" y="244" font-size="14" fill="#1F2329">GPU 在跑什么</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">Nsight Systems</text>
<text x="312" y="282" font-size="14" fill="#1F2329">CPU 线程、CUDA API、kernel、拷贝、NVTX 的时间线</text>
<text x="781" y="282" font-size="14" fill="#1F2329">时间花在哪里，哪里有空隙</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">PyTorch profiler</text>
<text x="312" y="320" font-size="14" fill="#1F2329">按算子统计 CPU 和 CUDA 时间</text>
<text x="781" y="320" font-size="14" fill="#1F2329">kernel 属于哪个算子</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">Nsight Compute</text>
<text x="312" y="358" font-size="14" fill="#1F2329">单个 kernel 的硬件计数器</text>
<text x="781" y="358" font-size="14" fill="#1F2329">这个核为什么慢</text>
<rect x="40" y="408" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="437" font-size="15" fill="#1F2329">一个只占一个 SM 的小核一直在跑，nvidia-smi 的利用率也是满的。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：nvidia-smi 文档；DCGM Feature Overview；Nsight Systems / Nsight Compute 文档；PyTorch profiler 文档</text>
</svg>