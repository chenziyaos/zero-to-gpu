<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
<rect x="0" y="0" width="1200" height="530" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">ncu 的重放：显存能恢复，缓存不能</text>
<text x="40" y="92" font-size="14" fill="#646A73">一次收不齐计数器，同一个核要跑多遍</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">第 1 遍</text>
<text x="56" y="211" font-size="14" fill="#646A73">保存核能访问的全部显存</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">确定写集</text>
<text x="347" y="211" font-size="14" fill="#646A73">找出核写过的那部分</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">第 2 遍起</text>
<text x="638" y="211" font-size="14" fill="#646A73">每遍前恢复写集，缓存可能已热</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">合并</text>
<text x="929" y="211" font-size="14" fill="#646A73">各遍的计数器合成一份报告</text>
<rect x="40" y="272" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="298" font-size="14" fill="#1F2329" font-weight="bold">和实际运行的差别</text>
<text x="443" y="298" font-size="14" fill="#1F2329" font-weight="bold">对应选项</text>
<text x="807" y="298" font-size="14" fill="#1F2329" font-weight="bold">影响</text>
<rect x="40" y="314" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="337" font-size="14" fill="#1F2329" font-weight="bold">核串行执行</text>
<text x="443" y="337" font-size="14" fill="#1F2329">专门的重放模式（如 range）</text>
<text x="807" y="337" font-size="14" fill="#1F2329">并发核的时长不同</text>
<rect x="40" y="352" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="375" font-size="14" fill="#1F2329" font-weight="bold">时钟锁在 boost</text>
<text x="443" y="375" font-size="14" fill="#1F2329">--clock-control base</text>
<text x="807" y="375" font-size="14" fill="#1F2329">可锁在基础频率</text>
<rect x="40" y="390" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="413" font-size="14" fill="#1F2329" font-weight="bold">缓存状态</text>
<text x="443" y="413" font-size="14" fill="#1F2329">--cache-control all</text>
<text x="807" y="413" font-size="14" fill="#1F2329">每遍前刷新，最可复现</text>
<rect x="40" y="428" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="451" font-size="14" fill="#1F2329" font-weight="bold">收集范围</text>
<text x="443" y="451" font-size="14" fill="#1F2329">-k、-s、-c、--nvtx-include</text>
<text x="807" y="451" font-size="14" fill="#1F2329">只收热点核</text>
<text x="40" y="506" font-size="12" fill="#646A73">来源：NVIDIA Nsight Compute Profiling Guide；Nsight Compute CLI</text>
</svg>