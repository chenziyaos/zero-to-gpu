<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">整卡</text>
<text x="56" y="211" font-size="14" fill="#646A73">nvidia-smi 与 DCGM：</text>
<text x="56" y="234" font-size="14" fill="#646A73">SM、Tensor、DRAM</text>
<text x="56" y="257" font-size="14" fill="#646A73">Activity（第 1、8 章）</text>
