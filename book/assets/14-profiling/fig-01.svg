<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">时间去哪了：从整卡到时间线，再到单个核</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇给出测量时间账的工具；时间线空隙记 W_host、W_idle，核的瓶颈归 T_compute 或 W_mem</text>
