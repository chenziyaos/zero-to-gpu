<text x="56" y="346" font-size="15" fill="#1F2329">每改一处，回到时间线用同样的范围重抓（第 9 章）；时长以 nsys 为准，ncu 只看比例和瓶颈类型。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：NVIDIA Nsight Systems User Guide；Nsight Compute Profiling Guide；DCGM User Guide；PyTorch profiler 文档</text>
