<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">读 ncu 报告：SOL、占用率、stall 原因</text>
<text x="40" y="92" font-size="14" fill="#646A73">先看离哪个单元的上限最近，再看能不能藏延迟，最后看 warp 在等什么</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">1 Speed Of Light</text>
<text x="56" y="201" font-size="14" fill="#646A73">各单元吞吐占理论最大值的比例</text>
<text x="56" y="224" font-size="14" fill="#646A73">计算高：看 Compute Workload</text>
<text x="56" y="247" font-size="14" fill="#646A73">访存高：看 Memory Workload</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">2 占用率</text>
<text x="437" y="201" font-size="14" fill="#646A73">活跃 warp / 最多可驻留 warp</text>
<text x="437" y="224" font-size="14" fill="#646A73">高不一定快</text>
<text x="437" y="247" font-size="14" fill="#646A73">低一定削弱藏延迟的能力</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">3 stall 原因</text>
<text x="819" y="201" font-size="14" fill="#646A73">long_scoreboard：等 L1TEX 结果</text>
<text x="819" y="224" font-size="14" fill="#646A73">→ 访存延迟受限，不一定是带宽</text>
<text x="819" y="247" font-size="14" fill="#646A73">math_pipe_throttle：计算管线满</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">SOL 两侧都不高、占用率又低：往并行度和藏延迟方向改；带宽没满时用 ILP、循环展开、流水线。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NVIDIA Nsight Compute Profiling Guide（Sections、Occupancy、Warp Stall Reasons）</text>
</svg>