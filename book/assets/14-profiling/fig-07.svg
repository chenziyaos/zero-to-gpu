<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect x="0" y="0" width="1200" height="460" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">H100 SXM 的两个脊点：BF16 约 295，FP32 是 20 FLOP/byte</text>
<text x="40" y="92" font-size="14" fill="#646A73">可达性能 = min(峰值算力, 算术强度 × 显存带宽)；稠密峰值</text>
<text x="288" y="178" font-size="14" fill="#1F2329" text-anchor="end">向量加法（约 0.083）</text>
<rect x="300" y="160" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="160" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="312" y="178" font-size="13" fill="#646A73">0.083 FLOP/byte</text>
<text x="288" y="220" font-size="14" fill="#1F2329" text-anchor="end">FP32 脊点</text>
<rect x="300" y="202" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="202" width="10" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="318" y="220" font-size="13" fill="#646A73">20 FLOP/byte</text>
<text x="288" y="262" font-size="14" fill="#1F2329" text-anchor="end">BF16 稠密脊点</text>
<rect x="300" y="244" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="244" width="151" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="459" y="262" font-size="13" fill="#646A73">295 FLOP/byte</text>
<text x="288" y="304" font-size="14" fill="#1F2329" text-anchor="end">4096 方阵 BF16 GEMM（理想）</text>
<rect x="300" y="286" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="286" width="700" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="1008" y="304" font-size="13" fill="#646A73">1365 FLOP/byte</text>
<rect x="40" y="352" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="381" font-size="15" fill="#1F2329">BF16 规格表 1,979 TFLOPS 是稀疏数字，稠密按一半约 989 TFLOPS。算术强度低于脊点追带宽，高于脊点追算力。</text>
<text x="40" y="436" font-size="12" fill="#646A73">来源：NVIDIA H100 产品页（FP32 67、BF16 1,979 带稀疏、3.35 TB/s）；Williams et al. (2008)；数值为本文推算</text>
</svg>