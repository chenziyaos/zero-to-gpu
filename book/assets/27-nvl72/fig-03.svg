<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">9 × 144 = 72 × 18：端口数对得上，每卡 1.8 TB/s</text>
<text x="40" y="92" font-size="14" fill="#646A73">GB200 NVL72 的组成与端口核对</text>
<rect x="40" y="150" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">18 个计算托盘</text>
<text x="56" y="211" font-size="14" fill="#646A73">每个 2 Grace + 4 GPU</text>
<text x="56" y="234" font-size="14" fill="#646A73">80 PFLOPS，1.7 TB</text>
<text x="56" y="257" font-size="14" fill="#646A73">合计 36 CPU、72 GPU</text>
<rect x="421" y="150" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="181" font-size="18" fill="#1F2329" font-weight="bold">9 个交换托盘</text>
<text x="437" y="211" font-size="14" fill="#646A73">每个 144 个端口</text>
<text x="437" y="234" font-size="14" fill="#646A73">每端口 100 GB</text>
<text x="437" y="257" font-size="14" fill="#646A73">合计 1296 个端口</text>
<rect x="803" y="150" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="181" font-size="18" fill="#1F2329" font-weight="bold">72 张 GPU</text>
<text x="819" y="211" font-size="14" fill="#646A73">每卡 18 条链路</text>
<text x="819" y="234" font-size="14" fill="#646A73">合计 1296 条</text>
<text x="819" y="257" font-size="14" fill="#646A73">每卡 1.8 TB/s 双向</text>
<rect x="40" y="308" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="336" font-size="15" fill="#1F2329">聚合 72 × 1.8 = 129.6 TB/s，规格表写 130 TB/s；比较时用每卡每方向 900 GB/s，对网卡 50 GB/s 是 18 倍。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NVIDIA GB200 NVL72 技术博客；GB200 NVL72 规格页；NVLink 规格表</text>
</svg>