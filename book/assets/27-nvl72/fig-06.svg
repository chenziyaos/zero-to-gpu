<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">每卡算力涨 2.53 倍，带宽涨 2.39 倍，拐点几乎不动</text>
<text x="40" y="92" font-size="14" fill="#646A73">GB200 每卡（由 superchip 一列除以 2）对 H100 SXM；BF16 稠密口径</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">指标</text>
<text x="397" y="176" font-size="14" fill="#1F2329" font-weight="bold">H100 SXM</text>
<text x="684" y="176" font-size="14" fill="#1F2329" font-weight="bold">GB200 每卡</text>
<text x="971" y="176" font-size="14" fill="#1F2329" font-weight="bold">倍数</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">BF16 稠密算力</text>
<text x="397" y="216" font-size="14" fill="#1F2329">989 TFLOPS</text>
<text x="684" y="216" font-size="14" fill="#1F2329">2.5 PFLOPS</text>
<text x="971" y="216" font-size="14" fill="#1F2329">2.53</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">HBM 容量</text>
<text x="397" y="254" font-size="14" fill="#1F2329">80 GB</text>
<text x="684" y="254" font-size="14" fill="#1F2329">186 GB</text>
<text x="971" y="254" font-size="14" fill="#1F2329"></text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">HBM 带宽</text>
<text x="397" y="292" font-size="14" fill="#1F2329">3.35 TB/s</text>
<text x="684" y="292" font-size="14" fill="#1F2329">8 TB/s</text>
<text x="971" y="292" font-size="14" fill="#1F2329">2.39</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">拐点</text>
<text x="397" y="330" font-size="14" fill="#1F2329">约 295 FLOP/B</text>
<text x="684" y="330" font-size="14" fill="#1F2329">约 312.5 FLOP/B</text>
<text x="971" y="330" font-size="14" fill="#1F2329"></text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">GB300：72 张 Blackwell Ultra，稠密 FP4 是 Blackwell 的 1.5 倍，HBM 容量 1.5 倍，NVLink 仍是 130 TB/s。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：GB200 NVL72 规格页（稀疏口径，稠密为一半）；H100 规格页；Blackwell 架构页；主编核算</text>
</svg>