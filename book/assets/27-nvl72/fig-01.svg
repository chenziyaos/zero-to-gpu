<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">NVLink 域从 8 卡扩到 72 卡：TP 的墙打穿了，网络和故障域还在</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇各章的位置</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">TP=8 的墙</text>
<text x="56" y="211" font-size="14" fill="#646A73">Hopper 域 8 卡（第 1 章）</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">NVL72 机柜</text>
<text x="347" y="211" font-size="14" fill="#646A73">72 GPU，每卡 1.8 TB/s（第 2、</text>
<text x="347" y="234" font-size="14" fill="#646A73">3 章）</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">重算账</text>
<text x="638" y="211" font-size="14" fill="#646A73">TP 通信、每卡算力（第 4、5 章）</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">重排并行</text>
<text x="929" y="211" font-size="14" fill="#646A73">TP、EP、PP、DP（第 6 到 8 章）</text>
<rect x="40" y="284" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">变了</text>
<text x="56" y="346" font-size="14" fill="#646A73">TP、EP 可以过 8</text>
<text x="56" y="369" font-size="14" fill="#646A73">C2C 连 CPU 内存</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">没变</text>
<text x="437" y="346" font-size="14" fill="#646A73">机柜之间仍是网络</text>
<text x="437" y="369" font-size="14" fill="#646A73">解码仍受 HBM 带宽限制</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">时间账</text>
<text x="819" y="346" font-size="14" fill="#646A73">W_comm 挪到 NVLink</text>
<text x="819" y="369" font-size="14" fill="#646A73">W_idle 随故障域变大</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：GB200 NVL72 规格页；NVIDIA 技术博客；NVLink 规格表；Llama 3；DeepSeek-V3</text>
</svg>