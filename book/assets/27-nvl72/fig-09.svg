<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">DP8</text>
<text x="929" y="211" font-size="14" fill="#646A73">最外层梯度同步</text>
<rect x="40" y="262" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">在 NVL72 上</text>
