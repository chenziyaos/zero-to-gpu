<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">C2C 比 PCIe Gen5 宽 7 倍，LPDDR5X 比 HBM 慢约 31.25 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">一个 GB200 superchip：1 颗 Grace + 2 张 Blackwell</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">部件</text>
<text x="345" y="176" font-size="14" fill="#1F2329" font-weight="bold">容量</text>
<text x="612" y="176" font-size="14" fill="#1F2329" font-weight="bold">带宽</text>
<text x="879" y="176" font-size="14" fill="#1F2329" font-weight="bold">角色</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">HBM3E（两张 GPU）</text>
<text x="345" y="216" font-size="14" fill="#1F2329">372 GB</text>
<text x="612" y="216" font-size="14" fill="#1F2329">16 TB/s</text>
<text x="879" y="216" font-size="14" fill="#1F2329">活跃数据</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">LPDDR5X（Grace）</text>
<text x="345" y="254" font-size="14" fill="#1F2329">最多 480 GB</text>
<text x="612" y="254" font-size="14" fill="#1F2329">最多 512 GB/s</text>
<text x="879" y="254" font-size="14" fill="#1F2329">停放层</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">NVLink-C2C</text>
<text x="345" y="292" font-size="14" fill="#1F2329"></text>
<text x="612" y="292" font-size="14" fill="#1F2329">900 GB/s 双向</text>
<text x="879" y="292" font-size="14" fill="#1F2329">CPU 与 GPU 一致互连</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">对照：PCIe Gen5</text>
<text x="345" y="330" font-size="14" fill="#1F2329"></text>
<text x="612" y="330" font-size="14" fill="#1F2329">128 GB/s 双向</text>
<text x="879" y="330" font-size="14" fill="#1F2329">H100 服务器</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">整柜 13.4 TB HBM + 17 TB LPDDR5X = 30.4 TB，博客称 30 TB 统一内存；统一地址不等于同样的带宽。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：GB200 NVL72 规格页；NVIDIA 技术博客；GH200 规格页</text>
</svg>