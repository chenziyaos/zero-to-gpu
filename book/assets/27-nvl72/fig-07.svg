<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">通信最密的维度放进 72 卡域，跨机柜只留 DP 和少量 PP</text>
<text x="40" y="92" font-size="14" fill="#646A73">并行维度在 Hopper 与 NVL72 上的落点</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">维度</text>
<text x="271" y="176" font-size="14" fill="#1F2329" font-weight="bold">Hopper 8 卡域</text>
<text x="721" y="176" font-size="14" fill="#1F2329" font-weight="bold">NVL72 72 卡域</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">TP</text>
<text x="271" y="216" font-size="14" fill="#1F2329">用到 8，跨机代价高</text>
<text x="721" y="216" font-size="14" fill="#1F2329">可以过 8，按每卡吞吐选</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">EP</text>
<text x="271" y="254" font-size="14" fill="#1F2329">DeepSeek-V3 EP64 跨 8 节点，每 token 最多 4 节点</text>
<text x="721" y="254" font-size="14" fill="#1F2329">EP64 能整个放进一个域</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">PP</text>
<text x="271" y="292" font-size="14" fill="#1F2329">跨机首选</text>
<text x="721" y="292" font-size="14" fill="#1F2329">域内可少用，跨机柜仍用</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">DP</text>
<text x="271" y="330" font-size="14" fill="#1F2329">最外层，走网络</text>
<text x="721" y="330" font-size="14" fill="#1F2329">最外层，仍走网络</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">405B BF16 810 GB：8 张 H100 共 640 GB 放不下，8 张 GB200 共 1488 GB 放得下。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：Megatron-LM（SC 2021）；Llama 3；DeepSeek-V3；主编按拓扑推论</text>
</svg>