<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">上线三步：建 region，选 DAX 或系统内存，落成 NUMA 节点</text>
<text x="40" y="92" font-size="14" fill="#646A73">Linux 下把 CXL 内存交给程序用的路径</text>
<rect x="40" y="150" width="247" height="108" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">cxl create-region</text>
<text x="56" y="211" font-size="14" fill="#646A73">组装 memdev，-t ram</text>
<polyline points="293,204 325,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,198 325,204 315,210" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="108" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">DAX 设备</text>
<text x="347" y="211" font-size="14" fill="#646A73">/dev/daxN.Y，mmap 直接映射</text>
<polyline points="584,204 616,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,198 616,204 606,210" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="108" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">daxctl</text>
<text x="670" y="207" font-size="18" fill="#1F2329" font-weight="bold">reconfigure</text>
<text x="638" y="237" font-size="14" fill="#646A73">转 system-ram，破坏性</text>
<polyline points="875,204 907,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,198 907,204 897,210" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="108" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">NUMA 节点</text>
<text x="929" y="211" font-size="14" fill="#646A73">无 CPU，ZONE_MOVABLE</text>
<rect x="40" y="288" width="548" height="128" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="319" font-size="18" fill="#1F2329" font-weight="bold">分配</text>
<text x="56" y="349" font-size="14" fill="#646A73">默认先本地节点</text>
<text x="56" y="372" font-size="14" fill="#646A73">本地紧张才回落</text>
<text x="56" y="395" font-size="14" fill="#646A73">mems_allowed 限制容器</text>
<rect x="612" y="288" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="319" font-size="18" fill="#1F2329" font-weight="bold">降级</text>
<text x="628" y="349" font-size="14" fill="#646A73">demotion_enabled 优先远端节点</text>
<text x="628" y="372" font-size="14" fill="#646A73">v6.15 及以下不遵守 mems_allowed</text>
<text x="628" y="395" font-size="14" fill="#646A73">TPP 比 Linux 好 18%</text>
<rect x="40" y="445" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="474" font-size="15" fill="#1F2329">建议：停放 KV 的缓冲显式绑定到 CXL 节点或用 DAX 映射，不依赖自动降级（主编建议）。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：Linux 内核 CXL 文档（DAX、Page Allocator、Reclaim）；ndctl 文档</text>
</svg>