<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">池越大延迟越高：8 插槽 155ns，16 插槽 180ns</text>
<text x="40" y="92" font-size="14" fill="#646A73">Pond 图 7 的估算；本地 DRAM 为 85ns</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">本地 DRAM</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="331" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="579" y="168" font-size="13" fill="#646A73">  85ns</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">8 插槽 Pond 池</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="603" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="851" y="210" font-size="13" fill="#646A73">  155ns，182%</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">16 插槽 Pond 池</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="948" y="252" font-size="13" fill="#646A73">  180ns，212%</text>
<rect x="40" y="290" width="548" height="128" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="321" font-size="18" fill="#1F2329" font-weight="bold">组成</text>
<text x="56" y="351" font-size="14" fill="#646A73">CXL 端口往返约 25ns</text>
<text x="56" y="374" font-size="14" fill="#646A73">retimer 每方向约 10ns</text>
<text x="56" y="397" font-size="14" fill="#646A73">总延迟为各段之和</text>
<rect x="612" y="290" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="321" font-size="18" fill="#1F2329" font-weight="bold">真实设备</text>
<text x="628" y="351" font-size="14" fill="#646A73">CXL-A 比远端 DDR5 长 35%</text>
<text x="628" y="374" font-size="14" fill="#646A73">CXL-B、CXL-C 约 2 倍、3 倍</text>
<text x="628" y="397" font-size="14" fill="#646A73">由控制器设计决定</text>
<rect x="40" y="448" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="476" font-size="15" fill="#1F2329">对 GPU 的 KV 块拷贝：640 KiB 经 PCIe 约 10.24 微秒，90ns 只占 0.88%。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：Pond（ASPLOS 2023）图 7 与第 2、4 节；Demystifying CXL Memory 第 4 节</text>
