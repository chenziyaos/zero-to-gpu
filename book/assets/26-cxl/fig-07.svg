<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
<rect x="0" y="0" width="1200" height="640" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">池化分容量，共享才是多主机同时访问</text>
<text x="40" y="92" font-size="14" fill="#646A73">CXL 2.0 池化与 3.0 共享；Pond 的成本数据</text>
<rect x="40" y="150" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">池化（2.0 起）</text>
<text x="56" y="211" font-size="14" fill="#646A73">容量可分配给不同主机</text>
<text x="56" y="234" font-size="14" fill="#646A73">每段同一时刻只属一台主机</text>
<text x="56" y="257" font-size="14" fill="#646A73">MLD、多主机头设备</text>
<rect x="612" y="150" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">共享（3.0）</text>
<text x="628" y="211" font-size="14" fill="#646A73">多台主机同时访问同一块</text>
<text x="628" y="234" font-size="14" fill="#646A73">硬件保证看到最新数据</text>
<text x="628" y="257" font-size="14" fill="#646A73">fabric 最多 4096 个节点</text>
<rect x="40" y="308" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="334" font-size="14" fill="#1F2329" font-weight="bold">Pond 的数据</text>
<text x="598" y="334" font-size="14" fill="#1F2329" font-weight="bold">数值</text>
<rect x="40" y="350" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="373" font-size="14" fill="#1F2329" font-weight="bold">DRAM 占服务器成本</text>
<text x="598" y="373" font-size="14" fill="#1F2329">最多 50%</text>
<rect x="40" y="388" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="411" font-size="14" fill="#1F2329" font-weight="bold">搁浅的 DRAM</text>
<text x="598" y="411" font-size="14" fill="#1F2329">最多 25%</text>
<rect x="40" y="426" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="449" font-size="14" fill="#1F2329" font-weight="bold">够用的池规模</text>
<text x="598" y="449" font-size="14" fill="#1F2329">8 到 16 个插槽</text>
<rect x="40" y="464" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="487" font-size="14" fill="#1F2329" font-weight="bold">DRAM 成本下降</text>
<text x="598" y="487" font-size="14" fill="#1F2329">7%，性能差 1% 到 5%</text>
<rect x="40" y="532" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="560" font-size="15" fill="#1F2329">3.0 用增强一致性取代按偏置的一致性，Type 2 设备可以反向作废主机缓存。</text>
<text x="40" y="616" font-size="12" fill="#646A73">来源：CXL 3.0 白皮书；Linux 内核文档 Devices and Protocols；Pond（ASPLOS 2023）</text>
</svg>