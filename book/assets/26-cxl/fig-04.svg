<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570">
<rect x="0" y="0" width="1200" height="570" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">今天 KV 落在 CPU 一侧的 Type 3 内存，GPU 经 PCIe 到达</text>
<text x="40" y="92" font-size="14" fill="#646A73">CXL 设备三类；H100 服务器上的 KV 路径</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">类型</text>
<text x="243" y="176" font-size="14" fill="#1F2329" font-weight="bold">协议</text>
<text x="571" y="176" font-size="14" fill="#1F2329" font-weight="bold">HDM</text>
<text x="708" y="176" font-size="14" fill="#1F2329" font-weight="bold">例子</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">Type 1</text>
<text x="243" y="216" font-size="14" fill="#1F2329">io + cache</text>
<text x="571" y="216" font-size="14" fill="#1F2329">无</text>
<text x="708" y="216" font-size="14" fill="#1F2329">智能网卡</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">Type 2</text>
<text x="243" y="254" font-size="14" fill="#1F2329">io + cache + mem</text>
<text x="571" y="254" font-size="14" fill="#1F2329">有</text>
<text x="708" y="254" font-size="14" fill="#1F2329">带 HBM 的加速器</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">Type 3</text>
<text x="243" y="292" font-size="14" fill="#1F2329">io + mem</text>
<text x="571" y="292" font-size="14" fill="#1F2329">有</text>
<text x="708" y="292" font-size="14" fill="#1F2329">内存扩展卡、内存池</text>
<rect x="40" y="346" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="371" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="376" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="377" font-size="18" fill="#1F2329" font-weight="bold">HBM</text>
<text x="56" y="407" font-size="14" fill="#646A73">活跃 KV</text>
<polyline points="293,387 325,387" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,381 325,387 315,393" fill="#8F959E"/>
<rect x="331" y="346" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="371" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="376" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="377" font-size="18" fill="#1F2329" font-weight="bold">PCIe Gen5</text>
<text x="347" y="407" font-size="14" fill="#646A73">H100 规格页 128GB/s 双向</text>
<polyline points="584,387 616,387" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,381 616,387 606,393" fill="#8F959E"/>
<rect x="622" y="346" width="247" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="651" cy="371" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="651" y="376" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="377" font-size="18" fill="#1F2329" font-weight="bold">CPU</text>
<text x="638" y="407" font-size="14" fill="#646A73">内存控制器与 CXL 端口</text>
<polyline points="875,387 907,387" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,381 907,387 897,393" fill="#8F959E"/>
<rect x="913" y="346" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="371" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="376" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="377" font-size="18" fill="#1F2329" font-weight="bold">Type 3 卡</text>
<text x="929" y="407" font-size="14" fill="#646A73">CXL.mem</text>
<rect x="40" y="458" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="486" font-size="15" fill="#1F2329">NVIDIA 的 CPU 和 GPU 一致方案是 GH200 的 NVLink-C2C：900GB/s，规格页称比 PCIe Gen5 快 7 倍。</text>
<text x="40" y="546" font-size="12" fill="#646A73">来源：Linux 内核文档 Devices and Protocols；H100 与 GH200 规格页</text>
</svg>