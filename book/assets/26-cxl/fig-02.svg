<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">8 张 H100 只够 88.96 个 16K 请求，主机内存是下一层</text>
<text x="40" y="92" font-size="14" fill="#646A73">Llama 3 70B，BF16，TP8；每 token KV 327680 字节，16K 请求 5.369 GB</text>
<text x="258" y="168" font-size="14" fill="#1F2329" text-anchor="end">HBM 留给 KV（8 卡）</text>
<rect x="270" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="270" y="150" width="335" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="613" y="168" font-size="13" fill="#646A73">  477.6 GB，88.96 个</text>
<text x="258" y="210" font-size="14" fill="#1F2329" text-anchor="end">主机内存的一半</text>
<rect x="270" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="270" y="192" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="978" y="210" font-size="13" fill="#646A73">  2 TB 的一半，约 186 个</text>
<text x="258" y="252" font-size="14" fill="#1F2329" text-anchor="end">一张 128 GB CXL 卡</text>
<rect x="270" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="270" y="234" width="90" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="368" y="252" font-size="13" fill="#646A73">  约 23.8 个</text>
<rect x="40" y="290" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="319" font-size="15" fill="#1F2329">正在解码的请求的 KV 必须在 HBM；外层只停放暂时不用的 KV（空闲会话、共享前缀）。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：Llama 3 表 3；H100 规格页；DGX H100 用户指南；GPU-23 容量账；主编核算</text>
</svg>