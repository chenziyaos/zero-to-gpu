<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">同一条 PCIe 物理层上跑三个协议，方向各不相同</text>
<text x="40" y="92" font-size="14" fill="#646A73">CXL.io、CXL.cache、CXL.mem 的用途；版本与速率</text>
<rect x="40" y="150" width="357" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">CXL.io</text>
<text x="56" y="211" font-size="14" fill="#646A73">类似 PCIe 配置机制</text>
<text x="56" y="234" font-size="14" fill="#646A73">初始化、配置、I/O</text>
<rect x="421" y="150" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="181" font-size="18" fill="#1F2329" font-weight="bold">CXL.cache</text>
<text x="437" y="211" font-size="14" fill="#646A73">设备缓存主机内存</text>
<text x="437" y="234" font-size="14" fill="#646A73">例：智能网卡</text>
<rect x="803" y="150" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="181" font-size="18" fill="#1F2329" font-weight="bold">CXL.mem</text>
<text x="819" y="211" font-size="14" fill="#646A73">CPU 访问设备内存</text>
<text x="819" y="234" font-size="14" fill="#646A73">KV 停放用这一个</text>
<rect x="40" y="284" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="310" font-size="14" fill="#1F2329" font-weight="bold">版本</text>
<text x="243" y="310" font-size="14" fill="#1F2329" font-weight="bold">物理层</text>
<text x="462" y="310" font-size="14" fill="#1F2329" font-weight="bold">速率</text>
<text x="653" y="310" font-size="14" fill="#1F2329" font-weight="bold">新能力</text>
<rect x="40" y="326" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="350" font-size="14" fill="#1F2329" font-weight="bold">1.0 / 1.1</text>
<text x="243" y="350" font-size="14" fill="#1F2329">PCIe 5.0</text>
<text x="462" y="350" font-size="14" fill="#1F2329">32GT/s</text>
<text x="653" y="350" font-size="14" fill="#1F2329">三协议，直连</text>
<rect x="40" y="364" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="388" font-size="14" fill="#1F2329" font-weight="bold">2.0</text>
<text x="243" y="388" font-size="14" fill="#1F2329">PCIe 5.0</text>
<text x="462" y="388" font-size="14" fill="#1F2329">32GT/s</text>
<text x="653" y="388" font-size="14" fill="#1F2329">单级交换，池化</text>
<rect x="40" y="402" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="426" font-size="14" fill="#1F2329" font-weight="bold">3.0</text>
<text x="243" y="426" font-size="14" fill="#1F2329">PCIe 6.0</text>
<text x="462" y="426" font-size="14" fill="#1F2329">64GT/s</text>
<text x="653" y="426" font-size="14" fill="#1F2329">增强一致性，共享，fabric</text>
<rect x="40" y="440" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="464" font-size="14" fill="#1F2329" font-weight="bold">4.0</text>
<text x="243" y="464" font-size="14" fill="#1F2329"></text>
<text x="462" y="464" font-size="14" fill="#1F2329">128GT/s</text>
<text x="653" y="464" font-size="14" fill="#1F2329">带宽翻倍，向后兼容</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：Linux 内核文档 Devices and Protocols；CXL 3.0 白皮书；CXL 联盟 About CXL</text>
</svg>