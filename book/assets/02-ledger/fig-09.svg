<text x="56" y="535" font-size="15" fill="#1F2329">低精度把每个元素的字节数也一起减了：同一形状的 GEMM 换成 FP8，强度和拐点一起翻倍，分类不变。只有 B300 FP4 让 decode 越过拐点所需的批大小从约</text>
<text x="56" y="559" font-size="15" fill="#1F2329">296 升到约 475。</text>
