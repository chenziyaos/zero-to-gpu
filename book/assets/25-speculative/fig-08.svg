<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">四类草稿：模型类降延迟最多，n-gram 收益小但高峰不加负载</text>
<text x="40" y="92" font-size="14" fill="#646A73">vLLM 的 method 取值包括 draft_model、ngram、suffix、mtp、eagle3</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">草稿</text>
<text x="339" y="176" font-size="14" fill="#1F2329" font-weight="bold">c</text>
<text x="569" y="176" font-size="14" fill="#1F2329" font-weight="bold">α</text>
<text x="856" y="176" font-size="14" fill="#1F2329" font-weight="bold">适合</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">独立草稿模型</text>
<text x="339" y="216" font-size="14" fill="#1F2329">较高</text>
<text x="569" y="216" font-size="14" fill="#1F2329">取决于两模型多像</text>
<text x="856" y="216" font-size="14" fill="#1F2329">有同系列小模型</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">草稿头（EAGLE 等）</text>
<text x="339" y="254" font-size="14" fill="#1F2329">低</text>
<text x="569" y="254" font-size="14" fill="#1F2329">高</text>
<text x="856" y="254" font-size="14" fill="#1F2329">能为目标模型训练草稿</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">MTP</text>
<text x="339" y="292" font-size="14" fill="#1F2329">低</text>
<text x="569" y="292" font-size="14" fill="#1F2329">高</text>
<text x="856" y="292" font-size="14" fill="#1F2329">预训练时已带 MTP</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">n-gram、后缀</text>
<text x="339" y="330" font-size="14" fill="#1F2329">近零</text>
<text x="569" y="330" font-size="14" fill="#1F2329">随重复程度变化</text>
<text x="856" y="330" font-size="14" fill="#1F2329">代码、改写、检索问答</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">Lookahead 用 Jacobi 迭代自己产生 n-gram：MT-bench 最多 1.8 倍，代码补全多卡可达 4 倍。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：vLLM 文档 Speculative Decoding；Lookahead Decoding（ICML 2024）</text>
