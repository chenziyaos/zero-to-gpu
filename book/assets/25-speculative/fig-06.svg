<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510">
<rect x="0" y="0" width="1200" height="510" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">草稿头：读大模型的特征，α 更高、c 更低</text>
<text x="40" y="92" font-size="14" fill="#646A73">各论文报告的延迟加速（批大小很小时）</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">方法</text>
<text x="288" y="176" font-size="14" fill="#1F2329" font-weight="bold">做法</text>
<text x="848" y="176" font-size="14" fill="#1F2329" font-weight="bold">报告的加速</text>
<rect x="40" y="192" width="1120" height="60" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">Medusa</text>
<text x="288" y="216" font-size="14" fill="#1F2329">多个解码头 + 树注意力</text>
<text x="848" y="216" font-size="14" fill="#1F2329">Medusa-1 超过 2.2 倍，Medusa-2 2.3 到</text>
<text x="848" y="238" font-size="14" fill="#1F2329">2.8 倍</text>
<rect x="40" y="252" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="276" font-size="14" fill="#1F2329" font-weight="bold">EAGLE</text>
<text x="288" y="276" font-size="14" fill="#1F2329">在倒数第二层特征上自回归</text>
<text x="848" y="276" font-size="14" fill="#1F2329">LLaMA2-Chat 70B 2.7 到 3.5 倍</text>
<rect x="40" y="290" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="314" font-size="14" fill="#1F2329" font-weight="bold">EAGLE-2</text>
<text x="288" y="314" font-size="14" fill="#1F2329">按上下文动态展开草稿树</text>
<text x="848" y="314" font-size="14" fill="#1F2329">3.05 到 4.26 倍</text>
<rect x="40" y="328" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="352" font-size="14" fill="#1F2329" font-weight="bold">EAGLE-3</text>
<text x="288" y="352" font-size="14" fill="#1F2329">直接预测 token，融合多层特征</text>
<text x="848" y="352" font-size="14" fill="#1F2329">最高 6.5 倍</text>
<rect x="40" y="396" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="425" font-size="15" fill="#1F2329">草稿头要针对每个目标模型训练；模型微调或升级后要重训。</text>
<text x="40" y="486" font-size="12" fill="#646A73">来源：Medusa；EAGLE；EAGLE-2；EAGLE-3 论文</text>
