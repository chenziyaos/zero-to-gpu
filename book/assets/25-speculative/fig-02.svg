<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">批大小 1 时验证 8 个 token，算术强度仍远低于拐点</text>
<text x="40" y="92" font-size="14" fill="#646A73">只算权重部分的算术强度（FLOP/B），Llama 3 70B BF16，8 张 H100 SXM</text>
<text x="248" y="168" font-size="14" fill="#1F2329" text-anchor="end">生成 1 个 token</text>
<rect x="260" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="150" width="4" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="272" y="168" font-size="13" fill="#646A73">  约 1</text>
<text x="248" y="210" font-size="14" fill="#1F2329" text-anchor="end">验证 4 个（K = 3）</text>
<rect x="260" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="192" width="9" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="277" y="210" font-size="13" fill="#646A73">  约 4</text>
<text x="248" y="252" font-size="14" fill="#1F2329" text-anchor="end">验证 8 个（K = 7）</text>
<rect x="260" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="234" width="19" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="287" y="252" font-size="13" fill="#646A73">  约 8</text>
<text x="248" y="294" font-size="14" fill="#1F2329" text-anchor="end">H100 BF16 拐点</text>
<rect x="260" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="276" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="968" y="294" font-size="13" fill="#646A73">  约 295</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">每步光读每卡 17.65 GB 权重就要约 5.27 ms；多验证几个 token，这个时间几乎不变。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：H100 产品页（稀疏口径减半）；GPU-23 第 4 章；本篇推算</text>
</svg>