<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">投机解码：先猜几个 token，大模型一步验证，输出分布不变</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇各章的位置</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">草稿</text>
<text x="56" y="211" font-size="14" fill="#646A73">小模型、草稿头、MTP 或</text>
<text x="56" y="234" font-size="14" fill="#646A73">n-gram 猜 K 个（第 4 到 7 章）</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">验证</text>
<text x="347" y="211" font-size="14" fill="#646A73">大模型一次算 K+1 个位置（第 1</text>
<text x="347" y="234" font-size="14" fill="#646A73">章）</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">接受</text>
<text x="638" y="211" font-size="14" fill="#646A73">min(1, p ÷ q)，被拒重采样（</text>
<text x="638" y="234" font-size="14" fill="#646A73">第 2 章）</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">回滚</text>
<text x="929" y="211" font-size="14" fill="#646A73">作废被拒位置之后的 KV（第 9</text>
<text x="929" y="234" font-size="14" fill="#646A73">章）</text>
<rect x="40" y="284" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">收益</text>
<text x="56" y="346" font-size="14" fill="#646A73">(1 − α 的 K+1 次方) ÷ (1 − α)</text>
<text x="56" y="369" font-size="14" fill="#646A73">再除以 (Kc + 1)（第 3 章）</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">前提</text>
<text x="437" y="346" font-size="14" fill="#646A73">解码有算力富余</text>
<text x="437" y="369" font-size="14" fill="#646A73">批变大收益缩水（第 8 章）</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">时间账</text>
<text x="819" y="346" font-size="14" fill="#646A73">W_mem 换成 T_compute</text>
<text x="819" y="369" font-size="14" fill="#646A73">多一点计算，少几次读权重</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Leviathan 等；Chen 等；EAGLE 系列；DeepSeek-V3；vLLM 文档</text>
</svg>