<g id="a1:24" transform="translate(56, 637.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">任何时刻输出分布严格 = 大模型自己生成的分布（数学等价）；收益 = (1+αK) / (1+ρK)，α 是接受率，ρ 是 draft 代价</tspan></tspan></text></g>
