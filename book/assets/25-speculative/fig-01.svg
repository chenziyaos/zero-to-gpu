<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="740" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">Decode 是带宽约束，算力富余可白送给草稿模型</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">Roofline 左侧：Decode 算术强度 ＜1 FLOP/B，算力利用率 5-10%；SpecDec 把这份富余换成吞吐</tspan></tspan></text></g>
<g id="o1:2" transform="translate(40, 190)"><rect x="0" y="0" width="545" height="200" fill="#fef1f1" stroke="#f98e8b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:3" transform="translate(180.5, 201.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="middle" dominant-baseline="alphabetic" x="131.5"><tspan x="131.5" y="16.471"><tspan x="19.205" text-anchor="start">标准 decode：1 forward / 1 token</tspan></tspan></text></g>
<g id="a1:4" transform="translate(235, 229.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="77"><tspan x="77" y="14.118"><tspan x="2.695" text-anchor="start">带宽限 → 算力 ~5-10% 利用</tspan></tspan></text></g>
<g id="o1:3" transform="translate(100, 280)"><rect x="0" y="0" width="200" height="50" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="6" ry="6"/></g>
