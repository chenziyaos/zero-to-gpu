<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">独立草稿模型：即插即用，α 和 c 要在目标任务上一起量</text>
<text x="40" y="92" font-size="14" fill="#646A73">两篇奠基论文的结果</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">论文</text>
<text x="347" y="176" font-size="14" fill="#1F2329" font-weight="bold">目标模型</text>
<text x="671" y="176" font-size="14" fill="#1F2329" font-weight="bold">结果</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">Leviathan 等</text>
<text x="347" y="216" font-size="14" fill="#1F2329">T5-XXL</text>
<text x="671" y="216" font-size="14" fill="#1F2329">加速 2 到 3 倍，输出相同；c 总小于 0.05</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">Chen 等</text>
<text x="347" y="254" font-size="14" fill="#1F2329">Chinchilla 70B</text>
<text x="671" y="254" font-size="14" fill="#1F2329">分布式部署下加速 2 到 2.5 倍，不损失质量</text>
<rect x="40" y="298" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="329" font-size="18" fill="#1F2329" font-weight="bold">好处</text>
<text x="56" y="359" font-size="14" fill="#646A73">词表一致即可，不改大模型</text>
<text x="56" y="382" font-size="14" fill="#646A73">不需要额外训练</text>
<rect x="612" y="298" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="329" font-size="18" fill="#1F2329" font-weight="bold">代价</text>
<text x="628" y="359" font-size="14" fill="#646A73">α 不易高，c 不可忽略</text>
<text x="628" y="382" font-size="14" fill="#646A73">K = 3 时 c 从 0.05 到 0.2，分母 1.15 变 1.6</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：Leviathan 等（ICML 2023）；Chen 等（arXiv 预印本）</text>
</svg>