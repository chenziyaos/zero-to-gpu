<g id="a1:28" transform="translate(56, 787.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">为什么只 N=1？K＞1 时代价 ρ 翻倍但 α 边际效用最快饱和（K=2 时 α 跌至 75%）；1.85× 已经是 sweet spot</tspan></tspan></text></g>
