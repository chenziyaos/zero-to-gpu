<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">MTP：训练时多预测几个 token，推理时拿来当草稿</text>
<text x="40" y="92" font-size="14" fill="#646A73">DeepSeek-V3 的顺序 MTP 与 Gloeckle 等的并行输出头</text>
<rect x="40" y="150" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">Gloeckle 等</text>
<text x="56" y="211" font-size="14" fill="#646A73">n 个独立输出头并行预测</text>
<text x="56" y="234" font-size="14" fill="#646A73">4 token 预测的模型推理最快 3 倍</text>
<text x="56" y="257" font-size="14" fill="#646A73">批大小较大时也成立</text>
<rect x="612" y="150" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">DeepSeek-V3</text>
<text x="628" y="211" font-size="14" fill="#646A73">顺序预测，每个深度保留因果链</text>
<text x="628" y="234" font-size="14" fill="#646A73">共享嵌入层和输出头</text>
<text x="628" y="257" font-size="14" fill="#646A73">第二个 token 接受率 85% 到 90%，1.8 倍</text>
<rect x="40" y="308" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="336" font-size="15" fill="#1F2329">推理时 MTP 模块可以丢掉，主模型照常工作；也可以用于投机解码。已训好的模型没法补上 MTP。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：Gloeckle 等（ICML 2024）；DeepSeek-V3 技术报告</text>
</svg>