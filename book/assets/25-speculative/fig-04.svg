<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">α = 0.85 时，K 从 1 加到 7，期望前进数从 1.85 涨到 4.85</text>
<text x="40" y="92" font-size="14" fill="#646A73">每次验证期望前进的 token 数，括号内为 c = 0.05 时的时间改进倍数</text>
<text x="208" y="168" font-size="14" fill="#1F2329" text-anchor="end">K = 1</text>
<rect x="220" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="150" width="194" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="422" y="168" font-size="13" fill="#646A73">  1.85</text>
<text x="208" y="210" font-size="14" fill="#1F2329" text-anchor="end">K = 3</text>
<rect x="220" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="192" width="335" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="563" y="210" font-size="13" fill="#646A73">  3.19（2.77 倍）</text>
<text x="208" y="252" font-size="14" fill="#1F2329" text-anchor="end">K = 7</text>
<rect x="220" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="234" width="509" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="737" y="252" font-size="13" fill="#646A73">  4.85（3.59 倍）</text>
<text x="208" y="294" font-size="14" fill="#1F2329" text-anchor="end">K 趋于无穷</text>
<rect x="220" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="276" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="928" y="294" font-size="13" fill="#646A73">  上限 6.67</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">α = 0.90 时分别为 1.90、3.44、5.70，上限 10.00。实际 α 随位置下降，长 K 的收益要按实测算。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：Leviathan 等，式 (1) 与定理 3.8；DeepSeek-V3（α 为 85% 到 90%）；本篇推算</text>
</svg>