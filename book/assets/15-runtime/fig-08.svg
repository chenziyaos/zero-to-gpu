<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
<rect x="0" y="0" width="1200" height="640" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">收益来自哪里：融合和内联是主体，CUDA Graphs 排在后面</text>
<text x="40" y="92" font-size="14" fill="#646A73">A100、float16 HuggingFace 模型，相对 eager 的几何平均加速</text>
<rect x="260" y="139" width="14" height="14" rx="3" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="280" y="150" font-size="13" fill="#646A73">推理</text>
<rect x="330" y="139" width="14" height="14" rx="3" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="350" y="150" font-size="13" fill="#646A73">训练</text>
<text x="248" y="202" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">全部打开</text>
<rect x="260" y="174" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="174" width="850" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="1118" y="189" font-size="13" fill="#646A73">1.91×</text>
<rect x="260" y="200" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="200" width="646" height="20" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="914" y="215" font-size="13" fill="#646A73">1.45×</text>
<text x="248" y="270" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">去掉 CUDA Graphs</text>
<rect x="260" y="242" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="242" width="806" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="1074" y="257" font-size="13" fill="#646A73">1.81×</text>
<rect x="260" y="268" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="268" width="610" height="20" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="878" y="283" font-size="13" fill="#646A73">1.37×</text>
<text x="248" y="338" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">去掉融合</text>
<rect x="260" y="310" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="310" width="748" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="1016" y="325" font-size="13" fill="#646A73">1.68×</text>
<rect x="260" y="336" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="336" width="565" height="20" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="833" y="351" font-size="13" fill="#646A73">1.27×</text>
<text x="248" y="406" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">去掉内联</text>
<rect x="260" y="378" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="378" width="703" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="971" y="393" font-size="13" fill="#646A73">1.58×</text>
<rect x="260" y="404" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="404" width="583" height="20" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="851" y="419" font-size="13" fill="#646A73">1.31×</text>
<text x="248" y="474" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">融合和内联都去掉</text>
<rect x="260" y="446" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="446" width="356" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="624" y="461" font-size="13" fill="#646A73">0.8×</text>
<rect x="260" y="472" width="850" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="472" width="263" height="20" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="531" y="487" font-size="13" fill="#646A73">0.59×</text>
<rect x="40" y="528" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="557" font-size="15" fill="#1F2329">两项都去掉时比 eager 还慢；单独去掉一项损失有限，说明两者都在减少中间结果的读写和核的个数。</text>
<text x="40" y="616" font-size="12" fill="#646A73">来源：Ansel et al., PyTorch 2 (ASPLOS 2024) 表 4</text>
</svg>