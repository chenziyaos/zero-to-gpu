<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">异步执行：CPU 排队就返回，不同步的计时只量到排队</text>
<text x="40" y="92" font-size="14" fill="#646A73">示意图：同一设备按入队顺序执行</text>
<text x="128" y="182" font-size="14" fill="#1F2329" text-anchor="end">CPU</text>
<rect x="140" y="160" width="1020" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="140" y="163" width="102" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="191" y="182" font-size="12" fill="#245BDB" text-anchor="middle">发射 A</text>
<rect x="242" y="163" width="102" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="293" y="182" font-size="12" fill="#245BDB" text-anchor="middle">发射 B</text>
<rect x="344" y="163" width="102" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="395" y="182" font-size="12" fill="#245BDB" text-anchor="middle">发射 C</text>
<rect x="446" y="163" width="102" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="497" y="182" font-size="12" fill="#646A73" text-anchor="middle">返回</text>
<text x="128" y="230" font-size="14" fill="#1F2329" text-anchor="end">GPU</text>
<rect x="140" y="208" width="1020" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="242" y="211" width="306" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="395" y="230" font-size="12" fill="#2EA121" text-anchor="middle">执行 A</text>
<rect x="548" y="211" width="306" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="701" y="230" font-size="12" fill="#2EA121" text-anchor="middle">执行 B</text>
<rect x="854" y="211" width="306" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="1007" y="230" font-size="12" fill="#2EA121" text-anchor="middle">执行 C</text>
<rect x="40" y="278" width="1120" height="73" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="307" font-size="15" fill="#1F2329">time.time() 在 CPU 返回时停表，量到的只是排队；用 torch.cuda.Event 计时，或计时前后 torch.cuda.synchronize()。调试时</text>
<text x="56" y="331" font-size="15" fill="#1F2329">CUDA_LAUNCH_BLOCKING=1 让报错落在出问题的那一行。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：PyTorch, CUDA semantics（Asynchronous execution）</text>
</svg>