<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">CUDA Graphs：录一次、重放多次，有的违规不会报错</text>
<text x="40" y="92" font-size="14" fill="#646A73">重放跳过 Python、C++ 和驱动开销，整图一次 cudaGraphLaunch</text>
<rect x="40" y="150" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">热身</text>
<text x="56" y="211" font-size="14" fill="#646A73">旁路流上跑几轮 eager</text>
<polyline points="390,191 422,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,185 422,191 412,197" fill="#8F959E"/>
<rect x="428" y="150" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="457" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="457" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="476" y="181" font-size="18" fill="#1F2329" font-weight="bold">捕获</text>
<text x="444" y="211" font-size="14" fill="#646A73">torch.cuda.graph(g)，工作只记录不执行</text>
<polyline points="778,191 810,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,185 810,191 800,197" fill="#8F959E"/>
<rect x="816" y="150" width="344" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="845" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="845" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="864" y="181" font-size="18" fill="#1F2329" font-weight="bold">重放</text>
<text x="832" y="211" font-size="14" fill="#646A73">新数据拷进固定输入张量，g.replay()</text>
<rect x="40" y="272" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="303" font-size="18" fill="#1F2329" font-weight="bold">违反会报错</text>
<text x="56" y="333" font-size="14" fill="#646A73">同步 CPU 的操作，如 .item()</text>
<text x="56" y="356" font-size="14" fill="#646A73">动态控制流（GPU 数据用 torch.cond 除外）</text>
<rect x="612" y="272" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="303" font-size="18" fill="#1F2329" font-weight="bold">违反会悄悄出错</text>
<text x="628" y="333" font-size="14" fill="#646A73">CPU 上的工作不录，重放时被跳过</text>
<text x="628" y="356" font-size="14" fill="#646A73">动态形状：图假定每次大小和布局相同</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：PyTorch, CUDA semantics（CUDA Graphs、Constraints）</text>
</svg>