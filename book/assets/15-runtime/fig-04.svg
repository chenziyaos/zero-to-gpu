<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">多流：拷贝和计算重叠，正确性靠用户维护</text>
<text x="40" y="92" font-size="14" fill="#646A73">示意图：拷贝流提前搬下一批，计算流处理当前批</text>
<text x="138" y="182" font-size="14" fill="#1F2329" text-anchor="end">拷贝流</text>
<rect x="150" y="160" width="1010" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="150" y="163" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="276" y="182" font-size="12" fill="#245BDB" text-anchor="middle">H2D 批 1</text>
<rect x="402" y="163" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="529" y="182" font-size="12" fill="#245BDB" text-anchor="middle">H2D 批 2</text>
<rect x="655" y="163" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="781" y="182" font-size="12" fill="#245BDB" text-anchor="middle">H2D 批 3</text>
<text x="138" y="230" font-size="14" fill="#1F2329" text-anchor="end">计算流</text>
<rect x="150" y="208" width="1010" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="402" y="211" width="252" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="529" y="230" font-size="12" fill="#2EA121" text-anchor="middle">计算批 1</text>
<rect x="655" y="211" width="252" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="781" y="230" font-size="12" fill="#2EA121" text-anchor="middle">计算批 2</text>
<rect x="908" y="211" width="252" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="1034" y="230" font-size="12" fill="#2EA121" text-anchor="middle">计算批 3</text>
<rect x="40" y="272" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="303" font-size="18" fill="#1F2329" font-weight="bold">wait_stream</text>
<text x="56" y="333" font-size="14" fill="#646A73">计算流等拷贝流把这一批搬完</text>
<text x="56" y="356" font-size="14" fill="#646A73">等待放在真正需要结果的地方</text>
<rect x="612" y="272" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="303" font-size="18" fill="#1F2329" font-weight="bold">record_stream</text>
<text x="628" y="333" font-size="14" fill="#646A73">登记张量也在另一条流上使用</text>
<text x="628" y="356" font-size="14" fill="#646A73">防止显存被分配器提前复用</text>
<rect x="40" y="406" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="435" font-size="15" fill="#1F2329">H2D 方向 non_blocking=True 是安全的；D2H 要同步后再读。先 pin_memory() 再拷，可能比直接 to(device) 慢一倍。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：PyTorch, CUDA semantics（CUDA streams、pinned memory）；PyTorch Tutorials, non_blocking and pin_memory()</text>
</svg>