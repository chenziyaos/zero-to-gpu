<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">torch.compile 三层：抓图、切前后向、生成 Triton 核</text>
<text x="40" y="92" font-size="14" fill="#646A73">guard 横跨三层，不满足就重新抓图编译</text>
<rect x="40" y="150" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">TorchDynamo</text>
<text x="56" y="211" font-size="14" fill="#646A73">PEP 523 帧求值钩子，改写字节码抽出 FX 图</text>
<polyline points="390,191 422,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,185 422,191 412,197" fill="#8F959E"/>
<rect x="428" y="150" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="457" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="457" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="476" y="181" font-size="18" fill="#1F2329" font-weight="bold">AOTAutograd</text>
<text x="444" y="211" font-size="14" fill="#646A73">联合图，min-cut 切成前向图和反向图</text>
<polyline points="778,191 810,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,185 810,191 800,197" fill="#8F959E"/>
<rect x="816" y="150" width="344" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="845" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="845" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="864" y="181" font-size="18" fill="#1F2329" font-weight="bold">TorchInductor</text>
<text x="832" y="211" font-size="14" fill="#646A73">GPU 上生成 Triton，CPU 上生成 C++</text>
<rect x="40" y="272" width="1120" height="73" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="300" font-size="15" fill="#1F2329">A100、180 多个真实模型：推理 2.27 倍、训练 1.41 倍（几何平均，相对 eager）。mode：default、reduce-overhead（用 CUDA graphs，多占显存）、</text>
<text x="56" y="324" font-size="15" fill="#1F2329">max-autotune、max-autotune-no-cudagraphs。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：Ansel et al., PyTorch 2 (ASPLOS 2024)；PyTorch Dynamo Overview；torch.compile 文档</text>
</svg>