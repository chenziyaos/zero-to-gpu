<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">编译收益漏在两处：断图和重编译</text>
<text x="40" y="92" font-size="14" fill="#646A73">断图把融合范围切小；重编译超过上限后悄悄退回 eager</text>
<rect x="40" y="140" width="548" height="174" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">graph break</text>
<text x="56" y="201" font-size="14" fill="#646A73">依赖张量值的 if、以张量为条件的循环</text>
<text x="56" y="224" font-size="14" fill="#646A73">.item()、.data_ptr</text>
<text x="56" y="247" font-size="14" fill="#646A73">非动态模式下返回动态形状的算子</text>
<text x="56" y="270" font-size="14" fill="#646A73">查：TORCH_LOGS="graph_breaks"</text>
<text x="56" y="293" font-size="14" fill="#646A73">守：fullgraph=True，断图即报错</text>
<rect x="612" y="140" width="548" height="174" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">guard 与重编译</text>
<text x="628" y="201" font-size="14" fill="#646A73">检查类、dtype、device、requires_grad</text>
<text x="628" y="224" font-size="14" fill="#646A73">维数、各维大小、步长</text>
<text x="628" y="247" font-size="14" fill="#646A73">不满足就重新抓图编译</text>
<text x="628" y="270" font-size="14" fill="#646A73">文档示例：缓存上限 8 后停止</text>
<text x="628" y="293" font-size="14" fill="#646A73">之后该函数以 eager 运行</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：PyTorch, torch.compile Troubleshooting；Dynamo Overview；torch.compile 文档</text>
</svg>