<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">GPU 等 CPU：同步、拷贝、发射三个来源，各有对策</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇处理 W_host 里由 PyTorch 运行时产生的部分，并用融合减少 W_mem</text>
<rect x="40" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">测对</text>
<text x="56" y="211" font-size="14" fill="#646A73">异步执行，事件计时（第</text>
<text x="56" y="234" font-size="14" fill="#646A73">1、8 章）</text>
<polyline points="235,202 267,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,196 267,202 257,208" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">去同步</text>
<text x="289" y="211" font-size="14" fill="#646A73">.item() 等同步点（第</text>
<text x="289" y="234" font-size="14" fill="#646A73">2 章）</text>
<polyline points="468,202 500,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,196 500,202 490,208" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">多流</text>
<text x="522" y="211" font-size="14" fill="#646A73">拷贝与计算重叠（第 3</text>
<text x="522" y="234" font-size="14" fill="#646A73">章）</text>
<polyline points="700,202 732,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,196 732,202 722,208" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">CUDA Graphs</text>
<text x="754" y="211" font-size="14" fill="#646A73">一次提交整图（第 4 章）</text>
<polyline points="933,202 965,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,196 965,202 955,208" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">torch.compile</text>
<text x="987" y="211" font-size="14" fill="#646A73">抓图、融合、查断点（第</text>
<text x="987" y="234" font-size="14" fill="#646A73">5 到 7 章）</text>
<rect x="40" y="294" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">按时间线上最大的问题选方案，一次只加一项（第 9 章）。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：PyTorch CUDA semantics；torch.compile 文档；PyTorch 2 论文（ASPLOS 2024）；NVIDIA CUDA Graphs 博客</text>
</svg>