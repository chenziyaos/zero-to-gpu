<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">访存层级：延迟差一个数量级，搬运粒度各不相同</text>
<text x="40" y="92" font-size="14" fill="#646A73">H800 PCIe 上的实测延迟（时钟周期）和 H100 的容量；粒度一列是本篇要算的东西</text>
<rect x="40" y="130" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="156" font-size="14" fill="#1F2329" font-weight="bold">层级</text>
<text x="231" y="156" font-size="14" fill="#1F2329" font-weight="bold">H800 延迟（周期）</text>
<text x="455" y="156" font-size="14" fill="#1F2329" font-weight="bold">H100 容量</text>
<text x="702" y="156" font-size="14" fill="#1F2329" font-weight="bold">搬运粒度</text>
<rect x="40" y="172" width="1120" height="38" rx="0" fill="#FEF1F1" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="196" font-size="14" fill="#1F2329" font-weight="bold">全局内存（HBM）</text>
<text x="231" y="196" font-size="14" fill="#1F2329">478.8</text>
<text x="455" y="196" font-size="14" fill="#1F2329">80 GB（SXM）</text>
<text x="702" y="196" font-size="14" fill="#1F2329">32 字节事务（sector）</text>
<rect x="40" y="210" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="234" font-size="14" fill="#1F2329" font-weight="bold">L2 缓存</text>
<text x="231" y="234" font-size="14" fill="#1F2329">263.0</text>
<text x="455" y="234" font-size="14" fill="#1F2329">50 MB，全卡共享</text>
<text x="702" y="234" font-size="14" fill="#1F2329">128 字节缓存行 = 4 个 sector</text>
<rect x="40" y="248" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="272" font-size="14" fill="#1F2329" font-weight="bold">L1 缓存</text>
<text x="231" y="272" font-size="14" fill="#1F2329">40.7</text>
<text x="455" y="272" font-size="14" fill="#1F2329">与共享内存共用每 SM 的片上存储</text>
<text x="702" y="272" font-size="14" fill="#1F2329">128 字节缓存行</text>
<rect x="40" y="286" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="310" font-size="14" fill="#1F2329" font-weight="bold">共享内存</text>
<text x="231" y="310" font-size="14" fill="#1F2329">29.0</text>
<text x="455" y="310" font-size="14" fill="#1F2329">每 SM 最多 228 KB</text>
<text x="702" y="310" font-size="14" fill="#1F2329">32 个 bank，每 bank 每周期 32 位</text>
<rect x="40" y="354" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="383" font-size="15" fill="#1F2329">延迟可以靠更多在途请求藏住（GPU-01），带宽藏不住：多搬的每个 sector 都实打实占用带宽。</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：Luo et al. 2024 表 IV；NVIDIA Hopper Tuning Guide；CUDA Programming Guide</text>
</svg>