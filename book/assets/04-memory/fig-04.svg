<rect x="270" y="394" width="514" height="20" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="792" y="409" font-size="13" fill="#646A73">97.6 GB/s</text>
<text x="258" y="464" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">transposeNoBankConflicts</text>
