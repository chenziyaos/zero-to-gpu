<rect x="40" y="512" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="541" font-size="15" fill="#1F2329">M2050 上最终版是拷贝的 99.5 ÷ 105.2 ≈ 94.6%；只合并写、不消冲突时只有 51.3 GB/s。</text>
<text x="40" y="596" font-size="12" fill="#646A73">来源：Harris, An Efficient Matrix Transpose in CUDA C/C++（NVIDIA 技术博客）</text>
</svg>