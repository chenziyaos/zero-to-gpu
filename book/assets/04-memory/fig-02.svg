<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">步长决定 sector 数：同样 128 字节有用数据，搬 4 到 32 个 sector</text>
<text x="40" y="92" font-size="14" fill="#646A73">一个 warp 的 32 个线程各读一个 4 字节 float；括号里是有效字节占比 = 128 ÷（sector 数 × 32）</text>
<text x="288" y="158" font-size="14" fill="#1F2329" text-anchor="end">连续且对齐（100%）</text>
<rect x="300" y="140" width="588" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="140" width="73" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="381" y="158" font-size="13" fill="#646A73">4 个 sector  </text>
<text x="288" y="200" font-size="14" fill="#1F2329" text-anchor="end">连续但错位（80%）</text>
<rect x="300" y="182" width="588" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="182" width="92" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="400" y="200" font-size="13" fill="#646A73">5 个 sector  </text>
<text x="288" y="242" font-size="14" fill="#1F2329" text-anchor="end">步长 2（50%）</text>
<rect x="300" y="224" width="588" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="224" width="147" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="455" y="242" font-size="13" fill="#646A73">8 个 sector  </text>
<text x="288" y="284" font-size="14" fill="#1F2329" text-anchor="end">步长 4（25%）</text>
<rect x="300" y="266" width="588" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="266" width="294" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="602" y="284" font-size="13" fill="#646A73">16 个 sector  </text>
<text x="288" y="326" font-size="14" fill="#1F2329" text-anchor="end">步长 8 及以上（12.5%）</text>
<rect x="300" y="308" width="588" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="308" width="588" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="896" y="326" font-size="13" fill="#646A73">32 个 sector  每个线程独占一个 sector</text>
<rect x="40" y="370" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="399" font-size="15" fill="#1F2329">用 ncu 的 sectors ÷ requests 验证：连续读是 4，步长 8 以上是 32。</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：NVIDIA CUDA C++ Best Practices Guide 10.2.1；步长 4 一行按同样规则推导</text>
</svg>