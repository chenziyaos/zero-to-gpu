<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">softmax 不融合：DRAM 读写约是融合版的 4 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">M 行 N 列的输入，按读写的元素数计；N 远大于 1 时忽略 2M、4M 这类按行计的项</text>
<text x="248" y="158" font-size="14" fill="#1F2329" text-anchor="end">逐步实现：读</text>
<rect x="260" y="140" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="140" width="700" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="968" y="158" font-size="13" fill="#646A73">5 MN  5MN + 2M</text>
<text x="248" y="200" font-size="14" fill="#1F2329" text-anchor="end">逐步实现：写</text>
<rect x="260" y="182" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="182" width="420" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="688" y="200" font-size="13" fill="#646A73">3 MN  3MN + 2M</text>
<text x="248" y="242" font-size="14" fill="#1F2329" text-anchor="end">融合 kernel：读</text>
<rect x="260" y="224" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="224" width="140" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="408" y="242" font-size="13" fill="#646A73">1 MN  MN</text>
<text x="248" y="284" font-size="14" fill="#1F2329" text-anchor="end">融合 kernel：写</text>
<rect x="260" y="266" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="266" width="140" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="408" y="284" font-size="13" fill="#646A73">1 MN  MN</text>
<rect x="40" y="328" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="357" font-size="15" fill="#1F2329">理论加速约 (8MN + 4M) ÷ 2MN ≈ 4 倍；能不能拿到，取决于一行能不能放进片上存储。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：Triton 教程 Fused Softmax</text>
</svg>