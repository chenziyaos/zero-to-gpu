<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570">
<rect x="0" y="0" width="1200" height="570" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">归约七步：G80 上从 2.083 GB/s 到 62.671 GB/s，累计 30.04 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">4M 个 int 的归约，每块 128 线程；G80 的理论带宽 86.4 GB/s</text>
<text x="278" y="158" font-size="14" fill="#1F2329" text-anchor="end">1 交错寻址，分支发散</text>
<rect x="290" y="140" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="140" width="16" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="314" y="158" font-size="13" fill="#646A73">2.083 GB/s  </text>
<text x="278" y="200" font-size="14" fill="#1F2329" text-anchor="end">2 交错寻址，bank 冲突</text>
<rect x="290" y="182" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="182" width="38" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="336" y="200" font-size="13" fill="#646A73">4.854 GB/s  </text>
<text x="278" y="242" font-size="14" fill="#1F2329" text-anchor="end">3 顺序寻址</text>
<rect x="290" y="224" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="224" width="75" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="373" y="242" font-size="13" fill="#646A73">9.741 GB/s  </text>
<text x="278" y="284" font-size="14" fill="#1F2329" text-anchor="end">4 加载时先加一次</text>
<rect x="290" y="266" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="266" width="134" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="432" y="284" font-size="13" fill="#646A73">17.377 GB/s  </text>
<text x="278" y="326" font-size="14" fill="#1F2329" text-anchor="end">5 展开最后一个 warp</text>
<rect x="290" y="308" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="308" width="242" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="540" y="326" font-size="13" fill="#646A73">31.289 GB/s  </text>
<text x="278" y="368" font-size="14" fill="#1F2329" text-anchor="end">6 完全展开</text>
<rect x="290" y="350" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="350" width="340" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="638" y="368" font-size="13" fill="#646A73">43.996 GB/s  </text>
<text x="278" y="410" font-size="14" fill="#1F2329" text-anchor="end">7 每线程多个元素</text>
<rect x="290" y="392" width="668" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="290" y="392" width="485" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="783" y="410" font-size="13" fill="#646A73">62.671 GB/s  累计 30.04 倍</text>
<line x1="958" y1="132" x2="958" y2="426" stroke="#F98E8B" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="958" y="126" font-size="12" fill="#D83931" text-anchor="middle">理论 86.4</text>
<rect x="40" y="462" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="491" font-size="15" fill="#1F2329">第 4 步起每个线程先在寄存器里加，空闲线程和指令开销成了主角；32M 元素时第 7 版达到 73 GB/s。</text>
<text x="40" y="546" font-size="12" fill="#646A73">来源：Harris, Optimizing Parallel Reduction in CUDA（NVIDIA，2007）</text>
</svg>