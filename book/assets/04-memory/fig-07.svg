<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">L2 持久化：窗口 × hitRatio 不要超过 set-aside</text>
<text x="40" y="92" font-size="14" fill="#646A73">编程指南的例子：set-aside 16 KB，访问策略窗口 32 KB</text>
<rect x="40" y="140" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">hitRatio = 0.5</text>
<text x="56" y="201" font-size="14" fill="#646A73">硬件随机挑窗口里的 16 KB 标为持久化</text>
<text x="56" y="224" font-size="14" fill="#646A73">正好装进 16 KB 的 set-aside</text>
<rect x="421" y="140" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="450" cy="165" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="450" y="170" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="469" y="171" font-size="18" fill="#1F2329" font-weight="bold">hitRatio = 1.0</text>
<text x="437" y="201" font-size="14" fill="#646A73">硬件想把 32 KB 全塞进 16 KB</text>
<text x="437" y="224" font-size="14" fill="#646A73">持久化的缓存行互相驱逐</text>
<rect x="803" y="140" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="832" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="832" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="851" y="171" font-size="18" fill="#1F2329" font-weight="bold">两个 stream 各 16 KB 窗口</text>
<text x="819" y="201" font-size="14" fill="#646A73">都取 1.0：争同一块 set-aside，互相驱逐</text>
<text x="819" y="224" font-size="14" fill="#646A73">都取 0.5：不容易驱逐彼此</text>
<rect x="40" y="280" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="309" font-size="15" fill="#1F2329">估算办法：所有并发窗口的“窗口大小 × hitRatio”之和不超过 set-aside；阶段结束用 cudaCtxResetPersistingL2Cache 清掉。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：NVIDIA CUDA Programming Guide, L2 Cache Control</text>
</svg>