<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">六级路线：L1 到 L5 由内向外，L6 把同一本账推到新硬件</text>
<text x="40" y="92" font-size="14" fill="#646A73">每级消掉一类等待，把瓶颈交给下一级</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">级别</text>
<text x="267" y="176" font-size="14" fill="#1F2329" font-weight="bold">篇</text>
<text x="555" y="176" font-size="14" fill="#1F2329" font-weight="bold">谁在等什么</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">L1 硬件与内核</text>
<text x="267" y="216" font-size="14" fill="#1F2329">GPU-01 到 GPU-08</text>
<text x="555" y="216" font-size="14" fill="#1F2329">计算单元等数据</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">L2 系统与驱动</text>
<text x="267" y="254" font-size="14" fill="#1F2329">GPU-09 到 GPU-12</text>
<text x="555" y="254" font-size="14" fill="#1F2329">GPU 等主机和环境</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">L3 单机</text>
<text x="267" y="292" font-size="14" fill="#1F2329">GPU-13 到 GPU-16</text>
<text x="555" y="292" font-size="14" fill="#1F2329">卡等卡、GPU 等 CPU 发射</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">L4 集群</text>
<text x="267" y="330" font-size="14" fill="#1F2329">GPU-17 到 GPU-20</text>
<text x="555" y="330" font-size="14" fill="#1F2329">卡等网络、计算等通信、任务等调度、作业等故障恢复</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">L5 LLM infra</text>
<text x="267" y="368" font-size="14" fill="#1F2329">GPU-21 到 GPU-24</text>
<text x="555" y="368" font-size="14" fill="#1F2329">并行的通信与气泡、等最慢的专家、decode 等权重与 KV</text>
<rect x="40" y="382" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="406" font-size="14" fill="#1F2329" font-weight="bold">L6 进阶专题</text>
<text x="267" y="406" font-size="14" fill="#1F2329">GPU-25 到 GPU-33</text>
<text x="555" y="406" font-size="14" fill="#1F2329">新硬件和新负载：判断消掉了哪一项、代价是什么</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：本系列主线定义（spec/MAINLINE.md）</text>
</svg>