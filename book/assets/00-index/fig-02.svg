<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">时间账：有效计算之外，四类暴露的等待</text>
<text x="40" y="92" font-size="14" fill="#646A73">T = T_compute + W_mem + W_host + W_comm + W_idle；效率 = T_compute ÷ T</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">项</text>
<text x="276" y="176" font-size="14" fill="#1F2329" font-weight="bold">谁在等什么</text>
<text x="738" y="176" font-size="14" fill="#1F2329" font-weight="bold">主要在哪一级</text>
<text x="962" y="176" font-size="14" fill="#1F2329" font-weight="bold">典型篇</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">T_compute</text>
<text x="276" y="216" font-size="14" fill="#1F2329">计算单元真正在做乘加</text>
<text x="738" y="216" font-size="14" fill="#1F2329">全部</text>
<text x="962" y="216" font-size="14" fill="#1F2329">GPU-05、GPU-06</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">W_mem</text>
<text x="276" y="254" font-size="14" fill="#1F2329">SM 等 HBM、搬运与计算串行</text>
<text x="738" y="254" font-size="14" fill="#1F2329">L1</text>
<text x="962" y="254" font-size="14" fill="#1F2329">GPU-04、GPU-08</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">W_host</text>
<text x="276" y="292" font-size="14" fill="#1F2329">同步、PCIe、分配器、发射</text>
<text x="738" y="292" font-size="14" fill="#1F2329">L2、L3</text>
<text x="962" y="292" font-size="14" fill="#1F2329">GPU-03、GPU-15</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">W_comm</text>
<text x="276" y="330" font-size="14" fill="#1F2329">卡等卡、卡等网络、气泡</text>
<text x="738" y="330" font-size="14" fill="#1F2329">L3 到 L5</text>
<text x="962" y="330" font-size="14" fill="#1F2329">GPU-18、GPU-21</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">W_idle</text>
<text x="276" y="368" font-size="14" fill="#1F2329">卡等任务、调度、故障恢复</text>
<text x="738" y="368" font-size="14" fill="#1F2329">L2、L4</text>
<text x="962" y="368" font-size="14" fill="#1F2329">GPU-12、GPU-20</text>
<rect x="40" y="412" width="548" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="443" font-size="18" fill="#1F2329" font-weight="bold">减少等待量</text>
<text x="56" y="473" font-size="14" fill="#646A73">少搬字节、少发 kernel、少通信</text>
<rect x="612" y="412" width="548" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="443" font-size="18" fill="#1F2329" font-weight="bold">把等待藏起来</text>
<text x="628" y="473" font-size="14" fill="#646A73">异步、流水、重叠</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：本系列主线定义（spec/MAINLINE.md）</text>
</svg>