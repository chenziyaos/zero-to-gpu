<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">snapshot：三行代码抓下来，两个视图分别找峰值和碎片</text>
<text x="40" y="92" font-size="14" fill="#646A73">每次分配和释放都带 Python 调用栈；只看得到 PyTorch 分配器管的显存</text>
<rect x="40" y="140" width="344" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">打开记录</text>
<text x="56" y="201" font-size="14" fill="#646A73">_record_memory_history() 开始记录分配和</text>
<text x="56" y="224" font-size="14" fill="#646A73">释放</text>
<polyline points="390,192 422,192" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,186 422,192 412,198" fill="#8F959E"/>
<rect x="428" y="140" width="344" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="457" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="457" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="476" y="171" font-size="18" fill="#1F2329" font-weight="bold">跑可疑的几步</text>
<text x="444" y="201" font-size="14" fill="#646A73">只在出问题的步前后打开，设 max_entries</text>
<polyline points="778,192 810,192" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,186 810,192 800,198" fill="#8F959E"/>
<rect x="816" y="140" width="344" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="845" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="845" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="864" y="171" font-size="18" fill="#1F2329" font-weight="bold">导出</text>
<text x="832" y="201" font-size="14" fill="#646A73">_dump_snapshot 存成 pickle，拖进本机运行</text>
<text x="832" y="224" font-size="14" fill="#646A73">的 memory_viz</text>
<rect x="40" y="284" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">Active Memory Timeline</text>
<text x="56" y="346" font-size="14" fill="#646A73">所有活着的张量随时间的变化</text>
<text x="56" y="369" font-size="14" fill="#646A73">悬停看分配时的调用栈</text>
<text x="56" y="392" font-size="14" fill="#646A73">用来找峰值由谁撑起</text>
<rect x="612" y="284" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="316" font-size="18" fill="#1F2329" font-weight="bold">Allocator State History</text>
<text x="628" y="346" font-size="14" fill="#646A73">每个 cudaMalloc 来的段怎样被切开</text>
<text x="628" y="369" font-size="14" fill="#646A73">按分配器事件回放</text>
<text x="628" y="392" font-size="14" fill="#646A73">用来看碎片</text>
<rect x="40" y="448" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="477" font-size="15" fill="#1F2329">直接用 CUDA 接口或第三方绑定分配的显存不在 snapshot 里；用 torch.cuda.device_memory_used() 看总量，减去 reserved 就是分配器以外的部分。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：PyTorch, Understanding CUDA Memory Usage（main 文档）</text>
</svg>