<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">OOM 之前的重试：先同步回收所有空闲缓存，再试一次</text>
<text x="40" y="92" font-size="14" fill="#646A73">cudaMalloc retries 记的就是这条路径走了几次；频繁发生说明没进入稳态</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">cudaMalloc 失败</text>
<text x="56" y="211" font-size="14" fill="#646A73">缓存里没有装得下的块，向 CUDA</text>
<text x="56" y="234" font-size="14" fill="#646A73">要新块也失败</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">等跨流事件</text>
<text x="347" y="211" font-size="14" fill="#646A73">等所有跨流使用的块可以释放</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D83931" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">cudaFree 空闲块</text>
<text x="638" y="211" font-size="14" fill="#646A73">把缓存里所有空闲块还给 CUDA，</text>
<text x="638" y="234" font-size="14" fill="#646A73">同步整张卡</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">再试 cudaMalloc</text>
<text x="929" y="211" font-size="14" fill="#646A73">成功则继续；仍失败抛</text>
<text x="929" y="234" font-size="14" fill="#646A73">OutOfMemoryError</text>
<rect x="40" y="294" width="1120" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="326" font-size="18" fill="#1F2329" font-weight="bold">为什么空闲够了还会失败</text>
<text x="56" y="356" font-size="15" fill="#646A73">inactive_split 块还不回去：同一块的另一部分仍被占着。所以 reserved 远大于 allocated 时，重试也可能失败。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：DeVito, A guide to PyTorch’s CUDA Caching Allocator（Low memory conditions and cudaMalloc retry）</text>
</svg>