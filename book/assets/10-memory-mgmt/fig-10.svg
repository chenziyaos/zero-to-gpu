<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">推理服务：超限的请求直接抛异常、被拒，其余请求照常</text>
<text x="40" y="92" font-size="14" fill="#646A73">PYTORCH_ALLOC_CONF=per_process_memory_fraction:0.95,throw_on_cudamalloc_oom:True</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">超长请求</text>
<text x="56" y="211" font-size="14" fill="#646A73">分配超过进程上限</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">直接抛异常</text>
<text x="347" y="211" font-size="14" fill="#646A73">跳过回收重试链，不调 cudaFree，</text>
<text x="347" y="234" font-size="14" fill="#646A73">不同步整卡</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">框架捕获</text>
<text x="638" y="211" font-size="14" fill="#646A73">OutOfMemoryError 只拒绝这一</text>
<text x="638" y="234" font-size="14" fill="#646A73">个请求</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">其余请求</text>
<text x="929" y="211" font-size="14" fill="#646A73">继续服务后面的请求</text>
<rect x="40" y="294" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">garbage_collection_threshold 让分配器平时就回收空闲缓存（例子 0.8，默认 1.0），避开同步的全量回收。KV cache 交给分块管理（GPU-23）。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：PyTorch CUDA semantics（per_process_memory_fraction、throw_on_cudamalloc_oom、garbage_collection_threshold）</text>
</svg>