<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">显存问题四步走：看对数字，分清碎片，算清需求，限住影响</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇处理时间账里两类显存等待：分配器同步回收（W_mem）和 OOM 中断（W_idle）</text>
<rect x="40" y="150" width="189" height="150" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">看对数字</text>
<text x="56" y="211" font-size="14" fill="#646A73">allocated、reserved、</text>
<text x="56" y="234" font-size="14" fill="#646A73">nvidia-smi 各管一层</text>
<text x="56" y="257" font-size="14" fill="#646A73">（第 1 章）</text>
<polyline points="235,225 267,225" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,219 267,225 257,231" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="150" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">分清碎片</text>
<text x="289" y="211" font-size="14" fill="#646A73">两个池、切分合并、重试；</text>
<text x="289" y="234" font-size="14" fill="#646A73">inactive_split 占大</text>
<text x="289" y="257" font-size="14" fill="#646A73">头才是碎片（第 2、3</text>
<text x="289" y="280" font-size="14" fill="#646A73">章）</text>
<polyline points="468,225 500,225" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,219 500,225 490,231" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="150" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">调分配器</text>
<text x="522" y="211" font-size="14" fill="#646A73">PYTORCH_ALLOC_CONF</text>
<text x="522" y="234" font-size="14" fill="#646A73">一个开关对一种浪费；</text>
<text x="522" y="257" font-size="14" fill="#646A73">expandable_segments</text>
<text x="522" y="280" font-size="14" fill="#646A73">（第 4、5 章）</text>
<polyline points="700,225 732,225" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,219 732,225 722,231" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">算账与重算</text>
<text x="754" y="211" font-size="14" fill="#646A73">snapshot 定位；16Ψ</text>
<text x="754" y="234" font-size="14" fill="#646A73">加激活；选择性重算（第</text>
<text x="754" y="257" font-size="14" fill="#646A73">6 到 8 章）</text>
<polyline points="933,225 965,225" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,219 965,225 955,231" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">限住影响</text>
<text x="987" y="211" font-size="14" fill="#646A73">服务端设上限、直接抛，</text>
<text x="987" y="234" font-size="14" fill="#646A73">只拒一个请求（第 9 章）</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：PyTorch CUDA semantics、Understanding CUDA Memory Usage；DeVito 分配器指南；ZeRO；Korthikanti et al.</text>
</svg>