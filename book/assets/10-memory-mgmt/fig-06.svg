<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590">
<rect x="0" y="0" width="1200" height="590" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">expandable_segments：段尾空隙从每层一条，变成一个流一个段往后接</text>
<text x="40" y="92" font-size="14" fill="#646A73">batch 从 N 变到 N+1 时，默认分配器在每层的段尾留下用不上的空隙</text>
<rect x="40" y="140" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">默认：一次分配一个段</text>
<text x="56" y="201" font-size="14" fill="#646A73">大于 2MB 的请求按请求大小 cudaMalloc</text>
<text x="56" y="224" font-size="14" fill="#646A73">N+1 的张量塞进 N 的段，段尾留缝</text>
<text x="56" y="247" font-size="14" fill="#646A73">50 层以上的模型，同样的缝留 50 次以上</text>
<rect x="612" y="140" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">expandable_segments:True</text>
<text x="628" y="201" font-size="14" fill="#646A73">每个流尽量只有一个段</text>
<text x="628" y="224" font-size="14" fill="#646A73">分配依次铺进段里</text>
<text x="628" y="247" font-size="14" fill="#646A73">铺满了再申请显存接到段尾</text>
<text x="40" y="314" font-size="15" fill="#1F2329" font-weight="bold">段能增长靠 CUDA 10.2 引入的四个虚拟内存接口</text>
<rect x="40" y="334" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="365" font-size="18" fill="#1F2329" font-weight="bold">cuMemCreate</text>
<text x="56" y="395" font-size="14" fill="#646A73">创建物理显存句柄，大小按粒度</text>
<text x="56" y="418" font-size="14" fill="#646A73">对齐</text>
<polyline points="293,386 325,386" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,380 325,386 315,392" fill="#8F959E"/>
<rect x="331" y="334" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="347" y="365" font-size="18" fill="#1F2329" font-weight="bold">cuMemAddressReserve</text>
<text x="347" y="395" font-size="14" fill="#646A73">预留一段虚拟地址</text>
<polyline points="584,386 616,386" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,380 616,386 606,392" fill="#8F959E"/>
<rect x="622" y="334" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="638" y="365" font-size="18" fill="#1F2329" font-weight="bold">cuMemMap</text>
<text x="638" y="395" font-size="14" fill="#646A73">把物理显存映射到虚拟地址</text>
<polyline points="875,386 907,386" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,380 907,386 897,392" fill="#8F959E"/>
<rect x="913" y="334" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="929" y="365" font-size="18" fill="#1F2329" font-weight="bold">cuMemSetAccess</text>
<text x="929" y="395" font-size="14" fill="#646A73">设置各设备的访问权限</text>
<rect x="40" y="474" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="503" font-size="15" fill="#1F2329">仍是实验性选项，默认关闭；形状固定的训练里默认分配器已能稳定复用，打开它省不了多少。</text>
<text x="40" y="566" font-size="12" fill="#646A73">来源：PyTorch CUDA semantics（expandable_segments）；NVIDIA Technical Blog, Introducing Low-Level GPU Virtual Memory Management</text>
</svg>