<text x="56" y="361" font-size="15" fill="#1F2329">模型状态靠切分（ZeRO、FSDP）：7.5B 参数、64 路数据并行时，每卡从 120 GB 降到 1.88 GB。激活靠张量并行加序列并行（除以 t）或重算（第 8 章）。</text>
