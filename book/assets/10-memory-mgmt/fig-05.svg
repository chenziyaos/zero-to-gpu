<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">PYTORCH_ALLOC_CONF：每个开关对一种浪费</text>
<text x="40" y="92" font-size="14" fill="#646A73">先用统计判断问题类型，一次只改一个选项，并对比每步时间</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">选项</text>
<text x="385" y="166" font-size="14" fill="#1F2329" font-weight="bold">针对的问题</text>
<text x="732" y="166" font-size="14" fill="#1F2329" font-weight="bold">要点</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">max_split_size_mb</text>
<text x="385" y="206" font-size="14" fill="#1F2329">碎片型 OOM，inactive split 多</text>
<text x="732" y="206" font-size="14" fill="#1F2329">不切分大块；最后手段，性能代价从零到显著</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">roundup_power2_divisions</text>
<text x="385" y="244" font-size="14" fill="#1F2329">大小相近的请求落到不同块</text>
<text x="732" y="244" font-size="14" fill="#1F2329">分 4 份时 1200 字节取整到 1280；分 1 份平均浪费 1/4</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">max_non_split_rounding_mb</text>
<text x="385" y="282" font-size="14" fill="#1F2329">大块复用条件太严</text>
<text x="732" y="282" font-size="14" fill="#1F2329">默认 20MB：512MB 的请求只能用 512MB 到 532MB 的块</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">garbage_collection_threshold</text>
<text x="385" y="320" font-size="14" fill="#1F2329">同步的全部回收拖慢服务</text>
<text x="732" y="320" font-size="14" fill="#1F2329">例子 0.8，默认 1.0</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">per_process_memory_fraction</text>
<text x="385" y="358" font-size="14" fill="#1F2329">多进程共卡、服务端限额</text>
<text x="732" y="358" font-size="14" fill="#1F2329">取值 0 到 1；配 throw_on_cudamalloc_oom（第 9 章）</text>
<rect x="40" y="372" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="396" font-size="14" fill="#1F2329" font-weight="bold">backend:cudaMallocAsync</text>
<text x="385" y="396" font-size="14" fill="#1F2329">换用 CUDA 的异步分配器</text>
<text x="732" y="396" font-size="14" fill="#1F2329">要 CUDA 11.4 或更新；max_split_size_mb 等被忽略</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：PyTorch CUDA semantics（Optimizing memory usage with PYTORCH_ALLOC_CONF）</text>
</svg>