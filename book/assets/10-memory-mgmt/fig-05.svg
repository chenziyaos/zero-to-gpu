<svg xmlns="http://www.w3.org/2000/svg"
     width="1240"
     height="860"
     viewBox="-20 -20 1240 860">
<g id="o2:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="820" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a2:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">OOM 重试链：从失败到报错</tspan></tspan></text></g>
<g id="a2:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">三步重试，每步代价逐步加重；整段空闲也可能无法满足请求</tspan></tspan></text></g>
<g id="o2:2" transform="translate(40, 165)"><rect x="0" y="0" width="1130" height="100" fill="#fef1f1" stroke="#f98e8b" stroke-width="1" rx="10" ry="10"/></g>
<g id="o2:3" transform="translate(40, 165)"><rect x="0" y="0" width="6" height="100" fill="#f54a45" stroke="#f54a45" stroke-width="1" rx="3" ry="3"/></g>
<g id="a2:3" transform="translate(62, 177.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">Step 1：cudaMalloc 失败</tspan></tspan></text></g>
<g id="a2:4" transform="translate(62, 207.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 请求大小超过可用连续块</tspan></tspan></text></g>
<g id="a2:5" transform="translate(62, 229.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· CUDA 返回错误代码</tspan></tspan></text></g>
<g id="a2:6" transform="translate(1032, 181.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="end" dominant-baseline="alphabetic" x="116"><tspan x="116" y="15.295"><tspan x="25" text-anchor="start">代价：直接映射</tspan></tspan></text></g>
<g id="c2:1" transform="translate(605, 269)"><path fill="none" stroke="#dee0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 18"/></g>
<g id="d2:1" transform="translate(596.5, 274.5)"><defs><symbol id="svgicon-d2-1" viewBox="0 0 17 15"><g transform="translate(-596.5 -274.5)"><polygon points="599,277 605,287 611,277" fill="#DEE0E3" /></g></symbol></defs><use href="#svgicon-d2-1" x="0" y="0" width="17" height="15"/></g>
<g id="o2:4" transform="translate(40, 291)"><rect x="0" y="0" width="1130" height="100" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="10" ry="10"/></g>
<g id="o2:5" transform="translate(40, 291)"><rect x="0" y="0" width="6" height="100" fill="#ff8800" stroke="#ff8800" stroke-width="1" rx="3" ry="3"/></g>
<g id="a2:7" transform="translate(62, 303.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">Step 2：释放超过 max_split_size_mb 的空闲块</tspan></tspan></text></g>
<g id="a2:8" transform="translate(62, 333.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 查找所有 inactive 块且大小 ＞ threshold</tspan></tspan></text></g>
<g id="a2:9" transform="translate(62, 355.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 释放后再尝试分配（不同步 GPU）</tspan></tspan></text></g>
<g id="a2:10" transform="translate(1032, 307.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="end" dominant-baseline="alphabetic" x="116"><tspan x="116" y="15.295"><tspan x="25" text-anchor="start">代价：仅块查询</tspan></tspan></text></g>
<g id="c2:2" transform="translate(605, 395)"><path fill="none" stroke="#dee0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 18"/></g>
<g id="d2:2" transform="translate(596.5, 400.5)"><defs><symbol id="svgicon-d2-2" viewBox="0 0 17 15"><g transform="translate(-596.5 -400.5)"><polygon points="599,403 605,413 611,403" fill="#DEE0E3" /></g></symbol></defs><use href="#svgicon-d2-2" x="0" y="0" width="17" height="15"/></g>
<g id="o2:6" transform="translate(40, 417)"><rect x="0" y="0" width="1130" height="100" fill="#fef1f1" stroke="#f98e8b" stroke-width="1" rx="10" ry="10"/></g>
<g id="o2:7" transform="translate(40, 417)"><rect x="0" y="0" width="6" height="100" fill="#f54a45" stroke="#f54a45" stroke-width="1" rx="3" ry="3"/></g>
<g id="a2:11" transform="translate(62, 429.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">Step 3：同步全部流，释放整段空闲的段</tspan></tspan></text></g>
<g id="a2:12" transform="translate(62, 459.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· cudaDeviceSynchronize：CPU 等 GPU 完成所有内核</tspan></tspan></text></g>
<g id="a2:13" transform="translate(62, 481.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 释放整段空闲的段（中间有活张量保留）</tspan></tspan></text></g>
<g id="a2:14" transform="translate(1009, 433.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="end" dominant-baseline="alphabetic" x="139"><tspan x="139" y="15.295"><tspan x="29.71" text-anchor="start">代价：同步卡顿 ++</tspan></tspan></text></g>
<g id="o2:8" transform="translate(40, 543)"><rect x="0" y="0" width="553" height="100" fill="#e4fae1" stroke="#8ee085" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:15" transform="translate(56, 554.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">✓ 分配成功</tspan></tspan></text></g>
<g id="a2:16" transform="translate(56, 585.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">Step 3 释放了足够的块</tspan></tspan></text></g>
<g id="o2:9" transform="translate(617, 543)"><rect x="0" y="0" width="553" height="100" fill="#fef1f1" stroke="#f98e8b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:17" transform="translate(633, 554.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">✗ OutOfMemoryError</tspan></tspan></text></g>
<g id="a2:18" transform="translate(633, 585.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">整段空闲也无法满足请求</tspan></tspan></text></g>
<g id="o2:10" transform="translate(40, 673)"><rect x="0" y="0" width="1120" height="82" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:19" transform="translate(56, 682.823)"><text font-size="18" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">OOM 的隐藏代价</tspan></tspan></text></g>
<g id="a2:20" transform="translate(56, 716.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">从用户视角看到的 cuda OOM 报错，只是这条链的最后一步；前 2 步已经发生，期间 GPU 已经被 cudaDeviceSynchronize 卡住过一次</tspan></tspan></text></g>
<g id="a2:21" transform="translate(40, 781.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：PyTorch CUDACachingAllocator</tspan></tspan></text></g>
</svg>