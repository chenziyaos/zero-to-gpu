<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
<rect x="0" y="0" width="1200" height="580" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一次分配的路径：512 字节取整，按大小分池，向 CUDA 按块要</text>
<text x="40" y="92" font-size="14" fill="#646A73">向 CUDA 要来的块比请求大，多出来的部分切下来留给后面的分配</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">请求大小（取整到 512 字节后）</text>
<text x="425" y="166" font-size="14" fill="#1F2329" font-weight="bold">进哪个池</text>
<text x="655" y="166" font-size="14" fill="#1F2329" font-weight="bold">缓存里没有合适的块时，向 CUDA 要</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">小于 1MB</text>
<text x="425" y="206" font-size="14" fill="#1F2329">small 池</text>
<text x="655" y="206" font-size="14" fill="#1F2329">2MB</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">1MB 到 10MB</text>
<text x="425" y="244" font-size="14" fill="#1F2329">large 池</text>
<text x="655" y="244" font-size="14" fill="#1F2329">20MB</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">更大</text>
<text x="425" y="282" font-size="14" fill="#1F2329">large 池</text>
<text x="655" y="282" font-size="14" fill="#1F2329">取整到 2MB 的倍数</text>
<rect x="40" y="346" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="371" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="376" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="377" font-size="18" fill="#1F2329" font-weight="bold">最佳适配</text>
<text x="56" y="407" font-size="14" fill="#646A73">在同一个流的池里找装得下的最小空闲块</text>
<polyline points="390,387 422,387" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,381 422,387 412,393" fill="#8F959E"/>
<rect x="428" y="346" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="457" cy="371" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="457" y="376" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="476" y="377" font-size="18" fill="#1F2329" font-weight="bold">切分</text>
<text x="444" y="407" font-size="14" fill="#646A73">块比请求大很多时，切下多余部分放回池里</text>
<polyline points="778,387 810,387" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,381 810,387 800,393" fill="#8F959E"/>
<rect x="816" y="346" width="344" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="845" cy="371" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="845" y="376" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="864" y="377" font-size="18" fill="#1F2329" font-weight="bold">合并</text>
<text x="832" y="407" font-size="14" fill="#646A73">归还时与空闲的前后邻居合并成大块</text>
<rect x="40" y="464" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="492" font-size="15" fill="#1F2329">缓存按 CUDA 流分开；张量跨流使用要 record_stream，块总是回到分配它的流。</text>
<text x="40" y="556" font-size="12" fill="#646A73">来源：DeVito, A guide to PyTorch’s CUDA Caching Allocator（2022 年 8 月的行为）；PyTorch CUDA semantics</text>
</svg>