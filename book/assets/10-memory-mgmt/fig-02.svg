<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">三个显存数字逐层包含：张量占用、分配器缓存、整张卡</text>
<text x="40" y="92" font-size="14" fill="#646A73">nvidia-smi 快满不等于张量快占满；先看差额落在哪一层</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">allocated</text>
<text x="56" y="201" font-size="14" fill="#646A73">memory_allocated()</text>
<text x="56" y="224" font-size="14" fill="#646A73">张量实际占用</text>
<text x="56" y="247" font-size="14" fill="#646A73">含取整：1 字节记作 512 字节</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">reserved</text>
<text x="437" y="201" font-size="14" fill="#646A73">memory_reserved()</text>
<text x="437" y="224" font-size="14" fill="#646A73">分配器管理的全部显存</text>
<text x="437" y="247" font-size="14" fill="#646A73">= allocated + 缓存着的空闲块</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">nvidia-smi</text>
<text x="819" y="201" font-size="14" fill="#646A73">整张卡的已用显存</text>
<text x="819" y="224" font-size="14" fill="#646A73">包含 reserved（含空闲缓存）</text>
<text x="819" y="247" font-size="14" fill="#646A73">+ cuBLAS、cuDNN、NCCL 等自己的分配</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">empty_cache() 只把未用的缓存还给 CUDA：reserved 和 nvidia-smi 会降，allocated 不变，PyTorch 自己可用的显存也不会变多。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：PyTorch CUDA semantics（Memory management）；DeVito, A guide to PyTorch’s CUDA Caching Allocator</text>
</svg>