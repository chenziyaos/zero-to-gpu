<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">投机解码要能回滚状态，张量并行按头切最自然</text>
<text x="40" y="92" font-size="14" fill="#646A73">状态缓冲倍数来自 SGLang 参数文档；按头切分不需跨卡通信是主编按更新规则的推断</text>
<rect x="40" y="150" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">投机解码</text>
<text x="56" y="211" font-size="14" fill="#646A73">被拒绝的 token 已改过状态</text>
<text x="56" y="234" font-size="14" fill="#646A73">extra_buffer：非投机 2 倍</text>
<text x="56" y="257" font-size="14" fill="#646A73">4 个草稿 token 约 1.16 倍</text>
<rect x="612" y="150" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">张量并行</text>
<text x="628" y="211" font-size="14" fill="#646A73">状态按头组织，32 个头</text>
<text x="628" y="234" font-size="14" fill="#646A73">递推内头与头无交互</text>
<text x="628" y="257" font-size="14" fill="#646A73">输出投影仍要 all-reduce</text>
<rect x="40" y="308" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="336" font-size="15" fill="#1F2329">状态缓冲挤占状态池，短上下文时会直接压低并发；TP 度要能整除头数。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：SGLang 参数文档；Kimi Linear 与 Qwen3-Next 配置；主编推断</text>
</svg>