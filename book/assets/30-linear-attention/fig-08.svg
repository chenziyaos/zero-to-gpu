<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">两个显存池：平均上下文短于约 3,427 个 token 时，状态池先满</text>
<text x="40" y="92" font-size="14" fill="#646A73">假设 40 GB 留给缓存，Qwen3-Next，FP32 状态，SGLang 默认状态与 KV 显存比 0.9</text>
<text x="178" y="168" font-size="14" fill="#1F2329" text-anchor="end">状态池</text>
<rect x="190" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="190" y="150" width="630" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="828" y="168" font-size="13" fill="#646A73">  18.95 GB，可放 250 个请求</text>
<text x="178" y="210" font-size="14" fill="#1F2329" text-anchor="end">KV 池</text>
<rect x="190" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="190" y="192" width="700" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="898" y="210" font-size="13" fill="#646A73">  21.05 GB，约 856,634 个 token</text>
<rect x="40" y="248" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="277" font-size="15" fill="#1F2329">vLLM 只支持单一页大小，要加大注意力层块来对齐状态，块可能超过 400 个 token。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：主编核算（40 GB 为假设）；SGLang 参数文档；vLLM 混合 KV 缓存管理器文档</text>
</svg>