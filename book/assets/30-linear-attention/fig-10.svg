<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">长上下文、多轮、Agent 值得换；几千 token 的短对话收益有限</text>
<text x="40" y="92" font-size="14" fill="#646A73">主编按前八章归纳</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">负载</text>
<text x="352" y="176" font-size="14" fill="#1F2329" font-weight="bold">收益</text>
<text x="762" y="176" font-size="14" fill="#1F2329" font-weight="bold">要注意</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">长上下文（128k 以上）</text>
<text x="352" y="216" font-size="14" fill="#1F2329">KV 少约四分之三，prefill 明显更快</text>
<text x="762" y="216" font-size="14" fill="#1F2329">KV 池仍是瓶颈</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">多轮对话与 Agent</text>
<text x="352" y="254" font-size="14" fill="#1F2329">前缀规整，适合在请求结束处存档</text>
<text x="762" y="254" font-size="14" fill="#1F2329">确认存档策略与命中率</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">短对话（几千 token）</text>
<text x="352" y="292" font-size="14" fill="#1F2329">速度与全注意力相当</text>
<text x="762" y="292" font-size="14" fill="#1F2329">状态池可能先满</text>
<rect x="40" y="336" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="365" font-size="15" fill="#1F2329">上线前确认：线性层专用 kernel、前缀缓存、投机解码、张量并行的支持情况，并做质量验收。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Kimi Linear 技术报告；本篇第 4 到 8 章的算例</text>
</svg>