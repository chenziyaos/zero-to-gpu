<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Kimi Linear 的速度优势从 128k 开始，1M 时解码每 token 快 6.3 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">同为 48B 配置、同样层数和头数，对比全 MLA；解码数据来自技术报告图 1</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">阶段</text>
<text x="325" y="176" font-size="14" fill="#1F2329" font-weight="bold">4k 到 16k</text>
<text x="598" y="176" font-size="14" fill="#1F2329" font-weight="bold">512k</text>
<text x="817" y="176" font-size="14" fill="#1F2329" font-weight="bold">1M</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">prefill</text>
<text x="325" y="216" font-size="14" fill="#1F2329">与 MLA 相当</text>
<text x="598" y="216" font-size="14" fill="#1F2329">快 2.3 倍</text>
<text x="817" y="216" font-size="14" fill="#1F2329">快 2.9 倍</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">解码每 token</text>
<text x="325" y="254" font-size="14" fill="#1F2329"></text>
<text x="598" y="254" font-size="14" fill="#1F2329"></text>
<text x="817" y="254" font-size="14" fill="#1F2329">1.84ms 对 11.48ms，快 6.3 倍</text>
<rect x="40" y="298" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="327" font-size="15" fill="#1F2329">解码优势来自 KV 变少后能开更大的批；Qwen3-Next 模型卡的 10 倍是对 Qwen3-32B 的比较，模型规模不同。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：Kimi Linear 技术报告</text>
</svg>