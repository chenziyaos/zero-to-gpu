<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">更新规则一步步变细：替换旧值、按头遗忘、按通道遗忘</text>
<text x="40" y="92" font-size="14" fill="#646A73">状态大小只由头数和头维度决定；更新必须按 token 顺序进行</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">线性注意力</text>
<text x="56" y="211" font-size="14" fill="#646A73">外积累加，无法删除</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">DeltaNet</text>
<text x="347" y="211" font-size="14" fill="#646A73">delta 规则替换旧值</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">Gated DeltaNet</text>
<text x="638" y="211" font-size="14" fill="#646A73">门 αt 按头衰减</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">KDA</text>
<text x="929" y="211" font-size="14" fill="#646A73">按通道衰减，DPLR 特化</text>
<rect x="40" y="262" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="290" font-size="15" fill="#1F2329">Gated DeltaNet：St = St−1 (αt(I− βtktk⊺t )) + βtvtk⊺t；αt 接近 0 时迅速清空记忆。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：Gated DeltaNet 论文；Kimi Linear 技术报告</text>
</svg>