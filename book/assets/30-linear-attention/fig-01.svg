<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">系统侧</text>
<text x="929" y="211" font-size="14" fill="#646A73">存档、池、投机、TP（第 6 到 8</text>
<text x="929" y="234" font-size="14" fill="#646A73">章）</text>
<rect x="40" y="284" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">省下的</text>
<text x="56" y="346" font-size="14" fill="#646A73">长上下文的 KV</text>
<text x="56" y="369" font-size="14" fill="#646A73">prefill 的平方项</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">新增的</text>
<text x="437" y="346" font-size="14" fill="#646A73">每请求固定的状态</text>
<text x="437" y="369" font-size="14" fill="#646A73">存档点、状态池、回滚</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">值得换</text>
