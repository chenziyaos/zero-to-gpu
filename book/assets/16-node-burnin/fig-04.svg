<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">DCGM 诊断四级：一级只查软件，三级起才有压测</text>
<text x="40" y="92" font-size="14" fill="#646A73">8 卡 Hopper 系统上的耗时上限</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">r1（Short）</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="252" y="168" font-size="13" fill="#646A73">  2.5 秒</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">r2（Medium）</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="54" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="302" y="210" font-size="13" fill="#646A73">  10.5 分钟</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">r3（Long）</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="181" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="429" y="252" font-size="13" fill="#646A73">  35 分钟</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">r4（Extra Long）</text>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="948" y="294" font-size="13" fill="#646A73">  2.25 小时</text>
<rect x="40" y="332" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="363" font-size="18" fill="#1F2329" font-weight="bold">用途</text>
<text x="56" y="393" font-size="14" fill="#646A73">r1：作业前就绪检查</text>
<text x="56" y="416" font-size="14" fill="#646A73">r2：作业失败后的收尾检查</text>
<text x="56" y="439" font-size="14" fill="#646A73">r3、r4：管理员事后排查、新机验收</text>
<rect x="612" y="332" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="363" font-size="18" fill="#1F2329" font-weight="bold">不负责</text>
<text x="628" y="393" font-size="14" fill="#646A73">不做全面硬件诊断</text>
<text x="628" y="416" font-size="14" fill="#646A73">不主动修复</text>
<text x="628" y="439" font-size="14" fill="#646A73">不替代现场诊断工具和 RMA 流程</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：NVIDIA DCGM Diagnostics（Run Levels and Tests）</text>
</svg>