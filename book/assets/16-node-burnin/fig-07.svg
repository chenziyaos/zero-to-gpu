<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">压测：在满功耗下跑够时间，同时采降频原因</text>
<text x="40" y="92" font-size="14" fill="#646A73">降频不报错，只让时钟变低</text>
<rect x="40" y="140" width="548" height="150" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">DCGM 压测插件</text>
<text x="56" y="201" font-size="14" fill="#646A73">targeted_power：推向 TDP，低于目标 75% 判失败</text>
<text x="56" y="224" font-size="14" fill="#646A73">targeted_stress：恒定矩阵负载</text>
<text x="56" y="247" font-size="14" fill="#646A73">pulse：功耗尖峰测电源</text>
<text x="56" y="270" font-size="14" fill="#646A73">memtest：多种模式读写显存</text>
<rect x="612" y="140" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">降频原因</text>
<text x="628" y="201" font-size="14" fill="#646A73">SW Power Cap：功耗过高，软件压时钟</text>
<text x="628" y="224" font-size="14" fill="#646A73">HW Slowdown：时钟降到一半或更低</text>
<text x="628" y="247" font-size="14" fill="#646A73">SW Thermal Slowdown：温度超过上限</text>
<rect x="40" y="320" width="1120" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="352" font-size="18" fill="#1F2329" font-weight="bold">仓库约定与样例 warn_temp_short_burn</text>
<text x="56" y="382" font-size="14" fill="#646A73">时长不少于 24 小时；温度高于 83°C 判 FAIL，78 到 83°C 判 WARN</text>
<text x="56" y="405" font-size="14" fill="#646A73">GPU0 温度 80°C、只跑了 12.0 小时：两项 WARN，整机 CONDITIONAL</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：NVIDIA DCGM Diagnostics；nvidia-smi 文档（Clocks Event Reasons）；温度与时长为仓库约定</text>
</svg>