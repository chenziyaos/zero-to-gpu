<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">静态体检：只读状态，几秒钟排掉配置问题</text>
<text x="40" y="92" font-size="14" fill="#646A73">每一项都和机型的期望值比，不一致就先修</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">项目</text>
<text x="290" y="166" font-size="14" fill="#1F2329" font-weight="bold">读哪里</text>
<text x="710" y="166" font-size="14" fill="#1F2329" font-weight="bold">期望</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">持久模式</text>
<text x="290" y="206" font-size="14" fill="#1F2329">nvidia-smi -q：Persistence Mode</text>
<text x="710" y="206" font-size="14" fill="#1F2329">Enabled，和生产一致</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">ECC 计数</text>
<text x="290" y="244" font-size="14" fill="#1F2329">volatile（本次加载）与 aggregate（终身）</text>
<text x="710" y="244" font-size="14" fill="#1F2329">新机器全为零</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">行重映射</text>
<text x="290" y="282" font-size="14" fill="#1F2329">Remapped Rows：pending</text>
<text x="710" y="282" font-size="14" fill="#1F2329">No；Yes 要先重置再看</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">PCIe 链路</text>
<text x="290" y="320" font-size="14" fill="#1F2329">GPU Link：代际与宽度</text>
<text x="710" y="320" font-size="14" fill="#1F2329">当前值等于最大值</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">NVLink</text>
<text x="290" y="358" font-size="14" fill="#1F2329">topo -m、nvlink -s</text>
<text x="710" y="358" font-size="14" fill="#1F2329">卡间全是 NV#，链路全在线</text>
<rect x="40" y="372" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="396" font-size="14" fill="#1F2329" font-weight="bold">Fabric</text>
<text x="290" y="396" font-size="14" fill="#1F2329">nvidia-smi -q：Fabric State</text>
<text x="710" y="396" font-size="14" fill="#1F2329">Completed，Status 为 Success</text>
<rect x="40" y="446" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="475" font-size="15" fill="#1F2329">Fabric 注册失败的卡会失去 NVLink 点对点能力，卡仍能被列出来。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：NVIDIA nvidia-smi 文档；Fabric Manager User Guide；GPU Memory Error Management</text>
</svg>