<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<rect x="0" y="0" width="1200" height="600" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">FAIL 之后：按 Xid 目录的建议处理分流</text>
<text x="40" y="92" font-size="14" fill="#646A73">建议处理随驱动版本更新，以当时的目录原文为准</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">Xid</text>
<text x="206" y="166" font-size="14" fill="#1F2329" font-weight="bold">含义</text>
<text x="668" y="166" font-size="14" fill="#1F2329" font-weight="bold">目录建议</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">79</text>
<text x="206" y="206" font-size="14" fill="#1F2329">GPU 从总线上掉了，常因 PCIe 链路</text>
<text x="668" y="206" font-size="14" fill="#1F2329">RESTART_BM，CONTACT_SUPPORT</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">64</text>
<text x="206" y="244" font-size="14" fill="#1F2329">显存行重映射失败</text>
<text x="668" y="244" font-size="14" fill="#1F2329">RESET_GPU，CONTACT_SUPPORT</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">95</text>
<text x="206" y="282" font-size="14" fill="#1F2329">未被隔离的显存错误</text>
<text x="668" y="282" font-size="14" fill="#1F2329">RESET_GPU</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">74</text>
<text x="206" y="320" font-size="14" fill="#1F2329">NVLink 连接出问题，可能是远端设备</text>
<text x="668" y="320" font-size="14" fill="#1F2329">WORKFLOW_NVLINK_ERR，CONTACT_SUPPORT</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">119、120</text>
<text x="206" y="358" font-size="14" fill="#1F2329">GSP RPC 超时、GSP 错误</text>
<text x="668" y="358" font-size="14" fill="#1F2329">RESET_GPU，INVESTIGATE_SW</text>
<rect x="40" y="372" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="396" font-size="14" fill="#1F2329" font-weight="bold">94</text>
<text x="206" y="396" font-size="14" fill="#1F2329">被隔离的显存错误</text>
<text x="668" y="396" font-size="14" fill="#1F2329">RESTART_APP</text>
<rect x="40" y="410" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="434" font-size="14" fill="#1F2329" font-weight="bold">63</text>
<text x="206" y="434" font-size="14" fill="#1F2329">显存行重映射事件</text>
<text x="668" y="434" font-size="14" fill="#1F2329">IGNORE</text>
<rect x="40" y="484" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="513" font-size="15" fill="#1F2329">行重映射要重置才生效且永久保留；是否返修由现场诊断工具判定，例如一个 bank 已有 8 行不可纠正错误重映射、累计 512 次。</text>
<text x="40" y="576" font-size="12" fill="#646A73">来源：NVIDIA Xid Catalog；GPU Memory Error Management（Row Remapping、RMA Policy）</text>
</svg>