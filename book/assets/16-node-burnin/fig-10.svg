<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">整机结论：任一 FAIL 即 FAIL，有 WARN 是 CONDITIONAL</text>
<text x="40" y="92" font-size="14" fill="#646A73">仓库的程序对 CONDITIONAL 和 FAIL 返回同一个退出码 1</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">样例</text>
<text x="374" y="166" font-size="14" fill="#1F2329" font-weight="bold">逐项</text>
<text x="906" y="166" font-size="14" fill="#1F2329" font-weight="bold">结论</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">healthy_pass</text>
<text x="374" y="206" font-size="14" fill="#1F2329">全部 PASS，极差 1.3%</text>
<text x="906" y="206" font-size="14" fill="#1F2329">PASS，退出码 0</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">fail_gpu5_slow</text>
<text x="374" y="244" font-size="14" fill="#1F2329">GPU5 650.0 低于 700；极差 17.6%</text>
<text x="906" y="244" font-size="14" fill="#1F2329">FAIL，退出码 1</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">fail_link_xid</text>
<text x="374" y="282" font-size="14" fill="#1F2329">GPU2 320.0 GB/s；busbw 300.0；Xid 79</text>
<text x="906" y="282" font-size="14" fill="#1F2329">FAIL，退出码 1</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">warn_temp_short_burn</text>
<text x="374" y="320" font-size="14" fill="#1F2329">GPU0 80°C；压测 12.0 小时</text>
<text x="906" y="320" font-size="14" fill="#1F2329">CONDITIONAL，退出码 1</text>
<rect x="40" y="370" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="399" font-size="15" fill="#1F2329">报告存逐项实测值、要求、等级和测量条件（驱动、固件、时钟、工具版本），整机结论只是汇总；批次基线比合格线更早发现问题。</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：sim_burnin.py report 实跑输出（四个样例）</text>
</svg>