<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">按耗时从短到长排：先排掉便宜的问题</text>
<text x="40" y="92" font-size="14" fill="#646A73">DCGM 耗时为 8 卡 Hopper 系统上的上限</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">层</text>
<text x="282" y="166" font-size="14" fill="#1F2329" font-weight="bold">做什么</text>
<text x="799" y="166" font-size="14" fill="#1F2329" font-weight="bold">耗时</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">静态体检</text>
<text x="282" y="206" font-size="14" fill="#1F2329">nvidia-smi -q、topo -m、nvlink -s、Fabric State</text>
<text x="799" y="206" font-size="14" fill="#1F2329">几秒</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">DCGM r1</text>
<text x="282" y="244" font-size="14" fill="#1F2329">software 插件，就绪检查</text>
<text x="799" y="244" font-size="14" fill="#1F2329">小于 2.5 秒</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">DCGM r2</text>
<text x="282" y="282" font-size="14" fill="#1F2329">加 pcie、memory、memory_bandwidth</text>
<text x="799" y="282" font-size="14" fill="#1F2329">小于 10.5 分钟</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">DCGM r3</text>
<text x="282" y="320" font-size="14" fill="#1F2329">加压测、nvbandwidth、nccl_tests</text>
<text x="799" y="320" font-size="14" fill="#1F2329">小于 35 分钟</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">DCGM r4</text>
<text x="282" y="358" font-size="14" fill="#1F2329">加 memtest、pulse</text>
<text x="799" y="358" font-size="14" fill="#1F2329">小于 2.25 小时</text>
<rect x="40" y="372" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="396" font-size="14" fill="#1F2329" font-weight="bold">长时间压测</text>
<text x="282" y="396" font-size="14" fill="#1F2329">训练类负载，采时钟和降频原因</text>
<text x="799" y="396" font-size="14" fill="#1F2329">仓库约定不少于 24 小时</text>
<rect x="40" y="446" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="475" font-size="15" fill="#1F2329">每层逐卡、逐链路记录，看最小值和卡间极差，不看整机平均。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：NVIDIA DCGM Diagnostics（Run Levels and Tests）；压测时长为仓库约定</text>
</svg>