<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">单机验收：从快到慢的漏斗，前一层不过就不跑下一层</text>
<text x="40" y="92" font-size="14" fill="#646A73">一张降频的卡抬高 T_compute 和 W_idle，一条慢链路抬高 W_comm</text>
<rect x="40" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">静态体检</text>
<text x="56" y="211" font-size="14" fill="#646A73">配置、ECC、链路（第 2</text>
<text x="56" y="234" font-size="14" fill="#646A73">章）</text>
<polyline points="235,202 267,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,196 267,202 257,208" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">DCGM 诊断</text>
<text x="289" y="211" font-size="14" fill="#646A73">r1 到 r4（第 3 章）</text>
<polyline points="468,202 500,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,196 500,202 490,208" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">单卡</text>
<text x="522" y="211" font-size="14" fill="#646A73">GEMM、显存带宽、极差</text>
<text x="522" y="234" font-size="14" fill="#646A73">（第 4 章）</text>
<polyline points="700,202 732,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,196 732,202 722,208" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">互连</text>
<text x="754" y="211" font-size="14" fill="#646A73">点对点矩阵、busbw（第</text>
<text x="754" y="234" font-size="14" fill="#646A73">5 章）</text>
<polyline points="933,202 965,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,196 965,202 955,208" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">压测</text>
<text x="987" y="211" font-size="14" fill="#646A73">满功耗、长时间（第 6</text>
<text x="987" y="234" font-size="14" fill="#646A73">章）</text>
<rect x="40" y="284" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">FAIL 之后</text>
<text x="56" y="346" font-size="14" fill="#646A73">按 Xid 和显存错误归因</text>
<text x="56" y="369" font-size="14" fill="#646A73">第 7 章</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">调优的边界</text>
<text x="437" y="346" font-size="14" fill="#646A73">恢复出厂状态，测量可重复</text>
<text x="437" y="369" font-size="14" fill="#646A73">第 8 章</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">报告与基线</text>
<text x="819" y="346" font-size="14" fill="#646A73">逐项实测值和测量条件</text>
<text x="819" y="369" font-size="14" fill="#646A73">第 9 章</text>
<rect x="40" y="425" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="454" font-size="15" fill="#1F2329">处理完从第一层重新跑；结论只有放行和拒收，CONDITIONAL 要有处理规则。</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：NVIDIA DCGM Diagnostics；nvidia-smi 文档；Xid 目录；GPU Memory Error Management</text>
</svg>