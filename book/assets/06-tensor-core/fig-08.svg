<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">低精度只用在乘法输入上：主权重、累加和缩放都留高精度</text>
<text x="40" y="92" font-size="14" fill="#646A73">从 FP16 混合精度到 FP8 训练，三件套没变，只是缩放更细、累加要更勤地提升精度</text>
<rect x="40" y="140" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">FP32 主权重</text>
<text x="56" y="201" font-size="14" fill="#646A73">优化器在 FP32 上更新，每步取</text>
<text x="56" y="224" font-size="14" fill="#646A73">一份低精度副本</text>
<polyline points="293,204 325,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,198 325,204 315,210" fill="#8F959E"/>
<rect x="331" y="140" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="171" font-size="18" fill="#1F2329" font-weight="bold">缩放后量化</text>
<text x="347" y="201" font-size="14" fill="#646A73">FP16 用 loss scaling；FP8</text>
<text x="347" y="224" font-size="14" fill="#646A73">按张量或按块缩放</text>
<polyline points="584,204 616,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,198 616,204 606,210" fill="#8F959E"/>
<rect x="622" y="140" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="171" font-size="18" fill="#1F2329" font-weight="bold">低精度乘、高精度累加</text>
<text x="638" y="201" font-size="14" fill="#646A73">DeepSeek-V3 每 128 个元素把</text>
<text x="638" y="224" font-size="14" fill="#646A73">部分和提升到 FP32</text>
<polyline points="875,204 907,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,198 907,204 897,210" fill="#8F959E"/>
<rect x="913" y="140" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="942" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="942" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="171" font-size="18" fill="#1F2329" font-weight="bold">对照基线验收</text>
<text x="929" y="201" font-size="14" fill="#646A73">与 BF16 基线比 loss 曲线；</text>
<text x="929" y="224" font-size="14" fill="#646A73">DeepSeek-V3 相对误差低于</text>
<text x="929" y="247" font-size="14" fill="#646A73">0.25%</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">FP16 时代的 loss scaling 和 FP8 时代的逐块缩放是同一个动作：先把数挪进格式能表示的区间，再做低精度运算。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：Micikevicius et al., Mixed Precision Training；DeepSeek-V3 Technical Report</text>
</svg>