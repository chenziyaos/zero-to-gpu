<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">H100 SXM：BF16 Tensor Core 是 FP32 的 14.8 倍，FP8 再翻一倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">稠密峰值，TFLOPS；规格表的 Tensor Core 数字带稀疏，除以 2 得稠密值</text>
<text x="258" y="168" font-size="14" fill="#1F2329" text-anchor="end">FP32（SIMT）</text>
<rect x="270" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="270" y="150" width="24" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="302" y="168" font-size="13" fill="#646A73">67 TFLOPS  </text>
<text x="258" y="210" font-size="14" fill="#1F2329" text-anchor="end">BF16 / FP16 Tensor Core</text>
<rect x="270" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="270" y="192" width="350" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="628" y="210" font-size="13" fill="#646A73">989 TFLOPS  1979 ÷ 2</text>
<text x="258" y="252" font-size="14" fill="#1F2329" text-anchor="end">FP8 Tensor Core</text>
<rect x="270" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="270" y="234" width="700" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="978" y="252" font-size="13" fill="#646A73">1979 TFLOPS  3958 ÷ 2</text>
<rect x="40" y="296" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="325" font-size="15" fill="#1F2329">峰值只说明 Tensor Core 每周期能吃多少；能不能按这个速度喂进去，是本篇后面几章的问题。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：NVIDIA H100 产品规格页</text>
</svg>