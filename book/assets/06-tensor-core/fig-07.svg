<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">缩放粒度越来越细：整张量 → 128 个元素 → 32 个 → 16 个</text>
<text x="40" y="92" font-size="14" fill="#646A73">一组元素共用一个缩放因子；组越小，一个离群值能拖累的元素越少</text>
<rect x="40" y="140" width="262" height="128" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">逐张量</text>
<text x="56" y="201" font-size="14" fill="#646A73">整张量一个缩放因子</text>
<text x="56" y="224" font-size="14" fill="#646A73">让张量最大值贴近格式最大值</text>
<text x="56" y="247" font-size="14" fill="#646A73">FP8 论文的基本做法</text>
<rect x="326" y="140" width="262" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="342" y="171" font-size="18" fill="#1F2329" font-weight="bold">DeepSeek-V3（FP8）</text>
<text x="342" y="201" font-size="14" fill="#646A73">激活每 1×128 一个</text>
<text x="342" y="224" font-size="14" fill="#646A73">权重每 128×128 一个</text>
<text x="342" y="247" font-size="14" fill="#646A73">全部张量用 E4M3</text>
<rect x="612" y="140" width="262" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">MXFP4</text>
<text x="628" y="201" font-size="14" fill="#646A73">每 32 个元素一个</text>
<text x="628" y="224" font-size="14" fill="#646A73">缩放是 2 的幂（E8M0）</text>
<rect x="898" y="140" width="262" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="914" y="171" font-size="18" fill="#1F2329" font-weight="bold">NVFP4</text>
<text x="914" y="201" font-size="14" fill="#646A73">每 16 个元素一个 E4M3 缩放</text>
<text x="914" y="224" font-size="14" fill="#646A73">再加每张量一个 FP32 缩放</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">细粒度缩放要硬件配合：Blackwell 的 tcgen05.mma 有块缩放版本，缩放因子放在 Tensor Memory 里随乘加一起用。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：FP8 Formats for Deep Learning；DeepSeek-V3 Technical Report；NVIDIA NVFP4 技术博客</text>
</svg>