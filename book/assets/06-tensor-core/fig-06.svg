<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510">
<rect x="0" y="0" width="1200" height="510" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">越窄越粗：FP8 的 1 附近间距是 1/8 或 1/4，FP4 是 1/2</text>
<text x="40" y="92" font-size="14" fill="#646A73">最小正数含次正规数；“1 附近间距”指 1 和下一个可表示数的差，由尾数位数决定</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">格式</text>
<text x="265" y="166" font-size="14" fill="#1F2329" font-weight="bold">符号/指数/尾数</text>
<text x="532" y="166" font-size="14" fill="#1F2329" font-weight="bold">最大值</text>
<text x="745" y="166" font-size="14" fill="#1F2329" font-weight="bold">最小正数</text>
<text x="959" y="166" font-size="14" fill="#1F2329" font-weight="bold">1 附近间距</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">BF16</text>
<text x="265" y="206" font-size="14" fill="#1F2329">1 / 8 / 7</text>
<text x="532" y="206" font-size="14" fill="#1F2329">约 1e38</text>
<text x="745" y="206" font-size="14" fill="#1F2329">约 1e-38</text>
<text x="959" y="206" font-size="14" fill="#1F2329">2^-7</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">FP16</text>
<text x="265" y="244" font-size="14" fill="#1F2329">1 / 5 / 10</text>
<text x="532" y="244" font-size="14" fill="#1F2329">65504</text>
<text x="745" y="244" font-size="14" fill="#1F2329">2^-24</text>
<text x="959" y="244" font-size="14" fill="#1F2329">2^-10</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">FP8 E4M3</text>
<text x="265" y="282" font-size="14" fill="#1F2329">1 / 4 / 3</text>
<text x="532" y="282" font-size="14" fill="#1F2329">448</text>
<text x="745" y="282" font-size="14" fill="#1F2329">2^-9</text>
<text x="959" y="282" font-size="14" fill="#1F2329">2^-3 = 0.125</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">FP8 E5M2</text>
<text x="265" y="320" font-size="14" fill="#1F2329">1 / 5 / 2</text>
<text x="532" y="320" font-size="14" fill="#1F2329">57344</text>
<text x="745" y="320" font-size="14" fill="#1F2329">2^-16</text>
<text x="959" y="320" font-size="14" fill="#1F2329">2^-2 = 0.25</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">FP4 E2M1</text>
<text x="265" y="358" font-size="14" fill="#1F2329">1 / 2 / 1</text>
<text x="532" y="358" font-size="14" fill="#1F2329">6</text>
<text x="745" y="358" font-size="14" fill="#1F2329">0.5</text>
<text x="959" y="358" font-size="14" fill="#1F2329">2^-1 = 0.5</text>
<rect x="40" y="402" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="431" font-size="15" fill="#1F2329">E4M3 精度高、范围窄，常用于权重和激活；E5M2 范围宽，常用于梯度。FP4 只有 16 个码点，离开块缩放几乎没法用。</text>
<text x="40" y="486" font-size="12" fill="#646A73">来源：FP8 Formats for Deep Learning；Mixed Precision Training；NVIDIA FP8 与 NVFP4 技术博客</text>
</svg>