<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">四代指令：发射者从 32 个线程变成 1 个，累加器从寄存器搬进 TMEM</text>
<text x="40" y="92" font-size="14" fill="#646A73">每一代都在回答同一个问题：操作数从哪来，结果放哪，谁来等</text>
<rect x="40" y="140" width="247" height="154" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">wmma（Volta）</text>
<text x="56" y="201" font-size="14" fill="#646A73">一个 warp 同步执行 16×16×16；</text>
<text x="56" y="224" font-size="14" fill="#646A73">片段布局不公开</text>
<polyline points="293,217 325,217" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,211 325,217 315,223" fill="#8F959E"/>
<rect x="331" y="140" width="247" height="154" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="165" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="170" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="171" font-size="18" fill="#1F2329" font-weight="bold">mma.sync（Turing</text>
<text x="379" y="197" font-size="18" fill="#1F2329" font-weight="bold">起）</text>
<text x="347" y="227" font-size="14" fill="#646A73">一个 warp 同步执行，常用</text>
<text x="347" y="250" font-size="14" fill="#646A73">m16n8k16；操作数和累加器都在</text>
<text x="347" y="273" font-size="14" fill="#646A73">寄存器</text>
<polyline points="584,217 616,217" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,211 616,217 606,223" fill="#8F959E"/>
<rect x="622" y="140" width="247" height="154" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="171" font-size="18" fill="#1F2329" font-weight="bold">wgmma（Hopper）</text>
<text x="638" y="201" font-size="14" fill="#646A73">4 个 warp 异步执行 m64nNk16；</text>
<text x="638" y="224" font-size="14" fill="#646A73">B 从共享内存取，累加器在寄存器</text>
<polyline points="875,217 907,217" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,211 907,217 897,223" fill="#8F959E"/>
<rect x="913" y="140" width="247" height="154" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="165" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="170" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="171" font-size="18" fill="#1F2329" font-weight="bold">tcgen05（</text>
<text x="961" y="197" font-size="18" fill="#1F2329" font-weight="bold">Blackwell）</text>
<text x="929" y="227" font-size="14" fill="#646A73">单线程发射；累加器在 Tensor</text>
<text x="929" y="250" font-size="14" fill="#646A73">Memory；可两个 SM 合作</text>
<rect x="40" y="330" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="358" font-size="15" fill="#1F2329">指令越大、越异步，喂数据的工作越少落在线程身上；代价是同步要显式写，kernel 越来越依赖 CUTLASS 等库。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：NVIDIA PTX ISA；Programming Tensor Cores in CUDA 9；Hopper / Blackwell Ultra 架构博客</text>
</svg>