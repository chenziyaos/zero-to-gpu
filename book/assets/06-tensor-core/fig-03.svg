<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">m16n8k16：每个线程 10 个寄存器，整个 warp 拼出一次 16×8×16</text>
<text x="40" y="92" font-size="14" fill="#646A73">f16 / bf16 输入、f32 累加；每个 .f16x2 寄存器装两个 16 位元素</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">A（16×16）</text>
<rect x="240" y="150" width="678" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="678" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="926" y="168" font-size="13" fill="#646A73">4 个寄存器  4 个 .f16x2，8 个元素</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">B（16×8）</text>
<rect x="240" y="192" width="678" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="339" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="587" y="210" font-size="13" fill="#646A73">2 个寄存器  2 个 .f16x2，4 个元素</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">C/D（16×8）</text>
<rect x="240" y="234" width="678" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="678" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="926" y="252" font-size="13" fill="#646A73">4 个寄存器  4 个 .f32，4 个元素</text>
<rect x="40" y="296" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="325" font-size="15" fill="#1F2329">元素落在哪个线程由 lane 号算出（groupID = lane ÷ 4，组内序号 = lane mod 4）；ldmatrix 一条指令按这个布局从共享内存装好片段。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：NVIDIA PTX ISA，mma.m16n8k16 矩阵片段</text>
</svg>