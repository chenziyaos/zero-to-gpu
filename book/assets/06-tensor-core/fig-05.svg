<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">TMEM 每 CTA 512 列 × 128 行：一个 128×256 的 FP32 累加器占一半</text>
<text x="40" y="92" font-size="14" fill="#646A73">每格 32 位，共 256 KB；按列分配，单位 32 列且为 2 的幂</text>
<rect x="40" y="160" width="550" height="40" rx="4" fill="#3370FF" stroke="#FFFFFF" stroke-width="2"/>
<rect x="590" y="160" width="550" height="40" rx="4" fill="#34C724" stroke="#FFFFFF" stroke-width="2"/>
<line x1="315" y1="202" x2="315" y2="212" stroke="#82A7FC" stroke-width="1"/>
<text x="204" y="226" font-size="13" fill="#245BDB">累加器 A（128×256 FP32） 256 列</text>
<text x="204" y="244" font-size="12" fill="#646A73">50%</text>
<line x1="865" y1="202" x2="865" y2="212" stroke="#8EE085" stroke-width="1"/>
<text x="754" y="226" font-size="13" fill="#2EA121">累加器 B（128×256 FP32） 256 列</text>
<text x="754" y="244" font-size="12" fill="#646A73">50%</text>
<rect x="40" y="278" width="1120" height="73" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="307" font-size="15" fill="#1F2329">两份累加器轮换：Tensor Core 往一份里累加时，另一份由 tcgen05.ld 读回寄存器做收尾和写回。同样大小的累加器在 Hopper 上要两个 warpgroup 用寄</text>
<text x="56" y="331" font-size="15" fill="#1F2329">存器分担，每个线程占 128 个。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：NVIDIA PTX ISA，Tensor Memory；本篇第 4 章推导</text>
</svg>