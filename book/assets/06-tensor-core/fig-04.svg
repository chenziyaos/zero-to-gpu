<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">同一张 H800：mma 只到峰值的约 65%，wgmma 到 88% 到 96%</text>
<text x="40" y="92" font-size="14" fill="#646A73">FP16 输入、FP32 累加的稠密吞吐，TFLOPS；H800 FP16 峰值 756.5</text>
<text x="288" y="168" font-size="14" fill="#1F2329" text-anchor="end">mma m16n8k16</text>
<rect x="300" y="150" width="645" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="150" width="419" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="727" y="168" font-size="13" fill="#646A73">490.7 TFLOPS  延迟 24.1 周期</text>
<text x="288" y="210" font-size="14" fill="#1F2329" text-anchor="end">wgmma m64n256k16，随机数据</text>
<rect x="300" y="192" width="645" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="192" width="568" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="876" y="210" font-size="13" fill="#646A73">665.4 TFLOPS  </text>
<text x="288" y="252" font-size="14" fill="#1F2329" text-anchor="end">wgmma m64n256k16，全零数据</text>
<rect x="300" y="234" width="645" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="234" width="621" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="929" y="252" font-size="13" fill="#646A73">728.5 TFLOPS  延迟 128 周期</text>
<text x="288" y="294" font-size="14" fill="#1F2329" text-anchor="end">H800 FP16 峰值</text>
<rect x="300" y="276" width="645" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="276" width="645" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="953" y="294" font-size="13" fill="#646A73">756.5 TFLOPS  </text>
<rect x="40" y="338" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">全零和随机数据的吞吐不同，说明功耗和频率也会影响实测值；对标时要写清数据分布。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Luo et al., Benchmarking and Dissecting the Nvidia Hopper GPU Architecture，表 VII、表 VIII</text>
</svg>