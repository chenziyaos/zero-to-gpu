<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">寄存器翻倍，占用率减半</text>
<text x="40" y="92" font-size="14" fill="#646A73">H100，每块 256 线程，只看寄存器约束（64K 个 32 位寄存器 / SM，最多 64 个 warp / SM）</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">32 个 / 线程</text>
<rect x="240" y="150" width="685" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="685" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="933" y="168" font-size="13" fill="#646A73">100%  8 块，受 2048 线程上限限制</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">64 个 / 线程</text>
<rect x="240" y="192" width="685" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="343" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="591" y="210" font-size="13" fill="#646A73">50%  4 块，常见于 4×4 线程分块</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">128 个 / 线程</text>
<rect x="240" y="234" width="685" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="171" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="419" y="252" font-size="13" fill="#646A73">25%  2 块，常见于 8×8 线程分块</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">192 个 / 线程</text>
<rect x="240" y="276" width="685" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="86" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="334" y="294" font-size="13" fill="#646A73">12.5%  1 块</text>
<rect x="40" y="338" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">GEMM 在 25% 左右的占用率下也能接近峰值：8×8 线程分块每步有 64 次互不依赖的乘加（ILP），再配上双缓冲在线程内藏搬运，不必靠切换 warp。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：NVIDIA Hopper Tuning Guide；每线程寄存器数为假设值，实际以 --ptxas-options=-v 为准</text>
</svg>