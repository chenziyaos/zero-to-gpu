<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">8×8 线程分块：每次乘加只读 0.25 次共享内存</text>
<text x="40" y="92" font-size="14" fill="#646A73">每次乘加对应的共享内存读次数 = (TM + TN) ÷ (TM × TN)，越短越好</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">1×1</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="948" y="168" font-size="13" fill="#646A73">2 次  Boehm kernel 3：12.8%</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">8×1（一维）</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="394" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="642" y="210" font-size="13" fill="#646A73">1.125 次  kernel 4：36.5%</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">4×4</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="175" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="423" y="252" font-size="13" fill="#646A73">0.5 次</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">8×8</text>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="88" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="336" y="294" font-size="13" fill="#646A73">0.25 次  kernel 5：68.7%</text>
<rect x="40" y="338" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">代价是寄存器：8×8 光累加器就占 64 个，加上操作数和地址每线程常过百个，第 5 章算它对驻留线程数的影响。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：本篇第 3 章推导；趋势与 Boehm A6000 实测一致（12.8% → 36.5% → 68.7%）</text>
</svg>