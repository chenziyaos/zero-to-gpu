<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<rect x="0" y="0" width="1200" height="600" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">最大的两跳来自复用：从 12.8% 到 68.7%</text>
<text x="40" y="92" font-size="14" fill="#646A73">A6000 上 FP32 SGEMM 各优化步骤的吞吐，单位为相对 cuBLAS 的百分比</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">1 朴素</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="10" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="258" y="168" font-size="13" fill="#646A73">1.3%</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">2 全局内存合并</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="64" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="312" y="210" font-size="13" fill="#646A73">8.5%</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">3 共享内存缓存</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="96" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="344" y="252" font-size="13" fill="#646A73">12.8%  显存读一次、片上复用</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">4 一维线程分块</text>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="273" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="521" y="294" font-size="13" fill="#646A73">36.5%</text>
<text x="228" y="336" font-size="14" fill="#1F2329" text-anchor="end">5 二维线程分块</text>
<rect x="240" y="318" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="318" width="513" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="761" y="336" font-size="13" fill="#646A73">68.7%  每线程 8×8 个输出</text>
<text x="228" y="378" font-size="14" fill="#1F2329" text-anchor="end">6 向量化访存</text>
<rect x="240" y="360" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="360" width="586" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="834" y="378" font-size="13" fill="#646A73">78.4%</text>
<text x="228" y="420" font-size="14" fill="#1F2329" text-anchor="end">10 warp 分块</text>
<rect x="240" y="402" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="402" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="948" y="420" font-size="13" fill="#646A73">93.7%</text>
<rect x="40" y="464" width="1120" height="73" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="493" font-size="15" fill="#1F2329">第 3 到第 5 步把同一个数在共享内存和寄存器里复用的次数一级级抬高，吞吐从 12.8% 涨到 68.7%；后面的向量化和 warp 分块是在复用到位之后再削指令和</text>
<text x="56" y="517" font-size="15" fill="#1F2329">搬运开销。</text>
<text x="40" y="576" font-size="12" fill="#646A73">来源：Boehm, How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance（A6000，4092²）</text>
</svg>