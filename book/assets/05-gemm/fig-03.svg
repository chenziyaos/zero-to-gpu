<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">子块边长翻倍，强度翻倍：128×128 才越过 FP32 拐点</text>
<text x="40" y="92" font-size="14" fill="#646A73">4096³ FP32 GEMM 的显存算术强度，单位 FLOP/B；H100 FP32 拐点 = 67 TFLOPS ÷ 3.35 TB/s = 20</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">朴素</text>
<rect x="240" y="150" width="692" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="252" y="168" font-size="13" fill="#646A73">0.25 FLOP/B  显存读 549.8 GB</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">32×32 子块</text>
<rect x="240" y="192" width="692" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="130" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="378" y="210" font-size="13" fill="#646A73">8 FLOP/B  17.2 GB</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">64×64 子块</text>
<rect x="240" y="234" width="692" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="259" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="507" y="252" font-size="13" fill="#646A73">16 FLOP/B  8.6 GB</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">128×128 子块</text>
<rect x="240" y="276" width="692" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="519" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="767" y="294" font-size="13" fill="#646A73">32 FLOP/B  4.3 GB，越过拐点 20</text>
<text x="228" y="336" font-size="14" fill="#1F2329" text-anchor="end">256×128 子块</text>
<rect x="240" y="318" width="692" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="318" width="692" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="940" y="336" font-size="13" fill="#646A73">42.7 FLOP/B  3.2 GB</text>
<rect x="40" y="380" width="1120" height="73" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="409" font-size="15" fill="#1F2329">每个元素只读一次的下限是 682.7 FLOP/B（201.3 MB），分块到不了；实际显存流量介于分块值和下限之间，L2 挡掉多少重复读要用 ncu 的</text>
<text x="56" y="433" font-size="15" fill="#1F2329">dram__bytes_read.sum 实测。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：本篇第 2 章公式；H100 SXM 官网规格（FP32 67 TFLOPS，HBM 3.35 TB/s）</text>
</svg>