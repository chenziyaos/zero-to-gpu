<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">DualPipe：用另一个方向的计算盖住这一个方向的 all-to-all</text>
<text x="40" y="92" font-size="14" fill="#646A73">示意：两个微批交错时的计算流和通信流（不按比例）</text>
<text x="138" y="172" font-size="14" fill="#1F2329" text-anchor="end">计算流</text>
<rect x="150" y="150" width="1010" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="150" y="153" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="276" y="172" font-size="12" fill="#245BDB" text-anchor="middle">前向 注意力</text>
<rect x="402" y="153" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="529" y="172" font-size="12" fill="#245BDB" text-anchor="middle">反向 专家</text>
<rect x="655" y="153" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="781" y="172" font-size="12" fill="#245BDB" text-anchor="middle">前向 专家</text>
<rect x="908" y="153" width="252" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="1034" y="172" font-size="12" fill="#245BDB" text-anchor="middle">反向 注意力</text>
<text x="138" y="220" font-size="14" fill="#1F2329" text-anchor="end">通信流</text>
<rect x="150" y="198" width="1010" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="150" y="201" width="252" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="276" y="220" font-size="12" fill="#D46B08" text-anchor="middle">反向 combine</text>
<rect x="402" y="201" width="252" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="529" y="220" font-size="12" fill="#D46B08" text-anchor="middle">前向 dispatch</text>
<rect x="655" y="201" width="252" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="781" y="220" font-size="12" fill="#D46B08" text-anchor="middle">前向 combine</text>
<rect x="908" y="201" width="252" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="1034" y="220" font-size="12" fill="#D46B08" text-anchor="middle">反向 dispatch</text>
<rect x="40" y="262" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">并行方案</text>
<text x="56" y="323" font-size="14" fill="#646A73">PP 16、跨 8 节点的 EP 64、ZeRO-1</text>
<text x="56" y="346" font-size="14" fill="#646A73">不用张量并行，每卡 4 个路由专家</text>
<rect x="612" y="262" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="293" font-size="18" fill="#1F2329" font-weight="bold">通信 kernel</text>
<text x="628" y="323" font-size="14" fill="#646A73">20 个 SM 分成 10 个通道</text>
<text x="628" y="346" font-size="14" fill="#646A73">dispatch、combine 占 SM，重叠不是免费的</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：DeepSeek-V3 技术报告 3.2.1、3.2.2 节；DeepEP README</text>
</svg>