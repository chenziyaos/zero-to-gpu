<g id="a2:29" transform="translate(60, 522.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 一个节点内命中多个专家时，token 只跨一次 IB，到达后经 NVLink（450 GB/s）转发给对应 GPU</tspan></tspan></text></g>
<g id="a2:30" transform="translate(60, 550.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· V3 训练时专家分布在 8 节点；一个节点内可选到 256 路由专家中的一半</tspan></tspan></text></g>
<g id="a2:31" transform="translate(60, 578.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 具体延迟改善取决于集群拓扑和负载</tspan></tspan></text></g>
