<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590">
<rect x="0" y="0" width="1200" height="590" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">每个 IB 字节约 8192 FLOPs：细粒度专家受通信限制</text>
<text x="40" y="92" font-size="14" fill="#646A73">DeepSeek-V3 每个 token 每层（只算 8 个路由专家前向），按 H100 SXM FP8 稠密峰值和 IB 50 GB/s 估算</text>
<text x="188" y="168" font-size="14" fill="#1F2329" text-anchor="end">专家计算</text>
<rect x="200" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="150" width="145" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="353" y="168" font-size="13" fill="#646A73">  约 0.356 us</text>
<text x="188" y="210" font-size="14" fill="#1F2329" text-anchor="end">IB 传输</text>
<rect x="200" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="192" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="908" y="210" font-size="13" fill="#646A73">  约 1.72 us</text>
<rect x="40" y="258" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="284" font-size="14" fill="#1F2329" font-weight="bold">量</text>
<text x="520" y="284" font-size="14" fill="#1F2329" font-weight="bold">值</text>
<text x="803" y="284" font-size="14" fill="#1F2329" font-weight="bold">算法</text>
<rect x="40" y="300" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="324" font-size="14" fill="#1F2329" font-weight="bold">专家前向 FLOPs</text>
<text x="520" y="324" font-size="14" fill="#1F2329">704643072</text>
<text x="803" y="324" font-size="14" fill="#1F2329">8 × 2 × 3 × 7168 × 2048</text>
<rect x="40" y="338" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="362" font-size="14" fill="#1F2329" font-weight="bold">IB 字节（节点受限 + FP8）</text>
<text x="520" y="362" font-size="14" fill="#1F2329">86016</text>
<text x="803" y="362" font-size="14" fill="#1F2329">第 2 章</text>
<rect x="40" y="376" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="400" font-size="14" fill="#1F2329" font-weight="bold">每字节 FLOPs</text>
<text x="520" y="400" font-size="14" fill="#1F2329">约 8192</text>
<text x="803" y="400" font-size="14" fill="#1F2329">两者相除</text>
<rect x="40" y="414" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="438" font-size="14" fill="#1F2329" font-weight="bold">硬件平衡点</text>
<text x="520" y="438" font-size="14" fill="#1F2329">约 39580</text>
<text x="803" y="438" font-size="14" fill="#1F2329">1,979 TFLOPS ÷ 50 GB/s</text>
<rect x="40" y="482" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="511" font-size="15" fill="#1F2329">整层还有注意力和共享专家，DeepSeek-V3 报告的整体计算通信比约 1:1，所以必须重叠。</text>
<text x="40" y="566" font-size="12" fill="#646A73">来源：DeepSeek-V3 技术报告；H100 规格页（稀疏口径减半）；本篇推算，量级参考</text>
</svg>