<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
<rect x="0" y="0" width="1200" height="530" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">推理时的均衡：复制热专家，定期重排</text>
<text x="40" y="92" font-size="14" fill="#646A73">DeepSeek-V3 的预填充和解码分开部署</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">阶段</text>
<text x="222" y="176" font-size="14" fill="#1F2329" font-weight="bold">注意力</text>
<text x="506" y="176" font-size="14" fill="#1F2329" font-weight="bold">MoE</text>
<text x="818" y="176" font-size="14" fill="#1F2329" font-weight="bold">冗余专家</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">预填充</text>
<text x="222" y="216" font-size="14" fill="#1F2329">TP4 + SP，DP8</text>
<text x="506" y="216" font-size="14" fill="#1F2329">EP32</text>
<text x="818" y="216" font-size="14" fill="#1F2329">32 个，每卡多放 1 个</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">解码</text>
<text x="222" y="254" font-size="14" fill="#1F2329">TP4 + SP，DP80</text>
<text x="506" y="254" font-size="14" fill="#1F2329">EP320，每卡 1 个专家</text>
<text x="818" y="254" font-size="14" fill="#1F2329">64 张卡放冗余和共享专家</text>
<rect x="40" y="298" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="329" font-size="18" fill="#1F2329" font-weight="bold">EPLB 分层策略</text>
<text x="56" y="359" font-size="14" fill="#646A73">先把专家组均匀分到节点</text>
<text x="56" y="382" font-size="14" fill="#646A73">适合预填充，专家并行规模小</text>
<rect x="612" y="298" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="329" font-size="18" fill="#1F2329" font-weight="bold">EPLB 全局策略</text>
<text x="628" y="359" font-size="14" fill="#646A73">全局复制再分到卡</text>
<text x="628" y="382" font-size="14" fill="#646A73">适合解码，专家并行规模大</text>
<rect x="40" y="418" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="447" font-size="15" fill="#1F2329">热专家按线上统计判断，定期调整（报告举例每 10 分钟）；负载预测常用历史滑动平均。</text>
<text x="40" y="506" font-size="12" fill="#646A73">来源：DeepSeek-V3 技术报告 3.4 节；EPLB README</text>
