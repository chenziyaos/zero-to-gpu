<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">负载不均：所有卡等最忙的专家</text>
<text x="40" y="92" font-size="14" fill="#646A73">专家层的效率上限 = 平均负载 ÷ 最大负载</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">做法</text>
<text x="364" y="176" font-size="14" fill="#1F2329" font-weight="bold">怎样处理溢出</text>
<text x="789" y="176" font-size="14" fill="#1F2329" font-weight="bold">代价或结果</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">容量因子（Switch、GShard）</text>
<text x="364" y="216" font-size="14" fill="#1F2329">超出容量的 token 丢弃，经残差传下去</text>
<text x="789" y="216" font-size="14" fill="#1F2329">丢弃通常不到 1%；因子大浪费算力</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">块稀疏（MegaBlocks）</text>
<text x="364" y="254" font-size="14" fill="#1F2329">按实际 token 数算，从不丢</text>
<text x="789" y="254" font-size="14" fill="#1F2329">比 Tutel 快至多 40%</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">负载均衡（DeepSeek-V3）</text>
<text x="364" y="292" font-size="14" fill="#1F2329">从路由上避免溢出</text>
<text x="789" y="292" font-size="14" fill="#1F2329">整个训练不丢 token</text>
<rect x="40" y="336" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="365" font-size="15" fill="#1F2329">配套代码：每个 token 只去一个专家，Zipf α = 1.5 无实测依据，max/mean 52.41（效率上限 1.9%）；“bottleneck”= 4193 ÷ 128，没有物理意义。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Switch Transformer；GShard；MegaBlocks；DeepSeek-V3；zero-to-gpu/22-moe-ep/sim_imbalance.py 实跑</text>
</svg>