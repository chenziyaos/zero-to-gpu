<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">节点受限路由：IB 上每个节点只发一份</text>
<text x="40" y="92" font-size="14" fill="#646A73">NVLink 160 GB/s，约为 IB 50 GB/s 的 3.2 倍；每个 token 最多发往 4 个节点</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">选节点</text>
<text x="56" y="211" font-size="14" fill="#646A73">最多 4 个</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">IB 发送</text>
<text x="347" y="211" font-size="14" fill="#646A73">到目标节点同号 GPU</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">NVLink 转发</text>
<text x="638" y="211" font-size="14" fill="#646A73">到承载专家的 GPU</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">专家计算</text>
<text x="929" y="211" font-size="14" fill="#646A73">每节点平均 3.2 个专家</text>
<rect x="40" y="262" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">combine 反向走</text>
<text x="56" y="323" font-size="14" fill="#646A73">节点内 NVLink 汇总并累加</text>
<text x="56" y="346" font-size="14" fill="#646A73">再经 IB 发回，接收端累加</text>
<rect x="612" y="262" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="293" font-size="18" fill="#1F2329" font-weight="bold">通信成本不变的上限</text>
<text x="628" y="323" font-size="14" fill="#646A73">4 节点 × 3.2 = 12.8</text>
<text x="628" y="346" font-size="14" fill="#646A73">实际选 8 个，最多可到 13 个</text>
<rect x="40" y="382" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="410" font-size="15" fill="#1F2329">配套代码 noderoute：跨节点比例 (4 − 1)/4 = 75%，把 k 份字节都按比例分配，漏了按节点去重。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：DeepSeek-V3 技术报告 3.2.2 节</text>
</svg>