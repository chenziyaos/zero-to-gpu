<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">会话活着但多数时间没在算，引擎容易把等待当作结束</text>
<text x="40" y="92" font-size="14" fill="#646A73">示意：一个会话的时间线（中位数会话执行时间只占寿命的 20%）</text>
<text x="148" y="172" font-size="14" fill="#1F2329" text-anchor="end">模型</text>
<rect x="160" y="150" width="1000" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="160" y="153" width="86" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="203" y="172" font-size="12" fill="#D46B08" text-anchor="middle">调用</text>
<rect x="446" y="153" width="86" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="489" y="172" font-size="12" fill="#D46B08" text-anchor="middle">调用</text>
<rect x="1017" y="153" width="86" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="1060" y="172" font-size="12" fill="#D46B08" text-anchor="middle">调用</text>
<text x="148" y="220" font-size="14" fill="#1F2329" text-anchor="end">工具</text>
<rect x="160" y="198" width="1000" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="246" y="201" width="86" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="289" y="220" font-size="12" fill="#245BDB" text-anchor="middle">执行</text>
<rect x="531" y="201" width="114" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="589" y="220" font-size="12" fill="#245BDB" text-anchor="middle">执行</text>
<text x="148" y="268" font-size="14" fill="#1F2329" text-anchor="end">等待</text>
<rect x="160" y="246" width="1000" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="331" y="249" width="114" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="389" y="268" font-size="12" fill="#646A73" text-anchor="middle">等结果</text>
<rect x="646" y="249" width="371" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="831" y="268" font-size="12" fill="#646A73" text-anchor="middle">等人确认，1 到 10 分钟最常见</text>
<rect x="40" y="310" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="339" font-size="15" fill="#1F2329">通用引擎把每次外部交互当作生成结束，InferCept 测得重算占前向时间的 37-40%。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：AgentSysBench（arXiv 2608.15127）；InferCept（arXiv 2402.01869）</text>
</svg>