<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Agent 会话的 KV 要跨过步与步之间的等待留下来</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇各章的位置</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">负载形态</text>
<text x="56" y="211" font-size="14" fill="#646A73">输入长、输出短（第 1 章）</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">等待</text>
<text x="347" y="211" font-size="14" fill="#646A73">间隔与过期代价（第 2、3 章）</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">留住 KV</text>
<text x="638" y="211" font-size="14" fill="#646A73">去留、原语、路由、分层（第 4</text>
<text x="638" y="234" font-size="14" fill="#646A73">到 7 章）</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">交界处</text>
<text x="929" y="211" font-size="14" fill="#646A73">压缩、约束解码（第 8、9 章）</text>
<rect x="40" y="284" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">问题</text>
<text x="56" y="346" font-size="14" fill="#646A73">等待被当作结束</text>
<text x="56" y="369" font-size="14" fill="#646A73">KV 被回收后整段重算</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">推理系统补什么</text>
<text x="437" y="346" font-size="14" fill="#646A73">按会话定去留、会话标识</text>
<text x="437" y="369" font-size="14" fill="#646A73">亲和路由、分层存储</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">框架配合什么</text>
<text x="819" y="346" font-size="14" fill="#646A73">前缀稳定、适时压缩</text>
<text x="819" y="369" font-size="14" fill="#646A73">关键工具设 strict</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：AgentSysBench（arXiv 2608.15127）；SGLang、vLLM、Anthropic、OpenAI 文档</text>
</svg>