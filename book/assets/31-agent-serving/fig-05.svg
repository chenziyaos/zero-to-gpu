<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">留还是丢：停顿短于约 3 分钟就留着更划算</text>
<text x="40" y="92" font-size="14" fill="#646A73">Llama 3 70B、8 卡 H100、166,721 个 token；MFU 0.5 为假设，显存为限制并发的资源</text>
<rect x="40" y="150" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">丢掉重算</text>
<text x="56" y="211" font-size="14" fill="#646A73">约 60 PFLOP</text>
<text x="56" y="234" font-size="14" fill="#646A73">8 卡约 15.2 秒，也是回来时的 TTFT</text>
<rect x="612" y="150" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">留在显存</text>
<text x="628" y="211" font-size="14" fill="#646A73">KV 约 54.6 GB</text>
<text x="628" y="234" font-size="14" fill="#646A73">占整机 640 GB 的 8.5%</text>
<rect x="40" y="284" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="313" font-size="15" fill="#1F2329">两者相等的停顿约 178 秒；生产会话的间隔多数在 1 到 10 分钟，正好跨过这条线。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：主编核算（H100 规格页、Llama 3 论文）；间隔分布来自 AgentSysBench</text>
</svg>