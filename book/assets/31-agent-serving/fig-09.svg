<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">压缩用一次长解码，换后面每一步更短的 prefill 和更小的 KV</text>
<text x="40" y="92" font-size="14" fill="#646A73">3,170 次压缩里，99% 把上下文缩短 70% 以上</text>
<rect x="40" y="150" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">花掉的</text>
<text x="56" y="211" font-size="14" fill="#646A73">平均读 176K、写 5K 个 token</text>
<text x="56" y="234" font-size="14" fill="#646A73">平均 156 秒，P99 为 775 秒</text>
<rect x="612" y="150" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">换来的</text>
<text x="628" y="211" font-size="14" fill="#646A73">166,721 个 token 约剩 50,016 个</text>
<text x="628" y="234" font-size="14" fill="#646A73">KV 从 54.6 GB 降到 16.4 GB</text>
<rect x="40" y="284" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="313" font-size="15" fill="#1F2329">缓存前缀依次是工具定义、系统提示词、消息：压缩只改消息，前两段仍能命中。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：AgentSysBench（arXiv 2608.15127）；KV 按 Llama 3 70B 主编核算</text>
</svg>