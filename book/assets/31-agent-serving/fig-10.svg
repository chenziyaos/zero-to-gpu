<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">参数 schema 只在工具设了 strict 时才被强制</text>
<text x="40" y="92" font-size="14" fill="#646A73">vLLM 开启结构化标签约束时，tool_choice 各取值的行为</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">tool_choice</text>
<text x="340" y="176" font-size="14" fill="#1F2329" font-weight="bold">是否必须调用</text>
<text x="692" y="176" font-size="14" fill="#1F2329" font-weight="bold">参数 schema</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">指定函数</text>
<text x="340" y="216" font-size="14" fill="#1F2329">调用所选函数</text>
<text x="692" y="216" font-size="14" fill="#1F2329">设 strict 才强制</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">required</text>
<text x="340" y="254" font-size="14" fill="#1F2329">至少一个工具调用</text>
<text x="692" y="254" font-size="14" fill="#1F2329">设 strict 才强制</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">auto</text>
<text x="340" y="292" font-size="14" fill="#1F2329">可选</text>
<text x="692" y="292" font-size="14" fill="#1F2329">有工具设 strict 时才启用约束</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">none</text>
<text x="340" y="330" font-size="14" fill="#1F2329">不调用</text>
<text x="692" y="330" font-size="14" fill="#1F2329">工具定义默认仍放进提示词</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">推理模型用 --reasoning-parser，思考段结束后才开始约束。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：vLLM 文档 Tool Calling；SGLang 文档 Structured Outputs For Reasoning Models</text>
</svg>