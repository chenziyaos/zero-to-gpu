<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">SGLang 的会话原语：带上标识，结束时关闭，逐出时先走无主的 KV</text>
<text x="40" y="92" font-size="14" fill="#646A73">会话引用是软保护，显存不够时被引用的 KV 也会被逐出</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">原语或策略</text>
<text x="319" y="176" font-size="14" fill="#1F2329" font-weight="bold">做什么</text>
<text x="825" y="176" font-size="14" fill="#1F2329" font-weight="bold">注意</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">session_id</text>
<text x="319" y="216" font-size="14" fill="#1F2329">每个请求带同一个标识，结束后登记缓存叶子</text>
<text x="825" y="216" font-size="14" fill="#1F2329">不替你拼接上下文</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">/close_session</text>
<text x="319" y="254" font-size="14" fill="#1F2329">去掉会话引用</text>
<text x="825" y="254" font-size="14" fill="#1F2329">不立即释放 KV</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">逐出顺序</text>
<text x="319" y="292" font-size="14" fill="#1F2329">无引用的先走，被活跃会话引用的后走</text>
<text x="825" y="292" font-size="14" fill="#1F2329">软保护，不钉住显存</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">tlru</text>
<text x="319" y="330" font-size="14" fill="#1F2329">只保护下一次 prefill 满足 TTFT 预算所需的历史</text>
<text x="825" y="330" font-size="14" fill="#1F2329">适合多轮和 Agent</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">state_cost</text>
<text x="319" y="368" font-size="14" fill="#1F2329">按最近使用加重建代价给状态检查点打分</text>
<text x="825" y="368" font-size="14" fill="#1F2329">用于混合模型</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：SGLang 文档 Session-Aware Radix Cache、Radix Cache Eviction Policies</text>
</svg>