<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">cache_aware 路由：先找前缀最长的机器，太忙或没命中就按负载挑</text>
<text x="40" y="92" font-size="14" fill="#646A73">sgl-router 为每个 worker 维护一棵前缀树，数据来自 worker 发布的 KV 事件</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">请求到来</text>
<text x="56" y="211" font-size="14" fill="#646A73">带完整提示词</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">查前缀树</text>
<text x="347" y="211" font-size="14" fill="#646A73">最长匹配，至少 1024 token（</text>
<text x="347" y="234" font-size="14" fill="#646A73">示例）</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">首选可用</text>
<text x="638" y="211" font-size="14" fill="#646A73">发到缓存所在的 worker</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">否则</text>
<text x="929" y="211" font-size="14" fill="#646A73">power_of_two 选轻的</text>
<rect x="40" y="284" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">API 侧</text>
<text x="56" y="346" font-size="14" fill="#646A73">缓存在单台机器上</text>
<text x="56" y="369" font-size="14" fill="#646A73">每个缓存键每分钟约 15 个请求</text>
<rect x="612" y="284" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="316" font-size="18" fill="#1F2329" font-weight="bold">DualMap</text>
<text x="628" y="346" font-size="14" fill="#646A73">两个哈希给出两台候选</text>
<text x="628" y="369" font-size="14" fill="#646A73">超 SLO 转负载优先，容量最多 2.25 倍</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：SGLang 文档 DP, DPA and sgl-router；OpenAI 文档 Prompt caching；DualMap（arXiv 2602.06502）</text>
</svg>