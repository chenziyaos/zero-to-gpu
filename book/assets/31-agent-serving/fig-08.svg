<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">同一段 KV，从主机内存搬回来比重算快约 142 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">54.6 GB KV、8 卡 H100；搬运按每卡单向 64 GB/s 的理想值（主编假设）</text>
<text x="208" y="168" font-size="14" fill="#1F2329" text-anchor="end">整段重算</text>
<rect x="220" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="150" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="928" y="168" font-size="13" fill="#646A73">  约 15.2 秒</text>
<text x="208" y="210" font-size="14" fill="#1F2329" text-anchor="end">从主机内存搬回</text>
<rect x="220" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="192" width="5" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="233" y="210" font-size="13" fill="#646A73">  约 0.107 秒</text>
<rect x="40" y="248" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="277" font-size="15" fill="#1F2329">HiCache：显存 L1、主机内存 L2、分布式存储 L3，计算第 N 层时加载第 N+1 层。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：主编核算（H100 规格页 PCIe Gen5 128GB/s）；SGLang HiCache 文档</text>
</svg>