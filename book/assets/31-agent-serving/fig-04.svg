<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">同一步调用，前缀被逐出时价格约是命中时的 12 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">166,721 个 token 上下文、151 个 token 输出，按 Claude Opus 4.6 标价（美元）</text>
<text x="188" y="168" font-size="14" fill="#1F2329" text-anchor="end">前缀命中</text>
<rect x="200" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="150" width="58" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="266" y="168" font-size="13" fill="#646A73">  约 0.087</text>
<text x="188" y="210" font-size="14" fill="#1F2329" text-anchor="end">前缀被逐出</text>
<rect x="200" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="192" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="908" y="210" font-size="13" fill="#646A73">  约 1.05</text>
<rect x="40" y="248" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="277" font-size="15" fill="#1F2329">缓存寿命 5 分钟时，59.4% 的会话被逐出过，逐出导致的重写占总成本 31.5%。</text>
<rect x="40" y="298" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="327" font-size="15" fill="#1F2329">1 小时寿命写入 2 倍、5 分钟写入 1.25 倍、读取 0.1 倍：平均超过 0.65 次逐出就回本。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：AgentSysBench 给出的标价与 Anthropic 计价倍数；主编核算</text>
</svg>