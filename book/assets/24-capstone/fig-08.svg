<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">推理实例数 = max（输出 token 需求 ÷ 解码容量，请求率 ÷ 预填充容量）</text>
<text x="40" y="92" font-size="14" fill="#646A73">Llama 3 70B、8 张 H100 SXM 一个实例，按带宽和峰值算的下限</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">容量</text>
<text x="446" y="176" font-size="14" fill="#1F2329" font-weight="bold">条件</text>
<text x="869" y="176" font-size="14" fill="#1F2329" font-weight="bold">单实例</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">解码</text>
<text x="446" y="216" font-size="14" fill="#1F2329">16384 token，88 并发，每步 22.90 ms</text>
<text x="869" y="216" font-size="14" fill="#1F2329">约 3843 token/s</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">解码</text>
<text x="446" y="254" font-size="14" fill="#1F2329">2048 token，88 并发，每步 7.47 ms</text>
<text x="869" y="254" font-size="14" fill="#1F2329">约 11780 token/s</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">预填充</text>
<text x="446" y="292" font-size="14" fill="#1F2329">4096 token，峰值 73.1 ms</text>
<text x="869" y="292" font-size="14" fill="#1F2329">约 13.68 请求/s</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">预填充</text>
<text x="446" y="330" font-size="14" fill="#1F2329">同上，按 0.4 的利用率</text>
<text x="869" y="330" font-size="14" fill="#1F2329">约 5.47 请求/s</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">再按 TTFT、TPOT 的 SLO 检查批大小，以 goodput 验收。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：GPU-23 第 3、4 章；H100 产品页；本篇推算</text>
</svg>