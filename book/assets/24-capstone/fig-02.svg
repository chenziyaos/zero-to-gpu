<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一个方案先回答三个问题：装得下吗、算多久、在等什么</text>
<text x="40" y="92" font-size="14" fill="#646A73">每个问题对应一本账和本系列的若干篇</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">问题</text>
<text x="282" y="176" font-size="14" fill="#1F2329" font-weight="bold">怎么算</text>
<text x="770" y="176" font-size="14" fill="#1F2329" font-weight="bold">对应章节</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">装得下吗</text>
<text x="282" y="216" font-size="14" fill="#1F2329">训练每参数 16 字节加激活；推理权重加 KV</text>
<text x="770" y="216" font-size="14" fill="#1F2329">第 2 章；GPU-10、GPU-21、GPU-23</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">算多久</text>
<text x="282" y="254" font-size="14" fill="#1F2329">6NT ÷（卡数 × 稠密峰值 × MFU）；推理按字节和 FLOPs</text>
<text x="770" y="254" font-size="14" fill="#1F2329">第 3、4、7 章；GPU-02</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">在等什么</text>
<text x="282" y="292" font-size="14" fill="#1F2329">T = T_compute + W_mem + W_host + W_comm + W_idle</text>
<text x="770" y="292" font-size="14" fill="#1F2329">第 9 章；各篇</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">再进工期和成本</text>
<text x="282" y="330" font-size="14" fill="#1F2329">故障、检查点；卡时 × 单价</text>
<text x="770" y="330" font-size="14" fill="#1F2329">第 6、8 章；GPU-20</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：本篇；GPU-00 时间账</text>
</svg>