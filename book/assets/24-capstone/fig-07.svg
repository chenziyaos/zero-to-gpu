<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect x="0" y="0" width="1200" height="460" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Llama 3 405B：54 天 466 次中断，意外中断约 3.09 小时一次</text>
<text x="40" y="92" font-size="14" fill="#646A73">预训练期间 54 天观察窗口</text>
