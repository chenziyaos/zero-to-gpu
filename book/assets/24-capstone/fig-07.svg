<text x="628" y="374" font-size="14" fill="#646A73">+ 中断次数 ×（半个间隔 + 重启）</text>
<text x="40" y="436" font-size="12" fill="#646A73">来源：Llama 3 论文 3.3.4 节与表 5；本篇推算</text>
