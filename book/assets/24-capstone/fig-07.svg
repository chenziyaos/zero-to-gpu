<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="948" y="168" font-size="13" fill="#646A73">  466 次</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">意外中断</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="629" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="877" y="210" font-size="13" fill="#646A73">  419 次，约 78% 与硬件有关</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">计划内维护</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="71" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="319" y="252" font-size="13" fill="#646A73">  47 次</text>
<rect x="40" y="290" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="321" font-size="18" fill="#1F2329" font-weight="bold">结果</text>
<text x="56" y="351" font-size="14" fill="#646A73">有效训练时间 90% 以上</text>
<text x="56" y="374" font-size="14" fill="#646A73">GPU 问题占意外中断的 58.7%</text>
