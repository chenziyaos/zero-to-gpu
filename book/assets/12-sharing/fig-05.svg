<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">MIG 上线流程：Hopper 起重启后要重建</text>
<text x="40" y="92" font-size="14" fill="#646A73">开 MIG、建实例、交给程序；A100 与 H100 在重置和持久性上不同</text>
<rect x="40" y="140" width="189" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">停守护进程</text>
<text x="56" y="201" font-size="14" fill="#646A73">停掉 DCGM 等持有驱动</text>
<text x="56" y="224" font-size="14" fill="#646A73">句柄的进程</text>
<polyline points="235,192 267,192" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,186 267,192 257,198" fill="#8F959E"/>
<rect x="273" y="140" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="302" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="302" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="171" font-size="18" fill="#1F2329" font-weight="bold">开 MIG</text>
<text x="289" y="201" font-size="14" fill="#646A73">nvidia-smi -i ＜卡＞</text>
<text x="289" y="224" font-size="14" fill="#646A73">-mig 1</text>
<polyline points="468,192 500,192" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,186 500,192 490,198" fill="#8F959E"/>
<rect x="506" y="140" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="535" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="535" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="171" font-size="18" fill="#1F2329" font-weight="bold">建 GI 和 CI</text>
<text x="522" y="201" font-size="14" fill="#646A73">nvidia-smi mig -cgi</text>
<text x="522" y="224" font-size="14" fill="#646A73">＜profile＞ -C</text>
<polyline points="700,192 732,192" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,186 732,192 722,198" fill="#8F959E"/>
<rect x="738" y="140" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="767" cy="165" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="767" y="170" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="171" font-size="18" fill="#1F2329" font-weight="bold">核对</text>
<text x="754" y="201" font-size="14" fill="#646A73">nvidia-smi -L 看</text>
<text x="754" y="224" font-size="14" fill="#646A73">MIG 设备和 UUID</text>
<polyline points="933,192 965,192" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,186 965,192 955,198" fill="#8F959E"/>
<rect x="971" y="140" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="165" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="170" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="171" font-size="18" fill="#1F2329" font-weight="bold">交给程序</text>
<text x="987" y="201" font-size="14" fill="#646A73">CUDA_VISIBLE_DEVICES</text>
<text x="987" y="224" font-size="14" fill="#646A73">写 CI 的 UUID</text>
<rect x="40" y="284" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">A100、A30</text>
<text x="56" y="346" font-size="14" fill="#646A73">开 MIG 要重置 GPU</text>
<text x="56" y="369" font-size="14" fill="#646A73">模式记在 InfoROM，重启后保留</text>
<rect x="612" y="284" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="316" font-size="18" fill="#1F2329" font-weight="bold">Hopper 及以后</text>
<text x="628" y="346" font-size="14" fill="#646A73">开 MIG 不需要重置</text>
<text x="628" y="369" font-size="14" fill="#646A73">驱动重新加载或重启后 MIG 关闭</text>
<rect x="40" y="425" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="454" font-size="15" fill="#1F2329">R570 起一个进程可跨多个 GI，每个 GI 只枚举一个 CI；所有卡合计最多 64 个 MIG 实例；跨 GI 不支持 CUDA IPC。</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：NVIDIA Multi-Instance GPU User Guide, Getting Started with MIG、Deployment Considerations、MIG Device Names</text>
</svg>