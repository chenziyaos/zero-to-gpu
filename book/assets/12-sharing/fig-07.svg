<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570">
<rect x="0" y="0" width="1200" height="570" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">MPS 静态 SM 分区按 chunk 切：H100 SXM5 是 16 个 chunk 余 4 个 SM</text>
<text x="40" y="92" font-size="14" fill="#646A73">Hopper 起每个 chunk 8 个 SM；Hopper 之前 v2 接口 4 个、v3 接口 2 个</text>
<text x="40" y="158" font-size="15" fill="#1F2329" font-weight="bold">H100 SXM5 的 132 个 SM</text>
<rect x="40" y="170" width="815" height="40" rx="4" fill="#3370FF" stroke="#FFFFFF" stroke-width="2"/>
<rect x="855" y="170" width="25" height="40" rx="4" fill="#FF8800" stroke="#FFFFFF" stroke-width="2"/>
<line x1="447" y1="212" x2="447" y2="222" stroke="#82A7FC" stroke-width="1"/>
<text x="380" y="236" font-size="13" fill="#245BDB">16 个 chunk 128 SM</text>
<line x1="867" y1="212" x2="867" y2="222" stroke="#FFBA6B" stroke-width="1"/>
<text x="816" y="236" font-size="13" fill="#D46B08">余数 4 SM</text>
<rect x="40" y="298" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="329" font-size="18" fill="#1F2329" font-weight="bold">旧版 v2 接口</text>
<text x="56" y="359" font-size="14" fill="#646A73">chunk 分完后，余数在第一个客户端连上时</text>
<text x="56" y="382" font-size="14" fill="#646A73">自动分给最早创建的分区</text>
<rect x="612" y="298" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="329" font-size="18" fill="#1F2329" font-weight="bold">v3 接口</text>
<text x="628" y="359" font-size="14" fill="#646A73">余数不自动分配</text>
<text x="628" y="382" font-size="14" fill="#646A73">建分区时加 --include-remainder=true</text>
<text x="628" y="405" font-size="14" fill="#646A73">每张卡只有一个分区能领余数</text>
<rect x="40" y="462" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="490" font-size="15" fill="#1F2329">静态分区模式下，客户端建上下文前必须设 CUDA_MPS_SM_PARTITION；申请超过可用 SM 会报错。显存另用 CUDA_MPS_PINNED_DEVICE_MEM_LIMIT 限制。</text>
<text x="40" y="546" font-size="12" fill="#646A73">来源：NVIDIA Multi-Process Service, When to Use MPS（Static SM Partitioning）；NVIDIA Hopper Architecture In-Depth（132 SMs）；分法为本文推算</text>
</svg>