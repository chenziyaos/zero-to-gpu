<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">容器和 Kubernetes：看得到不等于隔离</text>
<text x="40" y="92" font-size="14" fill="#646A73">时间片把一张卡上报为多个副本，副本之间没有显存和故障隔离</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">容器选卡</text>
<text x="56" y="201" font-size="14" fill="#646A73">--gpus 或 NVIDIA_VISIBLE_DEVICES</text>
<text x="56" y="224" font-size="14" fill="#646A73">基础 CUDA 镜像默认 all</text>
<text x="56" y="247" font-size="14" fill="#646A73">只决定能枚举到哪些设备</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">时间片副本</text>
<text x="437" y="201" font-size="14" fill="#646A73">replicas: 4 即一卡上报 4 份</text>
<text x="437" y="224" font-size="14" fill="#646A73">时间平均分给所有 GPU 进程</text>
<text x="437" y="247" font-size="14" fill="#646A73">显存和故障不隔离</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">MIG 设备</text>
<text x="819" y="201" font-size="14" fill="#646A73">每个 pod 拿一个 MIG 实例</text>
<text x="819" y="224" font-size="14" fill="#646A73">显存带宽 QoS、错误隔离</text>
<text x="819" y="247" font-size="14" fill="#646A73">2020 年起 Kubernetes 支持</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">renameByDefault=true 时共享资源以 nvidia.com/gpu.shared 上报，pod 必须显式申请；申请多个副本不会得到成比例更多的 GPU。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NVIDIA Container Toolkit, Specialized Configurations with Docker；GPU Operator, Time-Slicing GPUs in Kubernetes</text>
</svg>