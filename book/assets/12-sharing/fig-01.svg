<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一张卡吃不满：先找空闲来源，再按隔离要求选共享方式</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇处理 W_idle 里任务太小、单独占卡时 SM 空等的那部分</text>
<rect x="40" y="150" width="189" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
