<text x="767" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">容器与集群</text>
<text x="754" y="211" font-size="14" fill="#646A73">可见设备、时间片副本（</text>
<text x="754" y="234" font-size="14" fill="#646A73">第 7 章）</text>
<polyline points="933,214 965,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,208 965,214 955,220" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">选型</text>
<text x="987" y="211" font-size="14" fill="#646A73">隔离、规格、并发、共享，</text>
<text x="987" y="234" font-size="14" fill="#646A73">依次判断（第 8 章）</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：NVIDIA Multi-Instance GPU User Guide；Multi-Process Service；GPU Operator, Time-Slicing GPUs in Kubernetes</text>
