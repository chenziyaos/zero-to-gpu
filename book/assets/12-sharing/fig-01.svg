<text x="302" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">MIG 切卡</text>
<text x="289" y="211" font-size="14" fill="#646A73">切片、profile、放置、</text>
<text x="289" y="234" font-size="14" fill="#646A73">开启与枚举（第 2 到 4</text>
<text x="289" y="257" font-size="14" fill="#646A73">章）</text>
<polyline points="468,214 500,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,208 500,214 490,220" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">MPS 并发</text>
<text x="522" y="211" font-size="14" fill="#646A73">结构、错误范围、SM 与</text>
<text x="522" y="234" font-size="14" fill="#646A73">显存划分（第 5、6 章）</text>
<polyline points="700,214 732,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,208 732,214 722,220" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
