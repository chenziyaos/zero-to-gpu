<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570">
<rect x="0" y="0" width="1200" height="570" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">MPS：客户端并发提交，致命错误一起承担</text>
<text x="40" y="92" font-size="14" fill="#646A73">Volta 起客户端直接向 GPU 提交工作；server 持有调度资源，一个用户一个 server</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">nvidia-cuda-mps-control</text>
<text x="56" y="201" font-size="14" fill="#646A73">控制守护进程</text>
<text x="56" y="224" font-size="14" fill="#646A73">启停 server，协调连接</text>
<text x="56" y="247" font-size="14" fill="#646A73">同一时间最多一个活动 server</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">nvidia-cuda-mps-server</text>
<text x="437" y="201" font-size="14" fill="#646A73">客户端共用的 GPU 连接</text>
<text x="437" y="224" font-size="14" fill="#646A73">持有调度资源</text>
<text x="437" y="247" font-size="14" fill="#646A73">与客户端同一用户 ID</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">客户端（libcuda.so）</text>
<text x="819" y="201" font-size="14" fill="#646A73">对程序透明</text>
<text x="819" y="224" font-size="14" fill="#646A73">直接提交工作，不经 server</text>
<text x="819" y="247" font-size="14" fill="#646A73">地址空间各自独立</text>
<rect x="40" y="318" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="343" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="348" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="349" font-size="18" fill="#1F2329" font-weight="bold">客户端出错</text>
<text x="56" y="379" font-size="14" fill="#646A73">某个客户端触发致命 GPU 错误</text>
<polyline points="293,370 325,370" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,364 325,370 315,376" fill="#8F959E"/>
<rect x="331" y="318" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="343" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="348" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="349" font-size="18" fill="#1F2329" font-weight="bold">全部通知</text>
<text x="347" y="379" font-size="14" fill="#646A73">同组 GPU 上所有客户端收到错误，</text>
<text x="347" y="402" font-size="14" fill="#646A73">不说是谁</text>
<polyline points="584,370 616,370" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,364 616,370 606,376" fill="#8F959E"/>
<rect x="622" y="318" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="343" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="348" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="349" font-size="18" fill="#1F2329" font-weight="bold">FAULT</text>
<text x="638" y="379" font-size="14" fill="#646A73">server 拒绝新连接，等这些客户</text>
<text x="638" y="402" font-size="14" fill="#646A73">端全部退出</text>
<polyline points="875,370 907,370" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,364 907,370 897,376" fill="#8F959E"/>
<rect x="913" y="318" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="343" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="348" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="349" font-size="18" fill="#1F2329" font-weight="bold">恢复</text>
<text x="929" y="379" font-size="14" fill="#646A73">重建上下文，回到 ACTIVE</text>
<rect x="40" y="458" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="487" font-size="15" fill="#1F2329">客户端上限：MPS 文档写每卡 60 个上下文（CUDA_DEVICE_MAX_CONNECTIONS 默认 2），MIG 指南写 48；规划按 48。</text>
<text x="40" y="546" font-size="12" fill="#646A73">来源：NVIDIA Multi-Process Service：Overview、Architecture、When to Use MPS；MIG User Guide, Concepts</text>
</svg>