<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">三种共享一张卡的办法：时间片、MPS、MIG</text>
<text x="40" y="92" font-size="14" fill="#646A73">不同 CUDA 上下文的工作只能分时执行，这是小进程直接共卡依然吃不满的原因</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">时间片</text>
<text x="56" y="201" font-size="14" fill="#646A73">多个进程或 pod 轮流用整张卡</text>
<text x="56" y="224" font-size="14" fill="#646A73">不改硬件，不加服务</text>
<text x="56" y="247" font-size="14" fill="#646A73">显存和故障都不隔离</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">MPS</text>
<text x="437" y="201" font-size="14" fill="#646A73">多个进程共用一个 server 的调度资源</text>
<text x="437" y="224" font-size="14" fill="#646A73">kernel 可以同时占用 SM</text>
<text x="437" y="247" font-size="14" fill="#646A73">地址空间独立，错误不隔离</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">MIG</text>
<text x="819" y="201" font-size="14" fill="#646A73">硬件上切出最多七个 GPU 实例</text>
<text x="819" y="224" font-size="14" fill="#646A73">显存、L2、显存控制器各自独占</text>
<text x="819" y="247" font-size="14" fill="#646A73">显存带宽 QoS 和错误隔离</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">从左到右隔离增强，灵活性下降：时间片随时改副本数，MPS 随进程启动生效，MIG 的实例只能在空闲时重建。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NVIDIA MPS Architecture；MIG User Guide, Introduction；GPU Operator, Time-Slicing GPUs in Kubernetes</text>
</svg>