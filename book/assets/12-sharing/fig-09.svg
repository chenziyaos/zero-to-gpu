<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">选型顺序：先隔离，再规格，再并发，最后才是能共享就行</text>
<text x="40" y="92" font-size="14" fill="#646A73">利用率高低排在隔离要求之后；MPS 可以叠在 MIG 实例上</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">要隔离吗</text>
<text x="56" y="211" font-size="14" fill="#646A73">多租户、互不信任、出错不能波及：</text>
<text x="56" y="234" font-size="14" fill="#646A73">MIG</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">规格合适吗</text>
<text x="347" y="211" font-size="14" fill="#646A73">实例只能从 profile 表里选；切</text>
<text x="347" y="234" font-size="14" fill="#646A73">不出就凑整卡或改 MPS</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">互相信任、要并发</text>
<text x="638" y="211" font-size="14" fill="#646A73">同一服务的多进程、MPI：MPS，</text>
<text x="638" y="234" font-size="14" fill="#646A73">限 SM 和显存</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">只要共享</text>
<text x="929" y="211" font-size="14" fill="#646A73">开发、测试、短任务：时间片</text>
<rect x="40" y="294" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">MIG 指南的对比：MPS 最多 48 份，SM 按比例限制但调度硬件共享，不隔离错误和显存带宽；MIG 最多 7 份，隔离错误并提供带宽 QoS。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：NVIDIA MIG User Guide, Concepts（CUDA Concurrency Mechanisms 表）与 Deployment Considerations；GPU Operator, Time-Slicing</text>
</svg>