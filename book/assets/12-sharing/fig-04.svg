<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<rect x="0" y="0" width="1200" height="600" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">放置决定能建什么：两个 1g 放错位置，3g 就建不出来</text>
<text x="40" y="92" font-size="14" fill="#646A73">A100-40GB 的合法放置（nvidia-smi mig -lgipp），格式为“起始位置:占用数”；横轴是 8 个位置</text>
<text x="280" y="140" font-size="13" fill="#646A73" text-anchor="middle">0</text>
<text x="360" y="140" font-size="13" fill="#646A73" text-anchor="middle">1</text>
<text x="440" y="140" font-size="13" fill="#646A73" text-anchor="middle">2</text>
<text x="520" y="140" font-size="13" fill="#646A73" text-anchor="middle">3</text>
<text x="600" y="140" font-size="13" fill="#646A73" text-anchor="middle">4</text>
<text x="680" y="140" font-size="13" fill="#646A73" text-anchor="middle">5</text>
<text x="760" y="140" font-size="13" fill="#646A73" text-anchor="middle">6</text>
<text x="840" y="140" font-size="13" fill="#646A73" text-anchor="middle">7</text>
<text x="228" y="172" font-size="14" fill="#1F2329" text-anchor="end">1g.5gb · 0 到 6，各占 1</text>
<rect x="243" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="323" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="403" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="483" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="563" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="643" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="723" y="153" width="74" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="228" y="218" font-size="14" fill="#1F2329" text-anchor="end">2g.10gb · 0、2、4，各占 2</text>
<rect x="243" y="199" width="154" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="403" y="199" width="154" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<rect x="563" y="199" width="154" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="228" y="264" font-size="14" fill="#1F2329" text-anchor="end">3g.20gb · 0、4，各占 4</text>
<rect x="243" y="245" width="314" height="28" rx="6" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<rect x="563" y="245" width="314" height="28" rx="6" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="228" y="310" font-size="14" fill="#1F2329" text-anchor="end">4g.20gb · 0，占 4</text>
<rect x="243" y="291" width="314" height="28" rx="6" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="228" y="356" font-size="14" fill="#1F2329" text-anchor="end">7g.40gb · 0，占 8</text>
<rect x="243" y="337" width="634" height="28" rx="6" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="228" y="432" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">例：先建两个 1g</text>
<rect x="243" y="413" width="74" height="28" rx="6" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<rect x="323" y="413" width="74" height="28" rx="6" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<rect x="403" y="413" width="74" height="28" rx="6" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="440" y="432" font-size="13" fill="#D46B08" text-anchor="middle">1g</text>
<rect x="483" y="413" width="74" height="28" rx="6" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<rect x="563" y="413" width="74" height="28" rx="6" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<rect x="643" y="413" width="74" height="28" rx="6" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="680" y="432" font-size="13" fill="#D46B08" text-anchor="middle">1g</text>
<rect x="723" y="413" width="74" height="28" rx="6" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<rect x="803" y="413" width="74" height="28" rx="6" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<rect x="40" y="484" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="513" font-size="15" fill="#1F2329">位置 2 挡住了 0 起的 3g，位置 5 挡住了 4 起的 3g：还空着 6 个位置，却一个 3g.20gb 也建不出来。大实例先建，布局按方案整体重建。</text>
<text x="40" y="576" font-size="12" fill="#646A73">来源：NVIDIA Multi-Instance GPU User Guide, Getting Started with MIG（-lgipp 示例）与 Concepts；下方例子为本文按放置表推演</text>
</svg>