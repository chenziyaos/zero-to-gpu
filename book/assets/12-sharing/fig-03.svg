<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">MIG 的两级：GPU 实例拿显存和 SM，计算实例只分 SM</text>
<text x="40" y="92" font-size="14" fill="#646A73">显存 slice 约为整卡显存资源的 1/8（含容量和带宽），SM slice 约为 MIG 模式下 SM 的 1/7</text>
<rect x="40" y="140" width="548" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">GPU 实例（GI）</text>
<text x="56" y="201" font-size="14" fill="#646A73">若干显存 slice + 若干 SM slice + 引擎</text>
<text x="56" y="224" font-size="14" fill="#646A73">专用的显存容量和带宽：显存 QoS</text>
<text x="56" y="247" font-size="14" fill="#646A73">crossbar 端口、L2 bank、显存控制器独占</text>
<text x="56" y="270" font-size="14" fill="#646A73">多租户之间用 GI 隔开</text>
<rect x="612" y="140" width="548" height="150" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">计算实例（CI）</text>
<text x="628" y="201" font-size="14" fill="#646A73">GI 里的一部分 SM slice</text>
<text x="628" y="224" font-size="14" fill="#646A73">与同一 GI 的其他 CI 共享显存和引擎</text>
<text x="628" y="247" font-size="14" fill="#646A73">只隔离 SM</text>
<text x="628" y="270" font-size="14" fill="#646A73">同一租户内部再细分时用</text>
<rect x="40" y="326" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="355" font-size="15" fill="#1F2329">一张卡最多七个 GPU 实例。别的实例打满自己的缓存和带宽时，一个实例的 L2 分配和 DRAM 带宽不变。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：NVIDIA Multi-Instance GPU User Guide, Concepts 与 Introduction</text>
</svg>