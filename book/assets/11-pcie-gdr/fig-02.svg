<text x="319" y="168" font-size="13" fill="#646A73">15.754 GB/s</text>
<text x="208" y="210" font-size="14" fill="#1F2329" text-anchor="end">PCIe 4.0 x16</text>
<rect x="220" y="192" width="697" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
