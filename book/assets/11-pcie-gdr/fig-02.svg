<rect x="220" y="234" width="697" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="234" width="363" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="591" y="252" font-size="13" fill="#646A73">63.015 GB/s  H100 SXM 所在的代际</text>
<text x="208" y="294" font-size="14" fill="#1F2329" text-anchor="end">PCIe 6.0 x16</text>
<rect x="220" y="276" width="697" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="276" width="697" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="925" y="294" font-size="13" fill="#646A73">121 GB/s</text>
<rect x="40" y="338" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">Hopper 的 HBM3 最高约 3 TB/s，是 Gen5 x16 单向的 47.6 倍；数据链路层再吃掉约 8% 到 10%，实际目标取规格、LnkSta 与同型号实测中最小的。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Wikipedia, PCI Express（链路带宽表）；Neugebauer et al., SIGCOMM 2018；NVIDIA Hopper Tuning Guide</text>
</svg>