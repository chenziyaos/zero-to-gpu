<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">远端 NUMA 的代价集中在小块读：64 字节降 20%，512 字节看不出差别</text>
<text x="40" y="92" font-size="14" fill="#646A73">缓冲区放在远端节点时，DMA 读吞吐比本地低多少，%；DMA 写不受影响</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">64 字节读</text>
<rect x="240" y="150" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="552" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="800" y="168" font-size="13" fill="#646A73">20%  约 32 Gb/s 降到约 25 Gb/s</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">128、256 字节读</text>
<rect x="240" y="192" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="193" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="441" y="210" font-size="13" fill="#646A73">7%  论文给的是 5% 到 7%，画上限</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">512 字节读</text>
<rect x="240" y="234" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="252" y="252" font-size="13" fill="#646A73">0%  看不出差别</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">DMA 写</text>
<rect x="240" y="276" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="252" y="294" font-size="13" fill="#646A73">0%  不受本地或远端影响</text>
<rect x="40" y="338" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">这是 2018 年网卡平台上的规律，GPU 拷贝多是大块传输；本机要用 numactl 绑本地和远端各测一次 H2D、D2H。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Neugebauer et al., Understanding PCIe performance for end host networking, SIGCOMM 2018（PCIe 3.0 平台）</text>
</svg>