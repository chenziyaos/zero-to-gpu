<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">IOMMU 打开、访问范围超过 256KB 后，小块 DMA 读吞吐骤降</text>
<text x="40" y="92" font-size="14" fill="#646A73">DMA 读吞吐的降幅，%；作者据此推断那台机器的 IO-TLB 只有 64 项（256KB ÷ 4KB）</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">64 字节读</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="612" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="860" y="168" font-size="13" fill="#646A73">70%  近 70%</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">256 字节读</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="262" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="510" y="210" font-size="13" fill="#646A73">30%</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">512 字节及以上</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="4" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="252" y="252" font-size="13" fill="#646A73">0%  没有变化</text>
<rect x="40" y="296" width="1120" height="49" rx="12" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1"/>
<text x="56" y="325" font-size="15" fill="#1F2329">性能之外更要紧的是正确性：CUDA 不支持开着 IOMMU 的 Linux 裸机 P2P，裸机用 iommu=pt 或关闭，虚拟机开 IOMMU 并用 VFIO。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：Neugebauer et al., Understanding PCIe performance for end host networking, SIGCOMM 2018</text>
</svg>