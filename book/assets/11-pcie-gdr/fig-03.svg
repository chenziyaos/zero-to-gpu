<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">topo -m 的六种符号：越往下，路径经过的部件越多</text>
<text x="40" y="92" font-size="14" fill="#646A73">每种符号对应的路径，以及 NCCL_P2P_LEVEL 设成它时 NCCL 在多远的距离上仍用 P2P</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">符号</text>
<text x="186" y="166" font-size="14" fill="#1F2329" font-weight="bold">路径经过的部件</text>
<text x="679" y="166" font-size="14" fill="#1F2329" font-weight="bold">NCCL_P2P_LEVEL 取该值时</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">NV#</text>
<text x="186" y="206" font-size="14" fill="#1F2329"># 条绑定在一起的 NVLink</text>
<text x="679" y="206" font-size="14" fill="#1F2329">NVL：只在 NVLink 相连时用 P2P</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">PIX</text>
<text x="186" y="244" font-size="14" fill="#1F2329">一个 PCIe switch</text>
<text x="679" y="244" font-size="14" fill="#1F2329">同一个 PCI switch 下用</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">PXB</text>
<text x="186" y="282" font-size="14" fill="#1F2329">多个 PCIe switch，不经过 Host Bridge</text>
<text x="679" y="282" font-size="14" fill="#1F2329">经过多个 PCI switch 也用</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">PHB</text>
<text x="186" y="320" font-size="14" fill="#1F2329">PCIe Host Bridge，通常就是 CPU</text>
<text x="679" y="320" font-size="14" fill="#1F2329">同一 NUMA 节点内用，流量经过 CPU</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">NODE</text>
<text x="186" y="358" font-size="14" fill="#1F2329">同一 NUMA 节点内多个 Host Bridge 之间的互连</text>
<text x="679" y="358" font-size="14" fill="#1F2329">（文档未单列）</text>
<rect x="40" y="372" width="1120" height="38" rx="0" fill="#FEF1F1" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="396" font-size="14" fill="#1F2329" font-weight="bold">SYS</text>
<text x="186" y="396" font-size="14" fill="#1F2329">NUMA 节点之间的 SMP 互连，如 QPI/UPI</text>
<text x="679" y="396" font-size="14" fill="#1F2329">跨 NUMA 节点也用</text>
<rect x="40" y="446" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="475" font-size="15" fill="#1F2329">不设 NCCL_P2P_LEVEL 时 NCCL 自选上限；一对卡的符号超出上限，这对卡之间就改走主机内存中转。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：NVIDIA nvidia-smi 文档（topo -m 图例）；NCCL 文档 Environment Variables（NCCL_P2P_LEVEL）</text>
</svg>