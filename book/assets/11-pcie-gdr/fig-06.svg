<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">GPUDirect RDMA：网卡直接读写显存，省掉主机内存里的中转</text>
<text x="40" y="92" font-size="14" fill="#646A73">上：没有 GPUDirect 时的路径；中：GPUDirect RDMA；下：官方按 GPU 与网卡之间的路径分的三种情况</text>
<rect x="40" y="140" width="344" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">显存</text>
<text x="56" y="201" font-size="14" fill="#646A73">GPU 的 DMA 引擎拷出</text>
<polyline points="390,181 422,181" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,175 422,181 412,187" fill="#8F959E"/>
<rect x="428" y="140" width="344" height="82" rx="12" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1"/>
<text x="444" y="171" font-size="18" fill="#1F2329" font-weight="bold">主机内存</text>
<text x="444" y="201" font-size="14" fill="#646A73">中转缓冲</text>
<polyline points="778,181 810,181" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,175 810,181 800,187" fill="#8F959E"/>
<rect x="816" y="140" width="344" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="832" y="171" font-size="18" fill="#1F2329" font-weight="bold">网卡</text>
<text x="832" y="201" font-size="14" fill="#646A73">再 DMA 一次发出</text>
<rect x="40" y="252" width="538" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="283" font-size="18" fill="#1F2329" font-weight="bold">显存</text>
<text x="56" y="313" font-size="14" fill="#646A73">GPU 暴露的地址</text>
<polyline points="584,292 616,292" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,286 616,292 606,298" fill="#8F959E"/>
<rect x="622" y="252" width="538" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="638" y="283" font-size="18" fill="#1F2329" font-weight="bold">网卡</text>
<text x="638" y="313" font-size="14" fill="#646A73">网卡 DMA 引擎直接读写，只过一次 PCIe</text>
<rect x="40" y="373" width="357" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="404" font-size="18" fill="#1F2329" font-weight="bold">只隔着 PCIe switch</text>
<text x="56" y="434" font-size="14" fill="#646A73">topo -m 的 PIX、PXB；最优</text>
<rect x="421" y="373" width="357" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="404" font-size="18" fill="#1F2329" font-weight="bold">经过一个 CPU</text>
<text x="437" y="434" font-size="14" fill="#646A73">PHB；能用，性能更差</text>
<rect x="803" y="373" width="357" height="82" rx="12" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1"/>
<text x="819" y="404" font-size="18" fill="#1F2329" font-weight="bold">跨 QPI/HT</text>
<text x="819" y="434" font-size="14" fill="#646A73">SYS；可能极慢或不可靠</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：NVIDIA, Developing a Linux Kernel Module using GPUDirect RDMA；NVIDIA GPUDirect Storage Design Guide</text>
</svg>