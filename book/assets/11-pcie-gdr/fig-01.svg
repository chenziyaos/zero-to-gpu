<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一台 GPU 服务器里，数据进出显存的四条路</text>
<text x="40" y="92" font-size="14" fill="#646A73">每条路上可能出现的等待，以及本篇处理它的章节</text>
<rect x="40" y="140" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">GPU ↔ 主机内存</text>
<text x="56" y="201" font-size="14" fill="#646A73">PCIe Gen5 x16，每个方向 63.015 GB/s（第 1 章）</text>
<text x="56" y="224" font-size="14" fill="#646A73">跨 NUMA、可分页内存、IOMMU 翻译（第 3、4 章）</text>
<rect x="612" y="140" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="641" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="641" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="660" y="171" font-size="18" fill="#1F2329" font-weight="bold">GPU ↔ 另一张 GPU</text>
<text x="628" y="201" font-size="14" fill="#646A73">NVLink 或 PCIe P2P，按 topo -m 的符号区分（第 2 章）</text>
<text x="628" y="224" font-size="14" fill="#646A73">ACS 会把 switch 内的 P2P 改道到 CPU（第 7 章）</text>
<rect x="40" y="268" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="294" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="299" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="88" y="300" font-size="18" fill="#1F2329" font-weight="bold">GPU ↔ 网卡</text>
<text x="56" y="330" font-size="14" fill="#646A73">GPUDirect RDMA 省掉主机内存中转（第 5 章）</text>
<text x="56" y="353" font-size="14" fill="#646A73">路径上只有 PCIe switch 时最好</text>
<rect x="612" y="268" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="641" cy="294" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="641" y="299" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="660" y="300" font-size="18" fill="#1F2329" font-weight="bold">GPU ↔ NVMe 存储</text>
<text x="628" y="330" font-size="14" fill="#646A73">GPUDirect Storage 省掉 CPU 内存里的中转缓冲（第 6 章）</text>
<text x="628" y="353" font-size="14" fill="#646A73">条件不满足时退回 POSIX 兼容模式</text>
<rect x="40" y="409" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="438" font-size="15" fill="#1F2329">先用 topo -m 和 topo -cpu 记下每条路经过的部件，再按章节逐项检查；第 8 章拿 DGX H100 和 GH200 练习。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：本篇第 1 至 8 章；PCIe 数字见 Wikipedia PCI Express 表，DGX H100 部件见 NVIDIA DGX H100 用户指南</text>
</svg>