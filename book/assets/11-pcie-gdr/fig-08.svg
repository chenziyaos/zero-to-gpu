<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">topo -m 看着正常、P2P 却慢或挂起：按这个顺序查 ACS</text>
<text x="40" y="92" font-size="14" fill="#646A73">ACS 打开时，PCIe switch 把所有点对点流量改道到 CPU 根复合体，topo -m 看不出来</text>
<rect x="40" y="150" width="189" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">对照</text>
<text x="56" y="211" font-size="14" fill="#646A73">NCCL_P2P_DISABLE 关</text>
<text x="56" y="234" font-size="14" fill="#646A73">掉 P2P 再跑，看问题是</text>
<text x="56" y="257" font-size="14" fill="#646A73">否在 P2P</text>
<polyline points="235,214 267,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,208 267,214 257,220" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">检查</text>
<text x="289" y="211" font-size="14" fill="#646A73">sudo lspci -vvv 找</text>
<text x="289" y="234" font-size="14" fill="#646A73">ACSCtl 的 SrcValid+</text>
<polyline points="468,214 500,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,208 500,214 490,220" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">关闭</text>
<text x="522" y="211" font-size="14" fill="#646A73">BIOS 关 VT-d，或 PLX</text>
<text x="522" y="234" font-size="14" fill="#646A73">上用 setpci</text>
<polyline points="700,214 732,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,208 732,214 722,220" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">固化</text>
<text x="754" y="211" font-size="14" fill="#646A73">setpci 每次重启都要重</text>
<text x="754" y="234" font-size="14" fill="#646A73">做，写进开机脚本</text>
<polyline points="933,214 965,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,208 965,214 955,220" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">复测</text>
<text x="987" y="211" font-size="14" fill="#646A73">simpleP2P 看 Test</text>
<text x="987" y="234" font-size="14" fill="#646A73">passed，nvbandwidth</text>
<text x="987" y="257" font-size="14" fill="#646A73">测带宽</text>
<rect x="40" y="318" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="346" font-size="15" fill="#1F2329">虚拟机依赖 ACS，不能关；虚拟机里要拿到最好的性能，NCCL 文档的办法是在网卡上打开 ATS。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：NCCL 文档 Troubleshooting（GPU Direct、PCI Access Control Services、Virtual machines）</text>
</svg>