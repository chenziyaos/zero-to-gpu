<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">用了 cuFile 不等于走了 GDS：条件不满足时会退回 POSIX 兼容模式</text>
<text x="40" y="92" font-size="14" fill="#646A73">GDS 直达路径与兼容路径的区别，以及确认实际走哪条路的三处证据</text>
<rect x="40" y="140" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">GDS 直达</text>
<text x="56" y="201" font-size="14" fill="#646A73">存储侧 DMA 引擎直接写显存，不经 CPU 内存中转</text>
<text x="56" y="224" font-size="14" fill="#646A73">GPU 和存储在同一个 PCIe switch 下时收益最大</text>
<rect x="612" y="140" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">兼容模式</text>
<text x="628" y="201" font-size="14" fill="#646A73">cuFile 退回普通 POSIX 读写，经主机内存中转</text>
<text x="628" y="224" font-size="14" fill="#646A73">程序照常运行，只是没有走直达</text>
<rect x="40" y="274" width="357" height="82" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="306" font-size="18" fill="#1F2329" font-weight="bold">gdscheck.py -p</text>
<text x="56" y="336" font-size="14" fill="#646A73">装没装好，并显示 allow_compat_mode</text>
<rect x="421" y="274" width="357" height="104" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="437" y="306" font-size="18" fill="#1F2329" font-weight="bold">/etc/cufile.json</text>
<text x="437" y="336" font-size="14" fill="#646A73">allow_compat_mode 决定允不允许退回；</text>
<text x="437" y="359" font-size="14" fill="#646A73">CUFILE_FORCE_COMPAT_MODE 可强制退回做对照</text>
<rect x="803" y="274" width="357" height="82" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="819" y="306" font-size="18" fill="#1F2329" font-weight="bold">cufile.log</text>
<text x="819" y="336" font-size="14" fill="#646A73">出现 cufile IO mode: POSIX 即走了兼容路径</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：NVIDIA GPUDirect Storage Overview Guide；NVIDIA GPUDirect Storage Troubleshooting Guide；GDS Design Guide</text>
</svg>