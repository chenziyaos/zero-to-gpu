<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">显存错误三层处理：先隔离，再下线，重置时修</text>
<text x="40" y="92" font-size="14" fill="#646A73">Ampere 及以后的数据中心 GPU</text>
<rect x="40" y="150" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">错误隔离</text>
<text x="56" y="211" font-size="14" fill="#646A73">只终止遇到错误的应用：Xid 94，</text>
<text x="56" y="234" font-size="14" fill="#646A73">RST: No；隔离不住为 Xid 95，</text>
<text x="56" y="257" font-size="14" fill="#646A73">要重置</text>
<polyline points="293,214 325,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,208 325,214 315,220" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">动态页下线</text>
<text x="347" y="211" font-size="14" fill="#646A73">坏页标为不可用，新旧程序都不再</text>
<text x="347" y="234" font-size="14" fill="#646A73">分配；多数情况无需重置</text>
<polyline points="584,214 616,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,208 616,214 606,220" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">行重映射</text>
<text x="638" y="211" font-size="14" fill="#646A73">每个 bank 有备用行；重置时生</text>
<text x="638" y="234" font-size="14" fill="#646A73">效，最多 512 次，下线页被收回</text>
<polyline points="875,214 907,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,208 907,214 897,220" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">失败走 RMA</text>
<text x="929" y="211" font-size="14" fill="#646A73">某 bank 已有 8 行又来一次、同</text>
<text x="929" y="234" font-size="14" fill="#646A73">一行再映射、累计 512 次</text>
<rect x="40" y="318" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="346" font-size="15" fill="#1F2329">pending 期间其他应用照常运行，可并入维护窗口；恢复动作为 Drain and Reset 时停止调度新任务，存量跑完再重置。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：NVIDIA GPU Memory Error Management（Error Containment、Dynamic Page Offlining、Row Remapping、Flags）</text>
</svg>