<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Xid 13 和 31：先当应用的 bug 查，查不出再怀疑硬件</text>
<text x="40" y="92" font-size="14" fill="#646A73">目录给的即时动作都是重启应用；调查按下面的顺序</text>
<rect x="40" y="150" width="247" height="108" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">重启应用</text>
<text x="56" y="211" font-size="14" fill="#646A73">即时动作；GPU 不需要重置</text>
<polyline points="293,204 325,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,198 325,204 315,210" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="108" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">memcheck 或</text>
<text x="379" y="207" font-size="18" fill="#1F2329" font-weight="bold">cuda-gdb</text>
<text x="347" y="237" font-size="14" fill="#646A73">memcheck 报出非法读的代码行</text>
<polyline points="584,204 616,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,198 616,204 606,210" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="108" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">出错时停住</text>
<text x="638" y="211" font-size="14" fill="#646A73">CUDA_DEVICE_WAITS_ON_EXCEPTION</text>
<text x="638" y="234" font-size="14" fill="#646A73">=1，再连 cuda-gdb</text>
<polyline points="875,204 907,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,198 907,204 897,210" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="108" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">仍无结论</text>
<text x="929" y="211" font-size="14" fill="#646A73">报 bug，排除驱动或硬件</text>
<rect x="40" y="298" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="326" font-size="15" fill="#1F2329">建议：同一作业换卡复现，看问题跟着作业走还是跟着卡走；伴随 48、94、95 时先处理显存错误。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：NVIDIA Xid Catalog（Xid 13、31）；Working with Xid Errors</text>
</svg>