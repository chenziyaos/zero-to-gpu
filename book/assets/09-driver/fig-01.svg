<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">起不来查版本栈，掉卡读 Xid，恢复之后先过诊断</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇处理 W_idle 里最贵的一类等待：作业不能开跑或中途中断</text>
<rect x="40" y="150" width="247" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">起不来</text>
<text x="56" y="211" font-size="14" fill="#646A73">判断兼容类型：向后、次版本、前</text>
<text x="56" y="234" font-size="14" fill="#646A73">向；容器看宿主机与镜像两半（第</text>
<text x="56" y="257" font-size="14" fill="#646A73">2 到 4 章）</text>
<polyline points="293,214 325,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,208 325,214 315,220" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">掉卡</text>
<text x="347" y="211" font-size="14" fill="#646A73">按 Xid 目录的即时动作处置；13、</text>
<text x="347" y="234" font-size="14" fill="#646A73">31 先查应用（第 5、6 章）</text>
<polyline points="584,214 616,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,208 616,214 606,220" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">显存出错</text>
<text x="638" y="211" font-size="14" fill="#646A73">隔离、页下线、行重映射；按恢复</text>
<text x="638" y="234" font-size="14" fill="#646A73">动作标志分级（第 7 章）</text>
<polyline points="875,214 907,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,208 907,214 897,220" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">放回调度前</text>
<text x="929" y="211" font-size="14" fill="#646A73">DCGM 诊断：作业前 r1，失败后</text>
<text x="929" y="234" font-size="14" fill="#646A73">r2，硬件问题后 r3（第 8 章）</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：NVIDIA CUDA Compatibility、Xid Errors、GPU Memory Error Management、DCGM Diagnostics 文档</text>
</svg>