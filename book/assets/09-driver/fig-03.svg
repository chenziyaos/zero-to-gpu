<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">三种兼容：驱动越旧，条件越多</text>
<text x="40" y="92" font-size="14" fill="#646A73">按用户态 CUDA 驱动相对运行时的新旧划分</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">驱动相对运行时</text>
<text x="350" y="166" font-size="14" fill="#1F2329" font-weight="bold">兼容类型</text>
<text x="577" y="166" font-size="14" fill="#1F2329" font-weight="bold">条件</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">更新</text>
<text x="350" y="206" font-size="14" fill="#1F2329">向后兼容</text>
<text x="577" y="206" font-size="14" fill="#1F2329">无</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">更旧，主版本相同</text>
<text x="350" y="244" font-size="14" fill="#1F2329">次版本兼容</text>
<text x="577" y="244" font-size="14" fill="#1F2329">13.x 要 580 及以上，12.x 要 525.60.13 及以上；不能用 PTX，nvcc 要指定 -arch</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">主版本更旧</text>
<text x="350" y="282" font-size="14" fill="#1F2329">前向兼容</text>
<text x="577" y="282" font-size="14" fill="#1F2329">数据中心 GPU 等平台；装 cuda-compat 包并设置库路径</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">驱动分支：13.0 对应 R580，13.4 对应 R615，13.5 对应 R620。13.5 的新功能要 R620 或更新的驱动。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：NVIDIA CUDA Compatibility（Why、Minor Version、Forward Compatibility）；CUDA Toolkit Release Notes</text>
</svg>