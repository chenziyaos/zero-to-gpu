<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Xid 目录的即时动作：多数只需重启应用</text>
<text x="40" y="92" font-size="14" fill="#646A73">常见 Xid 摘录；反复出现时再按调查动作深入</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">即时动作</text>
<text x="332" y="166" font-size="14" fill="#1F2329" font-weight="bold">Xid</text>
<text x="612" y="166" font-size="14" fill="#1F2329" font-weight="bold">含义</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">RESTART_APP</text>
<text x="332" y="206" font-size="14" fill="#1F2329">13、31、94</text>
<text x="612" y="206" font-size="14" fill="#1F2329">应用越界或非法访问；已隔离的显存错误</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">IGNORE</text>
<text x="332" y="244" font-size="14" fill="#1F2329">43、63、92</text>
<text x="612" y="244" font-size="14" fill="#1F2329">应用自身故障而 GPU 健康；重映射记录成功；单比特错误率高</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">RESET_GPU</text>
<text x="332" y="282" font-size="14" fill="#1F2329">64、95、119</text>
<text x="612" y="282" font-size="14" fill="#1F2329">重映射记录失败；未隔离的显存错误；GSP 超时</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">RESTART_BM</text>
<text x="332" y="320" font-size="14" fill="#1F2329">79</text>
<text x="612" y="320" font-size="14" fill="#1F2329">GPU 从总线上掉了，多因 PCIe 链路硬件故障</text>
<rect x="40" y="370" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="399" font-size="15" fill="#1F2329">Xid 154 和其他 Xid 一起出现，直接给出所需恢复动作：None、Drain P2P、Drain and Reset、GPU Reset Required、Node Reboot Required。</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：NVIDIA Xid Errors, Analyzing Xid Errors with the Xid Catalog</text>
</svg>