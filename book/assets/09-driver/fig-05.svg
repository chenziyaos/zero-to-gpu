<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">容器里的版本栈：驱动来自宿主机，运行时来自镜像</text>
<text x="40" y="92" font-size="14" fill="#646A73">NVIDIA Container Toolkit 把两半拼起来，镜像的版本要求不满足时容器不启动</text>
<rect x="40" y="140" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">宿主机提供</text>
<text x="56" y="201" font-size="14" fill="#646A73">内核态驱动</text>
<text x="56" y="224" font-size="14" fill="#646A73">libcuda.so 等驱动库，按需挂载</text>
<text x="56" y="247" font-size="14" fill="#646A73">NVIDIA_DRIVER_CAPABILITIES 默认 utility、compute</text>
<rect x="612" y="140" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">镜像提供</text>
<text x="628" y="201" font-size="14" fill="#646A73">CUDA 运行时、cuBLAS、cuDNN、框架</text>
<text x="628" y="224" font-size="14" fill="#646A73">NVIDIA_REQUIRE_CUDA 声明需要的版本</text>
<text x="628" y="247" font-size="14" fill="#646A73">官方镜像自带兼容库</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">NVIDIA_DISABLE_REQUIRE 只适合 CUDA 11.7 之前的旧镜像；关掉约束不改变驱动够不够。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NVIDIA Container Toolkit, Specialized Configurations with Docker；CUDA Compatibility FAQ</text>
</svg>