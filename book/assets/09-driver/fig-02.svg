<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一个 CUDA 程序依赖四层，nvidia-smi 的 CUDA 版本只是驱动的上限</text>
<text x="40" y="92" font-size="14" fill="#646A73">从下往上：前两层来自驱动包，后两层随应用或镜像分发</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">层</text>
<text x="332" y="166" font-size="14" fill="#1F2329" font-weight="bold">是什么</text>
<text x="752" y="166" font-size="14" fill="#1F2329" font-weight="bold">在哪看版本</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">内核态驱动</text>
<text x="332" y="206" font-size="14" fill="#1F2329">驱动包里的内核模块</text>
<text x="752" y="206" font-size="14" fill="#1F2329">nvidia-smi 的 KMD Version</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">用户态 CUDA 驱动</text>
<text x="332" y="244" font-size="14" fill="#1F2329">libcuda.so，与内核态同包</text>
<text x="752" y="244" font-size="14" fill="#1F2329">CUDA UMD Version：驱动支持的最高 CUDA</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">运行时和库</text>
<text x="332" y="282" font-size="14" fill="#1F2329">libcudart、cuBLAS、cuDNN</text>
<text x="752" y="282" font-size="14" fill="#1F2329">deviceQuery 的 Runtime Version</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">框架和应用</text>
<text x="332" y="320" font-size="14" fill="#1F2329">PyTorch 等，带编译时的 CUDA 版本</text>
<text x="752" y="320" font-size="14" fill="#1F2329">框架自带的版本查询</text>
<rect x="40" y="370" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="399" font-size="15" fill="#1F2329">CUDA 13.4 起 Linux 驱动不再随工具包分发；无头服务器上 GPU 去初始化后，每张卡重新初始化要 1 到 3 秒。</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：NVIDIA CUDA Compatibility（Why CUDA Compatibility）；nvidia-smi 文档</text>
</svg>