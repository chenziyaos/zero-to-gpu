<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">线程内的三根杠杆：两根加在途字节，一根减搬运字节</text>
<text x="40" y="92" font-size="14" fill="#646A73">对应 Little 定律两侧：在途字节 = 带宽 × 延迟；总时间 ≈ 要搬的字节 ÷ 带宽</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">加宽单次加载</text>
<text x="56" y="201" font-size="14" fill="#646A73">float 换 float4，每 SM 要的在途加载从约</text>
<text x="56" y="224" font-size="14" fill="#646A73">1740 条降到约 435 条</text>
<text x="56" y="247" font-size="14" fill="#646A73">代价：地址按 16 字节对齐，尾部单独处理</text>
<rect x="421" y="140" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="450" cy="165" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="450" y="170" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="469" y="171" font-size="18" fill="#1F2329" font-weight="bold">加 ILP</text>
<text x="437" y="201" font-size="14" fill="#646A73">每个线程先连发几条互不依赖的加载，再统一使用</text>
<text x="437" y="224" font-size="14" fill="#646A73">代价：每条在途加载都要寄存器接结果</text>
<rect x="803" y="140" width="357" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="832" cy="165" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="832" y="170" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="851" y="171" font-size="18" fill="#1F2329" font-weight="bold">靠复用少搬</text>
<text x="819" y="201" font-size="14" fill="#646A73">分块放进共享内存，T × T 的块让全局读取约减为</text>
<text x="819" y="224" font-size="14" fill="#646A73">1/T</text>
<text x="819" y="247" font-size="14" fill="#646A73">代价：共享内存和同步；逐元素 kernel 没有复用</text>
<text x="819" y="270" font-size="14" fill="#646A73">可挖</text>
<rect x="40" y="326" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="355" font-size="15" fill="#1F2329">先算每 SM 要多少条在途加载，再挑最便宜的杠杆；DRAM 吞吐已接近峰值时，只有第 3 根还有用。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：本篇 sim_inflight.py 输出；本篇第 6 章推导</text>
</svg>