<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">搬运一代代移出线程：寄存器中转、绕开寄存器、硬件生成地址</text>
<text x="40" y="92" font-size="14" fill="#646A73">全局内存到共享内存的三种搬法，线程要做的事越来越少</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">普通加载 + 存共享内存</text>
<text x="56" y="201" font-size="14" fill="#646A73">每个线程先把数据读进寄存器，再写进共享内存</text>
<text x="56" y="224" font-size="14" fill="#646A73">每个元素都要线程算地址、发两条指令</text>
<text x="56" y="247" font-size="14" fill="#646A73">数据到之前，寄存器一直被占着</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">Ampere：cp.async</text>
<text x="437" y="201" font-size="14" fill="#646A73">全局内存直接进共享内存，不经寄存器</text>
<text x="437" y="224" font-size="14" fill="#646A73">拷贝在后台进行，SM 同时可以算别的</text>
<text x="437" y="247" font-size="14" fill="#646A73">地址仍由每个线程自己算</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">Hopper：TMA</text>
<text x="819" y="201" font-size="14" fill="#646A73">一个线程建好拷贝描述符再启动</text>
<text x="819" y="224" font-size="14" fill="#646A73">地址生成和搬运都由硬件完成</text>
<text x="819" y="247" font-size="14" fill="#646A73">少量线程即可管满 H100 的显存带宽</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">三种做法都要配异步栅栏或 __syncthreads() 确认数据到齐；省下来的是线程的指令、寄存器和地址计算。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NVIDIA Ampere / Hopper Architecture In-Depth 技术博客</text>
</svg>