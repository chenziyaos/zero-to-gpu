<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">四个上限取最小：本例共享内存只放得下 4 块</text>
<text x="40" y="92" font-size="14" fill="#646A73">H100（CC 9.0），每块 128 线程、每线程 64 个寄存器、每块 48 KB 共享内存</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">块数上限</text>
<rect x="240" y="150" width="582" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="582" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="830" y="168" font-size="13" fill="#646A73">32 块  每 SM 最多 32 块</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">warp 上限</text>
<rect x="240" y="192" width="582" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="291" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="539" y="210" font-size="13" fill="#646A73">16 块  64 ÷ 4</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">寄存器</text>
<rect x="240" y="234" width="582" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="145" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="393" y="252" font-size="13" fill="#646A73">8 块  65536 ÷ 8192</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">共享内存</text>
<rect x="240" y="276" width="582" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="73" height="26" rx="4" fill="#F54A45" stroke="#F54A45" stroke-width="1"/>
<text x="321" y="294" font-size="13" fill="#646A73">4 块  228 ÷ 49 ≈ 4.65，取 4（含每块保留 1 KB）</text>
<rect x="40" y="338" width="1120" height="73" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">驻留 4 块 = 16 个 warp，理论 occupancy 16 ÷ 64 = 25%。共享内存降到 32 KB（连同保留共 33 KB），可驻留 6 块、24 个 warp，occupancy</text>
<text x="56" y="391" font-size="15" fill="#1F2329">37.5%。</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：NVIDIA CUDA Programming Guide, Compute Capabilities；Hopper Tuning Guide；本篇第 2 章推算</text>
</svg>