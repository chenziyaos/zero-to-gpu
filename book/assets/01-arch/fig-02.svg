<g id="o9:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="516" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a9:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">寄存器 1 周期 vs HBM 480 周期：优化是选数据放哪</tspan></tspan></text></g>
<g id="a9:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">每层在容量和带宽上相差数倍；优化就是选择数据放哪一层</tspan></tspan></text></g>
<g id="o9:2" transform="translate(40, 128)"><rect x="0" y="0" width="1120" height="46" fill="#f0f4ff" stroke="#82a7fc" stroke-width="1" rx="8" ry="8"/></g>
<g id="o9:3" transform="translate(40, 128)"><rect x="0" y="0" width="4" height="46" fill="#3370ff" stroke="none" stroke-width="0" rx="2" ry="2"/></g>
<g id="a9:3" transform="translate(60, 139.429)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">本篇要把数据尽量放近：</tspan></tspan></text></g>
<g id="a9:4" transform="translate(248.8, 139.429)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">驻留并行度需求 = 带宽 × 延迟；越远（HBM/L2），需要越多线程在路；越近（寄存器/L1），几线程就能吃满</tspan></tspan></text></g>
