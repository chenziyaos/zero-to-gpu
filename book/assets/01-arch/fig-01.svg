<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect x="0" y="0" width="1200" height="460" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">等待约 480 个周期，要靠在途请求填满</text>
<text x="40" y="92" font-size="14" fill="#646A73">H100 SXM；五步闭环在本篇各章的落点</text>
<rect x="40" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">定天花板</text>
<text x="56" y="211" font-size="14" fill="#646A73">第 2、5 章：资源上限、</text>
<text x="56" y="234" font-size="14" fill="#646A73">Little 定律</text>
<polyline points="235,202 267,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,196 267,202 257,208" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">测实际</text>
<text x="289" y="211" font-size="14" fill="#646A73">ncu：DRAM 吞吐、停顿</text>
<text x="289" y="234" font-size="14" fill="#646A73">原因</text>
<polyline points="468,202 500,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,196 500,202 490,208" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">定位等待</text>
<text x="522" y="211" font-size="14" fill="#646A73">第 3、4 章：全局、共</text>
<text x="522" y="234" font-size="14" fill="#646A73">享内存还是栅栏</text>
<polyline points="700,202 732,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,196 732,202 722,208" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">消除或隐藏</text>
<text x="754" y="211" font-size="14" fill="#646A73">第 6、7 章：加宽加载、</text>
<text x="754" y="234" font-size="14" fill="#646A73">ILP、异步拷贝</text>
<polyline points="933,202 965,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,196 965,202 955,208" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">复测</text>
<text x="987" y="211" font-size="14" fill="#646A73">第 8、9 章：波次、换</text>
<text x="987" y="234" font-size="14" fill="#646A73">卡重算</text>
<rect x="40" y="294" width="548" height="104" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="326" font-size="18" fill="#1F2329" font-weight="bold">等待有多长</text>
<text x="56" y="356" font-size="14" fill="#646A73">全局内存约 478.8 个周期（H800 实测）；吃满 3.35 TB/s 要整卡约 897 KB、</text>
<text x="56" y="379" font-size="14" fill="#646A73">每 SM 约 6.8 KB 同时在路上</text>
<rect x="612" y="294" width="548" height="104" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="628" y="326" font-size="18" fill="#1F2329" font-weight="bold">靠什么藏</text>
<text x="628" y="356" font-size="14" fill="#646A73">驻留更多 warp（TLP），或让每个线程同时发出多条独立加载（ILP）；读</text>
<text x="628" y="379" font-size="14" fill="#646A73">float4 时只需 21.2% 的线程挂着加载</text>
<text x="40" y="436" font-size="12" fill="#646A73">来源：Luo et al. Benchmarking and Dissecting the Nvidia Hopper GPU Architecture（H800 实测）；NVIDIA H100 规格页；本篇 sim_inflight.py 输出</text>
</svg>