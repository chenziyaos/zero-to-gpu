<g id="a9:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">stride=1 压同一 bank 延迟 32 倍；stride=32 各访问不同</tspan></tspan></text></g>
<g id="a9:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">32 线程同时读共享内存；左边的坏模式压同一 bank，右边的好模式横跨 32 bank</tspan></tspan></text></g>
<g id="o9:2" transform="translate(40, 128)"><rect x="0" y="0" width="1120" height="46" fill="#f0f4ff" stroke="#82a7fc" stroke-width="1" rx="8" ry="8"/></g>
