<g id="a9:4" transform="translate(148, 139.429)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">解决：padding 共享内存（每行末尾加 1 word），或调整访问步长，让 warp 内 32 线程落到不同 bank</tspan></tspan></text></g>
<g id="o9:4" transform="translate(40, 198)"><rect x="0" y="0" width="548" height="225" fill="#ffffff" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
