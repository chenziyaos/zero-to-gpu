<g id="a2:33" transform="translate(56, 664.823)"><text font-size="18" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">本章要点</tspan></tspan></text></g>
<g id="a2:34" transform="translate(56, 698.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">Decode 主瓶颈是 KV cache 的 HBM 延迟和并行度；按 V 分块把块数翻 16 倍，PagedAttention 减少碎片；合计吞吐 8k → 50k tok/s，加速 6-8 倍</tspan></tspan></text></g>
