<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Blackwell 的不对称：Tensor Core 翻倍，指数单元原地不动</text>
<text x="40" y="92" font-size="14" fill="#646A73">每 SM 每时钟周期的运算次数</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">单元</text>
<text x="368" y="166" font-size="14" fill="#1F2329" font-weight="bold">Hopper</text>
<text x="612" y="166" font-size="14" fill="#1F2329" font-weight="bold">B200</text>
<text x="856" y="166" font-size="14" fill="#1F2329" font-weight="bold">B300 / GB300</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">Tensor Core</text>
<text x="368" y="206" font-size="14" fill="#1F2329">4096</text>
<text x="612" y="206" font-size="14" fill="#1F2329">8192</text>
<text x="856" y="206" font-size="14" fill="#1F2329">论文未单列</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">MUFU（指数）</text>
<text x="368" y="244" font-size="14" fill="#1F2329">16</text>
<text x="612" y="244" font-size="14" fill="#1F2329">16</text>
<text x="856" y="244" font-size="14" fill="#1F2329">32</text>
<rect x="40" y="294" width="1120" height="73" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">B200 上两者之比 8192 ÷ 16 = 512。FlashAttention-4 用 FMA 多项式模拟一部分 exp、跳过不必要的重缩放，BF16 到 1613 TFLOPs/s，约为 2.25</text>
<text x="56" y="347" font-size="15" fill="#1F2329">PFLOPS 的 71%。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：Zadouri et al. FlashAttention-4（摘要与第 2 节）</text>
</svg>