<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">FlashAttention-2：warp 改按 Q 分工，省掉中间结果的汇总</text>
<text x="40" y="92" font-size="14" fill="#646A73">一个线程块里的 4 个 warp 怎么分活</text>
<rect x="40" y="140" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">FlashAttention：按 K、V 分（split-K）</text>
<text x="56" y="201" font-size="14" fill="#646A73">K、V 分给 4 个 warp，Q 大家共用</text>
<text x="56" y="224" font-size="14" fill="#646A73">每个 warp 只算出部分结果</text>
<text x="56" y="247" font-size="14" fill="#646A73">写进共享内存、同步、再相加</text>
<rect x="612" y="140" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">FlashAttention-2：按 Q 分</text>
<text x="628" y="201" font-size="14" fill="#646A73">Q 分给 4 个 warp，K、V 大家共用</text>
<text x="628" y="224" font-size="14" fill="#646A73">每个 warp 算完自己的行就结束</text>
<text x="628" y="247" font-size="14" fill="#646A73">没有中间结果的汇总</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">加上减少非矩阵乘运算、外层按序列维并行，A100 上从峰值的 25% 到 40% 提到 50% 到 73%。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：Dao. FlashAttention-2（第 3 节与摘要）</text>
</svg>