<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">FlashAttention 四代：每一代消掉一种等待，瓶颈随之换地方</text>
<text x="40" y="92" font-size="14" fill="#646A73">从上往下：每一代解决的问题，就是上一代留下的瓶颈</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">FlashAttention-1</text>
<text x="56" y="211" font-size="14" fill="#646A73">分块加在线 softmax，S、P 不</text>
<text x="56" y="234" font-size="14" fill="#646A73">再写回 HBM</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">FlashAttention-2</text>
<text x="347" y="211" font-size="14" fill="#646A73">减少非矩阵乘运算，按 Q 分工；</text>
<text x="347" y="234" font-size="14" fill="#646A73">A100 上 50% 到 73%</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">FlashAttention-3</text>
<text x="638" y="211" font-size="14" fill="#646A73">Hopper：warp 特化与</text>
<text x="638" y="234" font-size="14" fill="#646A73">pingpong，H100 FP16 到 75%</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">FlashAttention-4</text>
<text x="929" y="211" font-size="14" fill="#646A73">Blackwell：补指数单元的不足，</text>
<text x="929" y="234" font-size="14" fill="#646A73">B200 BF16 到 71%</text>
<rect x="40" y="294" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">反向只存每行的归一化因子再重算；decode 时沿 KV 切块。选型先确认实际跑的是哪个 kernel。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：Dao et al. FlashAttention；Dao. FlashAttention-2；Shah et al. FlashAttention-3；Zadouri et al. FlashAttention-4</text>
</svg>