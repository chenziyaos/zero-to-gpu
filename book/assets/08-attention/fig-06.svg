<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Triton 融合注意力：内层循环逐块做在线 softmax</text>
<text x="40" y="92" font-size="14" fill="#646A73">每个程序实例负责一个 Q 块；q 读进来后全程留在 SRAM</text>
<rect x="40" y="150" width="189" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">进入循环前</text>
<text x="56" y="211" font-size="14" fill="#646A73">qk_scale 乘 1/ln 2，</text>
<text x="56" y="234" font-size="14" fill="#646A73">之后都用 exp2</text>
<polyline points="235,215 267,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,209 267,215 257,221" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">_attn_fwd_inner</text>
<text x="321" y="207" font-size="18" fill="#1F2329" font-weight="bold">读 K 块</text>
<text x="289" y="237" font-size="14" fill="#646A73">qk = q · kᵀ，求新的</text>
<text x="289" y="260" font-size="14" fill="#646A73">行最大值 m_ij</text>
<polyline points="468,215 500,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,209 500,215 490,221" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="130" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">修正因子</text>
<text x="522" y="211" font-size="14" fill="#646A73">alpha = exp2(m_i −</text>
<text x="522" y="234" font-size="14" fill="#646A73">m_ij)</text>
<polyline points="700,215 732,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,209 732,215 722,221" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">读 V 块并累加</text>
<text x="754" y="211" font-size="14" fill="#646A73">l_i、acc 乘 alpha，</text>
<text x="754" y="234" font-size="14" fill="#646A73">再加上新块的贡献</text>
<polyline points="933,215 965,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,209 965,215 955,221" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="130" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">causal</text>
<text x="987" y="211" font-size="14" fill="#646A73">非对角块与对角块分两段，</text>
<text x="987" y="234" font-size="14" fill="#646A73">只有对角块做掩码</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：Triton 官方教程 Fused Attention（06-fused-attention）</text>
</svg>