<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">FlashAttention-3 的 pingpong：两个 warpgroup 轮流做矩阵乘和 softmax</text>
<text x="40" y="92" font-size="14" fill="#646A73">示意图：Tensor Core 总有一个 warpgroup 在用，softmax 藏在另一个的矩阵乘后面</text>
<text x="198" y="172" font-size="14" fill="#1F2329" text-anchor="end">warpgroup 1</text>
<rect x="210" y="150" width="950" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="210" y="153" width="190" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="305" y="172" font-size="12" fill="#245BDB" text-anchor="middle">GEMM</text>
<rect x="400" y="153" width="190" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="495" y="172" font-size="12" fill="#D46B08" text-anchor="middle">softmax</text>
<rect x="590" y="153" width="190" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="685" y="172" font-size="12" fill="#245BDB" text-anchor="middle">GEMM</text>
<rect x="780" y="153" width="190" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="875" y="172" font-size="12" fill="#D46B08" text-anchor="middle">softmax</text>
<text x="198" y="220" font-size="14" fill="#1F2329" text-anchor="end">warpgroup 2</text>
<rect x="210" y="198" width="950" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="400" y="201" width="190" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="495" y="220" font-size="12" fill="#245BDB" text-anchor="middle">GEMM</text>
<rect x="590" y="201" width="190" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="685" y="220" font-size="12" fill="#D46B08" text-anchor="middle">softmax</text>
<rect x="780" y="201" width="190" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="875" y="220" font-size="12" fill="#245BDB" text-anchor="middle">GEMM</text>
<rect x="970" y="201" width="190" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="1065" y="220" font-size="12" fill="#D46B08" text-anchor="middle">softmax</text>
<rect x="40" y="272" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="301" font-size="15" fill="#1F2329">FlashAttention-2 在 H100 上只有 35%；FlashAttention-3 加上 TMA 的 warp 特化，FP16 到 740 TFLOPs/s，约为稠密峰值 989.5 的 75%。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：Shah et al. FlashAttention-3（摘要与第 3 节）</text>
</svg>