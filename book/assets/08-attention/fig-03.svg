<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">在线 softmax：最大值变了，就把已累加的和与输出一起换基准</text>
<text x="40" y="92" font-size="14" fill="#646A73">每个 Q 块维护三样东西：行最大值 m、指数和 l、未归一化的输出累加器</text>
<rect x="40" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">读入 K、V 块</text>
<text x="56" y="211" font-size="14" fill="#646A73">算出这一块的分数和块内</text>
<text x="56" y="234" font-size="14" fill="#646A73">最大值</text>
<polyline points="235,202 267,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,196 267,202 257,208" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">更新最大值</text>
<text x="289" y="211" font-size="14" fill="#646A73">m′ = max(m, 块内最大</text>
<text x="289" y="234" font-size="14" fill="#646A73">值)</text>
<polyline points="468,202 500,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,196 500,202 490,208" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">换基准</text>
<text x="522" y="211" font-size="14" fill="#646A73">l 和输出累加器都乘</text>
<text x="522" y="234" font-size="14" fill="#646A73">exp(m − m′)</text>
<polyline points="700,202 732,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,196 732,202 722,208" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">加上新块</text>
<text x="754" y="211" font-size="14" fill="#646A73">l 加新块的指数和，输出</text>
<text x="754" y="234" font-size="14" fill="#646A73">加新块的 P·V</text>
<polyline points="933,202 965,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,196 965,202 955,208" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">全部读完</text>
<text x="987" y="211" font-size="14" fill="#646A73">输出除以 l；只多存每行</text>
<text x="987" y="234" font-size="14" fill="#646A73">的 m 和 l</text>
<rect x="40" y="294" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="323" font-size="15" fill="#1F2329">代价是每块多出 exp、缩放和比较这些非矩阵乘运算，后几代 FlashAttention 一直在削减它们。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：Milakov, Gimelshein. Online normalizer calculation for softmax；Dao et al. FlashAttention</text>
</svg>