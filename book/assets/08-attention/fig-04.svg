<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">FlashAttention-1：S、P 留在片上，HBM 访问量和 SRAM 大小挂钩</text>
<text x="40" y="92" font-size="14" fill="#646A73">N 是序列长度，d 是头维度，M 是 SRAM 大小</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold"></text>
<text x="296" y="166" font-size="14" fill="#1F2329" font-weight="bold">标准注意力</text>
<text x="727" y="166" font-size="14" fill="#1F2329" font-weight="bold">FlashAttention-1</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">S、P</text>
<text x="296" y="206" font-size="14" fill="#1F2329">写回 HBM，再读出来</text>
<text x="727" y="206" font-size="14" fill="#1F2329">只在 SRAM 里分块处理</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">kernel</text>
<text x="296" y="244" font-size="14" fill="#1F2329">三段各一个</text>
<text x="727" y="244" font-size="14" fill="#1F2329">融合成一个</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">HBM 访问量</text>
<text x="296" y="282" font-size="14" fill="#1F2329">Θ(Nd + N²)</text>
<text x="727" y="282" font-size="14" fill="#1F2329">Θ(N²d²/M)，M 越大越少</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">论文收益</text>
<text x="296" y="320" font-size="14" fill="#1F2329"></text>
<text x="727" y="320" font-size="14" fill="#1F2329">GPT-2 注意力提速 7.6 倍</text>
<rect x="40" y="370" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="399" font-size="15" fill="#1F2329">H100 每个线程块最多用 227 KB 共享内存，块要同时放下 Q、K、V 块和输出累加器。</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：Dao et al. FlashAttention（定理 2、摘要）；NVIDIA Hopper Tuning Guide</text>
</svg>