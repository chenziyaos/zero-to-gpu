<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">标准注意力：搬 S 和 P 的时间是计算下限的 4.6 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">例子：N = 8192、d = 128、32 个头、BF16、batch 1，H100 SXM；单位 ms</text>
<text x="188" y="168" font-size="14" fill="#1F2329" text-anchor="end">计算下限</text>
<rect x="200" y="150" width="679" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="150" width="147" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="355" y="168" font-size="13" fill="#646A73">1.11 ms  约 1.1 TFLOP ÷ 989.5 TFLOPS</text>
<text x="188" y="210" font-size="14" fill="#1F2329" text-anchor="end">S、P 读写</text>
<rect x="200" y="192" width="679" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="200" y="192" width="679" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="887" y="210" font-size="13" fill="#646A73">5.13 ms  约 17.2 GB ÷ 3.35 TB/s</text>
<rect x="40" y="258" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="287" font-size="15" fill="#1F2329">S、P 各约 4.29 GB，写一次读一次；粗算未计 Q、K、V、O 的读写，并假设带宽跑满。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：NVIDIA H100 规格页（1,979 TFLOPS 含稀疏，3.35 TB/s）；本篇第 1 章推算</text>
</svg>