<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">结构化输出的开销已经能藏住：预检、重叠、跳跃解码</text>
<text x="40" y="92" font-size="14" fill="#646A73">两边都可用 XGrammar：SGLang 默认，vLLM 可选 xgrammar 或 guidance</text>
<rect x="40" y="150" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">预检</text>
<text x="56" y="211" font-size="14" fill="#646A73">上下文无关 token 编译期检查</text>
<text x="56" y="234" font-size="14" fill="#646A73">每 token 延迟最多降 100 倍</text>
<rect x="421" y="150" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="437" y="181" font-size="18" fill="#1F2329" font-weight="bold">重叠</text>
<text x="437" y="211" font-size="14" fill="#646A73">语法计算和 GPU 执行并行</text>
<text x="437" y="234" font-size="14" fill="#646A73">JSON 解码最多快 10 倍</text>
<rect x="803" y="150" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="819" y="181" font-size="18" fill="#1F2329" font-weight="bold">跳跃</text>
<text x="819" y="211" font-size="14" fill="#646A73">唯一路径一次解多个 token</text>
<text x="819" y="234" font-size="14" fill="#646A73">延迟降 2 倍、吞吐 2.5 倍</text>
<rect x="40" y="284" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="313" font-size="15" fill="#1F2329">倍数都是各自论文或博客对当时基线的结果；用自己的 schema 比较带约束和不带约束的每 token 延迟。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：SGLang 论文与压缩 FSM 博客；XGrammar 论文；SGLang、vLLM 结构化输出文档</text>
</svg>