<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">按负载形状挑默认值，再用自己的流量回放验证</text>
<text x="40" y="92" font-size="14" fill="#646A73">主编基于前八章的判断；结论要随版本复验</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">负载形状</text>
<text x="332" y="176" font-size="14" fill="#1F2329" font-weight="bold">关键因素</text>
<text x="752" y="176" font-size="14" fill="#1F2329" font-weight="bold">看哪里</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">共享前缀多</text>
<text x="332" y="216" font-size="14" fill="#1F2329">前缀缓存、调度顺序、路由</text>
<text x="752" y="216" font-size="14" fill="#1F2329">SGLang 的 lpm、缓存路由、HiCache</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">前缀重叠少</text>
<text x="332" y="254" font-size="14" fill="#1F2329">调度、CPU 开销、kernel</text>
<text x="752" y="254" font-size="14" fill="#1F2329">两边差别小，看 token 预算</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">结构化输出多</text>
<text x="332" y="292" font-size="14" fill="#1F2329">语法后端开销</text>
<text x="752" y="292" font-size="14" fill="#1F2329">两边都用 xgrammar</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">超大 MoE 分离部署</text>
<text x="332" y="330" font-size="14" fill="#1F2329">PD 分离、EP、KV 传输</text>
<text x="752" y="330" font-size="14" fill="#1F2329">SGLang 有公开复现，vLLM 走 connector</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">压测：真实日志回放，同卡同精度，固定 SLO 比 goodput，记录命中率、token usage、ITL 的 P99。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：本篇第 2 到 8 章引用的文档与论文</text>
</svg>