<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">前缀超过一千个 token 时，按块 16 和按 token 复用的差不到一个块</text>
<text x="40" y="92" font-size="14" fill="#646A73">只缓存满块时能复用的前缀比例；按 token 匹配为 100%</text>
<text x="178" y="168" font-size="14" fill="#1F2329" text-anchor="end">前缀 30</text>
<rect x="190" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="190" y="150" width="373" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="571" y="168" font-size="13" fill="#646A73">  16 / 30 = 53.3%</text>
<text x="178" y="210" font-size="14" fill="#1F2329" text-anchor="end">前缀 100</text>
<rect x="190" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="190" y="192" width="672" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="870" y="210" font-size="13" fill="#646A73">  96 / 100 = 96.0%</text>
<text x="178" y="252" font-size="14" fill="#1F2329" text-anchor="end">前缀 1000</text>
<rect x="190" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="190" y="234" width="694" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="892" y="252" font-size="13" fill="#646A73">  992 / 1000 = 99.2%</text>
<text x="178" y="294" font-size="14" fill="#1F2329" text-anchor="end">前缀 4096</text>
<rect x="190" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="190" y="276" width="700" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="898" y="294" font-size="13" fill="#646A73">  4096 / 4096 = 100.0%</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">差别在调度：radix tree 支持最长共享前缀优先（lpm），排队超过 128 个时只看前 64 个。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：主编核算（vLLM 论文默认块大小 16；vLLM 前缀缓存设计文档；SGLang 页大小默认 1）</text>
</svg>