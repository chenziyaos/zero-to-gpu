<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">两边的投机方法大体重合，收益要按并发分档量接受率</text>
<text x="40" y="92" font-size="14" fill="#646A73">方法列表来自两边文档；批越大收益越小见 GPU-25 第 8 章</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">方法</text>
<text x="449" y="176" font-size="14" fill="#1F2329" font-weight="bold">vLLM</text>
<text x="811" y="176" font-size="14" fill="#1F2329" font-weight="bold">SGLang</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">EAGLE</text>
<text x="449" y="216" font-size="14" fill="#1F2329">支持</text>
<text x="811" y="216" font-size="14" fill="#1F2329">EAGLE-2、EAGLE-3</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F0FBEF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">MTP</text>
<text x="449" y="254" font-size="14" fill="#1F2329">支持</text>
<text x="811" y="254" font-size="14" fill="#1F2329">支持</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">草稿模型</text>
<text x="449" y="292" font-size="14" fill="#1F2329">支持</text>
<text x="811" y="292" font-size="14" fill="#1F2329">支持</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">n-gram</text>
<text x="449" y="330" font-size="14" fill="#1F2329">支持</text>
<text x="811" y="330" font-size="14" fill="#1F2329">支持</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">后缀解码</text>
<text x="449" y="368" font-size="14" fill="#1F2329">支持</text>
<text x="811" y="368" font-size="14" fill="#1F2329">未列出</text>
<rect x="40" y="412" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="441" font-size="15" fill="#1F2329">投机改变每步 token 数，要算进 token 预算；vLLM 有按请求的接受率指标，SGLang 有自适应投机。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：vLLM、SGLang 投机解码文档；vLLM V1 博客</text>
