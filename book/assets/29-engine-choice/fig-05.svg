<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
<rect x="0" y="0" width="1200" height="530" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">CPU 每步工作和 GPU 重叠以后，一步只取两者中较长的那个</text>
<text x="40" y="92" font-size="14" fill="#646A73">GPU 一步 5 ms（vLLM 博客：Llama-8B 在 H100 上约 5ms）；CPU 每步 0.5 ms 时串行 5.5 ms，重叠后 5.0 ms</text>
<text x="198" y="172" font-size="14" fill="#1F2329" text-anchor="end">串行</text>
