<text x="198" y="220" font-size="14" fill="#1F2329" text-anchor="end">重叠</text>
<rect x="210" y="198" width="950" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="210" y="201" width="432" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="426" y="220" font-size="12" fill="#245BDB" text-anchor="middle">GPU 5</text>
<rect x="642" y="201" width="432" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="858" y="220" font-size="12" fill="#245BDB" text-anchor="middle">GPU 5</text>
<text x="198" y="268" font-size="14" fill="#1F2329" text-anchor="end">重叠时的 CPU</text>
<rect x="210" y="246" width="950" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
