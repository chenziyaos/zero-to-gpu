<text x="52" y="336" font-size="14" fill="#1F2329" font-weight="bold">CPU 每步</text>
<text x="413" y="336" font-size="14" fill="#1F2329" font-weight="bold">串行 GPU 等待</text>
<text x="811" y="336" font-size="14" fill="#1F2329" font-weight="bold">重叠后加速</text>
