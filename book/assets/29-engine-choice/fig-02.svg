<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">两个引擎从不同问题出发，后来互相吸收了对方的做法</text>
<text x="40" y="92" font-size="14" fill="#646A73">倍数都是各自论文或博客在各自基线上测的，不能互相比较</text>
<rect x="40" y="150" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">vLLM</text>
<text x="56" y="211" font-size="14" fill="#646A73">出发点：KV 碎片限制批大小</text>
<text x="56" y="234" font-size="14" fill="#646A73">PagedAttention：吞吐 2-4 倍</text>
<text x="56" y="257" font-size="14" fill="#646A73">V1 重写核心：比 V0 最多 1.7 倍</text>
<rect x="612" y="150" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">SGLang</text>
<text x="628" y="211" font-size="14" fill="#646A73">出发点：多次调用共享前缀</text>
<text x="628" y="234" font-size="14" fill="#646A73">RadixAttention 与压缩状态机</text>
<text x="628" y="257" font-size="14" fill="#646A73">论文：最多 6.4 倍</text>
<rect x="40" y="308" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="336" font-size="15" fill="#1F2329">今天两边都有前缀缓存、分块预填充、xgrammar、投机解码、预填充解码分离。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：vLLM 论文、vLLM V1 博客、SGLang 论文</text>
</svg>