<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">每个 token 的 KV：2 × 层数 × KV 头数 × 每头维度 × 字节</text>
<text x="40" y="92" font-size="14" fill="#646A73">单位：KB（1 KB = 1000 字节），BF16 / FP16</text>
<text x="288" y="168" font-size="14" fill="#1F2329" text-anchor="end">Llama 3 70B，若 64 头各存</text>
<rect x="300" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="150" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="1008" y="168" font-size="13" fill="#646A73">  2621440 字节</text>
<text x="288" y="210" font-size="14" fill="#1F2329" text-anchor="end">OPT-13B，FP16</text>
<rect x="300" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="192" width="219" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="527" y="210" font-size="13" fill="#646A73">  819200 字节</text>
<text x="288" y="252" font-size="14" fill="#1F2329" text-anchor="end">Llama 3 70B，GQA 8 头</text>
<rect x="300" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="234" width="88" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="396" y="252" font-size="13" fill="#646A73">  327680 字节</text>
<text x="288" y="294" font-size="14" fill="#1F2329" text-anchor="end">Llama 3 8B，GQA 8 头</text>
<rect x="300" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="300" y="276" width="35" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="343" y="294" font-size="13" fill="#646A73">  131072 字节</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">70B 一个 16384 token 的请求：GQA 5368.7 MB，若 64 头各存 42949.7 MB。每头维度 128 = 隐层 8192 ÷ 64 个查询头。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：Llama 3 论文表 3；vLLM 论文（OPT-13B）；本篇推算</text>
</svg>