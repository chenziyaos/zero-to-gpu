<g id="a3:4" transform="translate(255, 219.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="57"><tspan x="57" y="14.118"><tspan x="-1.385" text-anchor="start">一次性吃整个 prompt</tspan></tspan></text></g>
