<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">预填充受算力限制，批大小为 1 的解码只有约 1 FLOP/B</text>
<text x="40" y="92" font-size="14" fill="#646A73">H100 SXM BF16 稠密 989 TFLOPS，HBM 3.35 TB/s，拐点约 295 FLOP/B</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">阶段</text>
<text x="282" y="176" font-size="14" fill="#1F2329" font-weight="bold">每个权重字节的用处</text>
<text x="684" y="176" font-size="14" fill="#1F2329" font-weight="bold">受谁限制</text>
<text x="914" y="176" font-size="14" fill="#1F2329" font-weight="bold">对应指标</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">预填充</text>
<text x="282" y="216" font-size="14" fill="#1F2329">和 4096 个 token 各乘加一次</text>
<text x="684" y="216" font-size="14" fill="#1F2329">算力</text>
<text x="914" y="216" font-size="14" fill="#1F2329">TTFT</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">解码，批大小 1</text>
<text x="282" y="254" font-size="14" fill="#1F2329">只乘加一次，约 1 FLOP/B</text>
<text x="684" y="254" font-size="14" fill="#1F2329">HBM 带宽</text>
<text x="914" y="254" font-size="14" fill="#1F2329">TPOT</text>
<rect x="40" y="298" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="329" font-size="18" fill="#1F2329" font-weight="bold">预填充：Llama 3 70B，4096 token</text>
<text x="56" y="359" font-size="14" fill="#646A73">约 578.4 TFLOPs</text>
<text x="56" y="382" font-size="14" fill="#646A73">8 张 H100 按峰值约 73.1 ms</text>
<rect x="612" y="298" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="329" font-size="18" fill="#1F2329" font-weight="bold">解码：同一模型，批大小 1</text>
<text x="628" y="359" font-size="14" fill="#646A73">每卡读 17.65 GB 权重</text>
<text x="628" y="382" font-size="14" fill="#646A73">下限约 5.27 ms 一步</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：H100 产品页（稀疏口径减半）；Splitwise；vLLM 论文；本篇推算</text>
</svg>