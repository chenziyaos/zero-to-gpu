<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">压缩与复用：每个 token 的 KV 更小，共享前缀只算一次</text>
<text x="40" y="92" font-size="14" fill="#646A73">各数据来自各自论文，比较对象不同，不能相互换算</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">手段</text>
<text x="339" y="176" font-size="14" fill="#1F2329" font-weight="bold">做法</text>
<text x="770" y="176" font-size="14" fill="#1F2329" font-weight="bold">论文报告的效果</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">GQA</text>
<text x="339" y="216" font-size="14" fill="#1F2329">几个查询头共用一组 K 和 V</text>
<text x="770" y="216" font-size="14" fill="#1F2329">Llama 3 70B 比 64 头各存小 8 倍</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">MLA</text>
<text x="339" y="254" font-size="14" fill="#1F2329">存低维压缩向量，计算时还原</text>
<text x="770" y="254" font-size="14" fill="#1F2329">比 DeepSeek 67B 的 KV 少 93.3%，吞吐 5.76 倍</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">前缀缓存</text>
<text x="339" y="292" font-size="14" fill="#1F2329">共享前缀的 KV 只算一次</text>
<text x="770" y="292" font-size="14" fill="#1F2329">SGLang 吞吐至多 6.4 倍</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">分层存储</text>
<text x="339" y="330" font-size="14" fill="#1F2329">KV 放到 CPU、内存和 SSD</text>
<text x="770" y="330" font-size="14" fill="#1F2329">Mooncake 真实负载多处理 75% 请求</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">量化 KV 也能按位宽缩小字节，精度影响要在自己的评测集上测。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：GQA；Llama 3；DeepSeek-V2；SGLang；Mooncake 论文</text>
</svg>