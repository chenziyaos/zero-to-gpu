<text x="724" y="298" font-size="14" fill="#1F2329" font-weight="bold">每卡传输</text>
<text x="948" y="298" font-size="14" fill="#1F2329" font-weight="bold">占预填充</text>
<rect x="40" y="314" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
