<text x="56" y="448" font-size="15" fill="#1F2329">DistServe：OPT-175B 的 KV 传输占总延迟不到 0.1%，95% 以上请求小于 30 ms；请求率 7.4 倍或 SLO 收紧 12.6 倍。</text>
