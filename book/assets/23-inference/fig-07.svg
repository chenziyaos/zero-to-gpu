<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">整段预填充让解码停一下，分块预填充把它摊到多步</text>
<text x="40" y="92" font-size="14" fill="#646A73">示意：同一批卡上的步序列（不按比例）</text>
<text x="168" y="172" font-size="14" fill="#1F2329" text-anchor="end">按请求组批</text>
<rect x="180" y="150" width="980" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="180" y="153" width="735" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="548" y="172" font-size="12" fill="#646A73" text-anchor="middle">整批跑到最长的请求结束</text>
<rect x="915" y="153" width="245" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="1038" y="172" font-size="12" fill="#245BDB" text-anchor="middle">下一批</text>
<text x="168" y="220" font-size="14" fill="#1F2329" text-anchor="end">迭代级调度</text>
<rect x="180" y="198" width="980" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="180" y="201" width="245" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="302" y="220" font-size="12" fill="#2EA121" text-anchor="middle">解码</text>
<rect x="425" y="201" width="368" height="28" rx="4" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="609" y="220" font-size="12" fill="#D46B08" text-anchor="middle">整段预填充，解码停顿</text>
<rect x="792" y="201" width="368" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="976" y="220" font-size="12" fill="#2EA121" text-anchor="middle">解码</text>
<text x="168" y="268" font-size="14" fill="#1F2329" text-anchor="end">分块预填充</text>
<rect x="180" y="246" width="980" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="180" y="249" width="245" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="302" y="268" font-size="12" fill="#2EA121" text-anchor="middle">解码 + 一块</text>
<rect x="425" y="249" width="245" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="548" y="268" font-size="12" fill="#2EA121" text-anchor="middle">解码 + 一块</text>
<rect x="670" y="249" width="245" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="792" y="268" font-size="12" fill="#2EA121" text-anchor="middle">解码 + 一块</text>
<rect x="915" y="249" width="245" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="1038" y="268" font-size="12" fill="#2EA121" text-anchor="middle">解码</text>
<rect x="40" y="310" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="341" font-size="18" fill="#1F2329" font-weight="bold">Orca</text>
<text x="56" y="371" font-size="14" fill="#646A73">每步重新组批，结束即走、新来即入</text>
<text x="56" y="394" font-size="14" fill="#646A73">GPT-3 175B 上吞吐 36.9 倍</text>
<rect x="612" y="310" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="341" font-size="18" fill="#1F2329" font-weight="bold">Sarathi-Serve</text>
<text x="628" y="371" font-size="14" fill="#646A73">预填充切成大小相近的块</text>
<text x="628" y="394" font-size="14" fill="#646A73">对 vLLM 服务容量 2.6 倍到 3.7 倍</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：Orca（OSDI 2022）；Sarathi-Serve（OSDI 2024）</text>
</svg>