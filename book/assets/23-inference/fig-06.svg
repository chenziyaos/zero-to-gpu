<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">PagedAttention：按块分配，浪费只在最后一个没填满的块</text>
<text x="40" y="92" font-size="14" fill="#646A73">连续预留时只有 20.4% 到 38.2% 的 KV 显存存实际 token</text>
<rect x="40" y="150" width="548" height="150" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">连续预留</text>
<text x="56" y="211" font-size="14" fill="#646A73">按最大长度提前占一段连续显存</text>
<text x="56" y="234" font-size="14" fill="#646A73">没生成到的位置空着</text>
<text x="56" y="257" font-size="14" fill="#646A73">长度对不齐的空隙成为碎片</text>
<text x="56" y="280" font-size="14" fill="#646A73">88 个请求的容量只用上约 17.95 到 33.62 个</text>
<rect x="612" y="150" width="548" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">按块分配</text>
<text x="628" y="211" font-size="14" fill="#646A73">KV 切成固定大小的块</text>
<text x="628" y="234" font-size="14" fill="#646A73">块表把逻辑块映射到物理块</text>
<text x="628" y="257" font-size="14" fill="#646A73">随生成按需增长，不预留</text>
<text x="628" y="280" font-size="14" fill="#646A73">共享前缀的块，改写时块级复制</text>
<rect x="40" y="330" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="359" font-size="15" fill="#1F2329">效果：KV 显存近乎零浪费，相同延迟下吞吐是 FasterTransformer、Orca 的 2 到 4 倍；块越大浪费越多。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：vLLM 论文（SOSP 2023）</text>
</svg>