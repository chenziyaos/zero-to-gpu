<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">推理的时间账：先找离下限最远的一项，再用 goodput 复测</text>
<text x="40" y="92" font-size="14" fill="#646A73">goodput = SLO 达标率目标下每卡能服务的最大请求率（DistServe 定义）</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">时间账</text>
<text x="253" y="176" font-size="14" fill="#1F2329" font-weight="bold">推理里是什么</text>
<text x="684" y="176" font-size="14" fill="#1F2329" font-weight="bold">先用的手段</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">T_compute</text>
<text x="253" y="216" font-size="14" fill="#1F2329">预填充的计算，影响 TTFT</text>
<text x="684" y="216" font-size="14" fill="#1F2329">分块预填充、前缀缓存（第 6、8 章）</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">W_mem</text>
<text x="253" y="254" font-size="14" fill="#1F2329">解码每步读权重和 KV</text>
<text x="684" y="254" font-size="14" fill="#1F2329">攒批、压缩 KV（第 4、8 章）</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">W_comm</text>
<text x="253" y="292" font-size="14" fill="#1F2329">all-reduce、分离时的 KV 传输</text>
<text x="684" y="292" font-size="14" fill="#1F2329">按层流水、就近放置（第 7 章）</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">W_idle</text>
<text x="253" y="330" font-size="14" fill="#1F2329">排队、碎片、空等、停顿</text>
<text x="684" y="330" font-size="14" fill="#1F2329">分页、迭代级调度、分离（第 5 到 7 章）</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">TTFT 和 TPOT 分别设上限，两项都满足的请求才算达标；吞吐高不等于 goodput 高。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：DistServe 论文；本篇第 1 到 9 章</text>
</svg>