<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">GB300</text>
<text x="268" y="254" font-size="14" fill="#1F2329">2500</text>
<text x="510" y="254" font-size="14" fill="#1F2329">5000</text>
<text x="752" y="254" font-size="14" fill="#1F2329">15</text>
<text x="981" y="254" font-size="14" fill="#1F2329">8</text>
