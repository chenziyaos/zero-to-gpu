<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">H100 SXM</text>
<text x="268" y="216" font-size="14" fill="#1F2329">989.5</text>
<text x="510" y="216" font-size="14" fill="#1F2329">1979</text>
<text x="752" y="216" font-size="14" fill="#1F2329">无</text>
<text x="981" y="216" font-size="14" fill="#1F2329">3.35</text>
