<rect x="40" y="336" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="365" font-size="15" fill="#1F2329">GB300 到 Rubin：HBM 带宽 2.40 倍，FP8 稠密 3.50 倍，BF16 稠密 1.60 倍。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：NVIDIA H100、GB300 NVL72、Vera Rubin NVL72 产品页；主编换算</text>
