<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">换算到每卡、稠密以后，三代硬件的差距只有几倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">稀疏规格除以 2，整柜除以 72；FP4 一栏 Rubin 用 NVFP4 训练（稠密）口径</text>
