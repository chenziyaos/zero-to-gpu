<text x="671" y="330" font-size="14" fill="#1F2329">通信 kernel 要占 SM</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">FlashMLA 2026-09-30 版本移除了 Hopper 与 DeepSeek V3、V3.2、V4.0 的支持，并改了 KV 格式。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：FlashAttention-4（arXiv 2603.05451）；FlashMLA、DeepGEMM、DeepEP README</text>
