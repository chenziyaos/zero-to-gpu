<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">三笔账：乘加涨得比喂数据的路径快</text>
<text x="40" y="92" font-size="14" fill="#646A73">FP16；第二、三行是每 SM 的节奏；主编估算</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold"></text>
<text x="500" y="176" font-size="14" fill="#1F2329" font-weight="bold">V100</text>
<text x="724" y="176" font-size="14" fill="#1F2329" font-weight="bold">A100</text>
<text x="948" y="176" font-size="14" fill="#1F2329" font-weight="bold">H100</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">脊点（FLOP/B）</text>
<text x="500" y="216" font-size="14" fill="#1F2329">139</text>
<text x="724" y="216" font-size="14" fill="#1F2329">201</text>
<text x="948" y="216" font-size="14" fill="#1F2329">295</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">m16n8k16 发射间隔（时钟）</text>
<text x="500" y="254" font-size="14" fill="#1F2329">无此指令</text>
<text x="724" y="254" font-size="14" fill="#1F2329">2</text>
<text x="948" y="254" font-size="14" fill="#1F2329">1</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">wgmma m64n256k16 发射间隔</text>
<text x="500" y="292" font-size="14" fill="#1F2329">无此指令</text>
<text x="724" y="292" font-size="14" fill="#1F2329">无此指令</text>
<text x="948" y="292" font-size="14" fill="#1F2329">128</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">共享内存读取（B/时钟）</text>
<text x="500" y="330" font-size="14" fill="#1F2329">32</text>
<text x="724" y="330" font-size="14" fill="#1F2329">64</text>
<text x="948" y="330" font-size="14" fill="#1F2329">128</text>
<rect x="40" y="374" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="403" font-size="15" fill="#1F2329">V100 到 H100：峰值约 7.92 倍，带宽约 3.72 倍，脊点约 2.13 倍。</text>
<rect x="40" y="424" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="453" font-size="15" fill="#1F2329">共享内存一行按每个 warp 64×64 输出块、K 步长 16 估算，每字节 16 次乘加。</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：白皮书、规格页、PTX ISA；主编核算（64×64 warp 分块为假设）</text>
</svg>