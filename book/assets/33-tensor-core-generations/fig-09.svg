<text x="56" y="403" font-size="15" fill="#1F2329">天花板：FP16 矩阵乘 989 TFLOPS，指数等特殊函数只有 3.9 TFLOPS。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：FlashAttention-3 论文（arXiv:2407.08608）；FlashAttention-2 一行由 35% × 989 推算</text>
