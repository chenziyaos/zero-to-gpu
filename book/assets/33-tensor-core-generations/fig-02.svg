<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<rect x="0" y="0" width="1200" height="490" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">每个 SM 每时钟的乘加，三代里翻了两番</text>
<text x="40" y="92" font-size="14" fill="#646A73">FP16 稠密，每 SM 每时钟 FMA 次数；一次 FMA 算两次运算</text>
<text x="328" y="168" font-size="14" fill="#1F2329" text-anchor="end">V100（8 个 Tensor Core × 64）</text>
<rect x="340" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="150" width="175" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="523" y="168" font-size="13" fill="#646A73">  512</text>
<text x="328" y="210" font-size="14" fill="#1F2329" text-anchor="end">T4（8 个 × 64）</text>
<rect x="340" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="192" width="175" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="523" y="210" font-size="13" fill="#646A73">  512</text>
<text x="328" y="252" font-size="14" fill="#1F2329" text-anchor="end">A100（4 个 × 256）</text>
<rect x="340" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="234" width="350" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="698" y="252" font-size="13" fill="#646A73">  1024</text>
<text x="328" y="294" font-size="14" fill="#1F2329" text-anchor="end">H100（A100 的 2 倍）</text>
<rect x="340" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="276" width="700" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="1048" y="294" font-size="13" fill="#646A73">  2048</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">峰值 = SM 数 × 每 SM 乘加 × 2 × 时钟：V100 80 × 512 × 2 × 1.53 GHz ≈ 125.3 TFLOPS。</text>
<rect x="40" y="382" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="411" font-size="15" fill="#1F2329">SM 数只从 80 涨到 132，整卡峰值的增长主要来自每个 SM 内部。</text>
<text x="40" y="466" font-size="12" fill="#646A73">来源：V100、Turing 白皮书；NVIDIA Ampere、Hopper 技术博客</text>
</svg>