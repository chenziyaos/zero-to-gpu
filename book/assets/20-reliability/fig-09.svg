<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">自动恢复：隔离、补机、启动、加载，每一段都是整个作业在等</text>
<text x="40" y="92" font-size="14" fill="#646A73">上万卡作业几小时就要恢复一次，人工处理跟不上</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">隔离</text>
<text x="56" y="211" font-size="14" fill="#646A73">过量驱逐可疑范围</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">补机</text>
<text x="347" y="211" font-size="14" fill="#646A73">温备机，自检后交付</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">启动</text>
<text x="638" y="211" font-size="14" fill="#646A73">热更新，原地保留环境</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">加载</text>
<text x="929" y="211" font-size="14" fill="#646A73">从最近 checkpoint</text>
<rect x="40" y="262" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="288" font-size="14" fill="#1F2329" font-weight="bold">系统</text>
<text x="310" y="288" font-size="14" fill="#1F2329" font-weight="bold">公开结果</text>
<rect x="40" y="304" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="327" font-size="14" fill="#1F2329" font-weight="bold">Llama 3</text>
<text x="310" y="327" font-size="14" fill="#1F2329">54 天 466 次中断，只有三次需要大量人工干预</text>
<rect x="40" y="342" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="365" font-size="14" fill="#1F2329" font-weight="bold">MegaScale</text>
<text x="310" y="365" font-size="14" fill="#1F2329">数周恢复 100 多次，90% 以上自动处理，15 分钟内追回进度</text>
<rect x="40" y="380" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="403" font-size="14" fill="#1F2329" font-weight="bold">ByteRobust</text>
<text x="310" y="403" font-size="14" fill="#1F2329">16,384 卡测试：温备机、热更新各自把恢复加快十倍以上</text>
<rect x="40" y="418" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="441" font-size="14" fill="#1F2329" font-weight="bold">Meta 研究集群</text>
<text x="310" y="441" font-size="14" fill="#1F2329">lemon 检测识别 40 个节点，大作业失败率从 14% 降到 4%</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：Llama 3 论文；MegaScale 论文；ByteRobust 论文；Kokolis et al.（Meta 研究集群）</text>
</svg>