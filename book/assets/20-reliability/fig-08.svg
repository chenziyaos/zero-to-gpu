<g id="a2:21" transform="translate(56, 682.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 无容错时：loss 增加导致重传延迟累积，计算吞吐剧降（loss 1% 时吞吐仅 5%）</tspan></tspan></text></g>
<g id="a2:22" transform="translate(56, 704.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· LTP 启用自适应重传与流控，在 loss 0-10% 范围内吞吐稳定在 75% ± 2%</tspan></tspan></text></g>
<g id="a2:23" transform="translate(56, 726.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">· 结论：集群 ＞ 1000 卡时，必须启用 LTP 否则网络抖动会拖垮整个训练</tspan></tspan></text></g>
