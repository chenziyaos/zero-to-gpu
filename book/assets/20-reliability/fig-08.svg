<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">静默数据错误：两轮分组重放，交集就是可疑机器</text>
<text x="40" y="92" font-size="14" fill="#646A73">保持 TP、PP 不变，只改数据并行的分组；第一轮连续分组，第二轮按编号取模分组</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">现象</text>
<text x="56" y="211" font-size="14" fill="#646A73">损失尖峰、NaN</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">回退重跑</text>
<text x="347" y="211" font-size="14" fill="#646A73">能复现：数据或代码</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">分组重放</text>
<text x="638" y="211" font-size="14" fill="#646A73">复现不了：怀疑硬件</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">隔离压测</text>
<text x="929" y="211" font-size="14" fill="#646A73">定位机器后长时间压测</text>
<rect x="40" y="262" width="548" height="128" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">有多常见</text>
<text x="56" y="323" font-size="14" fill="#646A73">Meta：数十万台机器中查出数百颗 CPU</text>
<text x="56" y="346" font-size="14" fill="#646A73">Google：每几千台机器几个 mercurial 核</text>
<text x="56" y="369" font-size="14" fill="#646A73">Llama 3：6 次中断归因于 SDC（1.4%）</text>
<rect x="612" y="262" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="293" font-size="18" fill="#1F2329" font-weight="bold">为什么难</text>
<text x="628" y="323" font-size="14" fill="#646A73">唯一症状是算错</text>
<text x="628" y="346" font-size="14" fill="#646A73">行为不确定，短时间难复现</text>
<text x="628" y="369" font-size="14" fill="#646A73">ByteRobust 一例：离线压测 8 小时以上</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：ByteRobust 论文；Llama 3 论文；Dixit et al.（Meta）；Hochschild et al.（Google）</text>
</svg>