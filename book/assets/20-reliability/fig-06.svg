<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
<rect x="0" y="0" width="1200" height="530" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">发现故障：显式的有报错，隐式的要靠心跳、通信记录和自检</text>
<text x="40" y="92" font-size="14" fill="#646A73">ByteRobust 三个月识别显式故障 38,236 次、隐式故障 5,948 次</text>
<rect x="40" y="150" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">显式故障</text>
<text x="56" y="211" font-size="14" fill="#646A73">有报错和出错机器</text>
<text x="56" y="234" font-size="14" fill="#646A73">CUDA 错误占事故的 36.1%</text>
<text x="56" y="257" font-size="14" fill="#646A73">（778,135 个作业，三个月）</text>
<rect x="612" y="150" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">隐式故障</text>
<text x="628" y="211" font-size="14" fill="#646A73">挂死、曲线偏离、性能下降</text>
<text x="628" y="234" font-size="14" fill="#646A73">静默数据错误</text>
<text x="628" y="257" font-size="14" fill="#646A73">一次挂死人工诊断一个半小时以上</text>
<rect x="40" y="308" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="334" font-size="14" fill="#1F2329" font-weight="bold">手段</text>
<text x="339" y="334" font-size="14" fill="#1F2329" font-weight="bold">做法</text>
<rect x="40" y="350" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="373" font-size="14" fill="#1F2329" font-weight="bold">心跳和超时</text>
<text x="339" y="373" font-size="14" fill="#1F2329">MegaScale 心跳超时触发恢复；NCCL 进程组超时默认 10 分钟</text>
<rect x="40" y="388" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="411" font-size="14" fill="#1F2329" font-weight="bold">通信记录</text>
<text x="339" y="411" font-size="14" fill="#1F2329">Flight Recorder 超时时转储；NCCL 2.24 起 RAS 可查询运行中作业</text>
<rect x="40" y="426" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="449" font-size="14" fill="#1F2329" font-weight="bold">停机自检</text>
<text x="339" y="449" font-size="14" fill="#1F2329">MegaScale 诊断不到 10 分钟；DCGM 2 级诊断作失败后的收尾检查</text>
<text x="40" y="506" font-size="12" fill="#646A73">来源：ByteRobust 论文；MegaScale 论文；PyTorch 文档；NCCL RAS 文档；DCGM 诊断文档</text>
</svg>