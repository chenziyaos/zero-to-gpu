<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">ETTR：有效训练时间占墙钟时间，上万卡要做到 90% 以上</text>
<text x="40" y="92" font-size="14" fill="#646A73">MFU 衡量每一步算得多满，ETTR 衡量有多少时间在算；两者相乘才是实际产出</text>
<text x="328" y="168" font-size="14" fill="#1F2329" text-anchor="end">Llama 3（16K H100）</text>
<rect x="340" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="150" width="630" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="978" y="168" font-size="13" fill="#646A73">  超过 90%</text>
<text x="328" y="210" font-size="14" fill="#1F2329" text-anchor="end">MegaScale（万卡以上）</text>
<rect x="340" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="192" width="630" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="978" y="210" font-size="13" fill="#646A73">  90% 以上</text>
<text x="328" y="252" font-size="14" fill="#1F2329" text-anchor="end">ByteRobust（9,600 卡，三个月）</text>
<rect x="340" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="340" y="234" width="679" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="1027" y="252" font-size="13" fill="#646A73">  97%</text>
<rect x="40" y="290" width="1120" height="49" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="319" font-size="15" fill="#1F2329">损失分四项：写 checkpoint 阻塞、故障到被发现、诊断换机重启、从上次 checkpoint 重算。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：Llama 3 论文；MegaScale 论文；ByteRobust 论文</text>
</svg>