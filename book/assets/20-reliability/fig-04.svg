<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">checkpoint 间隔：写的损失 C/τ 和重算的损失 τ/(2M) 相等处最优</text>
<text x="40" y="92" font-size="14" fill="#646A73">τ* = √(2CM)，此时总损失约 √(2C/M)；前提是 C 远小于 M</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">项目</text>
<text x="368" y="176" font-size="14" fill="#1F2329" font-weight="bold">配套代码</text>
<text x="770" y="176" font-size="14" fill="#1F2329" font-weight="bold">应为</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">Young 间隔</text>
<text x="368" y="216" font-size="14" fill="#1F2329">2545.6 秒（25455 步）</text>
<text x="770" y="216" font-size="14" fill="#1F2329">正确</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">Daly 间隔</text>
<text x="368" y="254" font-size="14" fill="#1F2329">72.5 秒：式中没有 C，单位是秒的平方根</text>
<text x="770" y="254" font-size="14" fill="#1F2329">在 √(2CM) 基础上做高阶修正</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">期望耗时</text>
<text x="368" y="292" font-size="14" fill="#1F2329">只算写和重启，漏了重算</text>
<text x="770" y="292" font-size="14" fill="#1F2329">加上每次故障平均重算半个间隔</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">扫描结论</text>
<text x="368" y="330" font-size="14" fill="#1F2329">Young 间隔 76.2%，只写一次反而 89.1%</text>
<text x="770" y="330" font-size="14" fill="#1F2329">间隔过长时重算损失上升</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">Daly 引用</text>
<text x="368" y="368" font-size="14" fill="#1F2329">arXiv 0704.3859（物理论文）</text>
<text x="770" y="368" font-size="14" fill="#1F2329">Daly 2006，Future Generation Computer Systems</text>
<rect x="40" y="412" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="441" font-size="15" fill="#1F2329">代码例子 C = 600 秒、M = 5400 秒：一阶模型最优点损失约 47.1%，C 已是 M 的九分之一，写一次 600 秒在这个故障率下代价太大。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：Kokolis et al.（引 Young、Daly 经典结论）；zero-to-gpu/20-reliability/sim_ckpt.py 实跑</text>
</svg>