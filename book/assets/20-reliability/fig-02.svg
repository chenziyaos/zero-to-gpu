<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">卡越多，作业越快遇到故障：MTTF 从 47.7 天降到约 1.8 小时</text>
<text x="40" y="92" font-size="14" fill="#646A73">作业 MTTF = (N·r_f)⁻¹；8 卡、1024 卡为实测，16384 卡、131072 卡为模型外推</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">作业规模</text>
<text x="368" y="176" font-size="14" fill="#1F2329" font-weight="bold">作业 MTTF</text>
<text x="684" y="176" font-size="14" fill="#1F2329" font-weight="bold">口径</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">8 卡</text>
<text x="368" y="216" font-size="14" fill="#1F2329">47.7 天</text>
<text x="684" y="216" font-size="14" fill="#1F2329">Meta 研究集群实测</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">1024 卡</text>
<text x="368" y="254" font-size="14" fill="#1F2329">7.9 小时</text>
<text x="684" y="254" font-size="14" fill="#1F2329">Meta 研究集群实测</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">16K 张 H100</text>
<text x="368" y="292" font-size="14" fill="#1F2329">约 3.09 小时</text>
<text x="684" y="292" font-size="14" fill="#1F2329">Llama 3：54 天意外中断 419 次</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">16384 卡</text>
<text x="368" y="330" font-size="14" fill="#1F2329">约 1.8 小时</text>
<text x="684" y="330" font-size="14" fill="#1F2329">Meta 模型外推</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">131072 卡</text>
<text x="368" y="368" font-size="14" fill="#1F2329">约 0.23 小时</text>
<text x="684" y="368" font-size="14" fill="#1F2329">Meta 模型外推</text>
<rect x="40" y="412" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="441" font-size="15" fill="#1F2329">Llama 3 的意外中断约 78% 归因于硬件，GPU 问题占 58.7%。研究集群和生产训练的软件栈不同，两组数字只比量级。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：Kokolis et al., Revisiting Reliability in Large-Scale ML Research Clusters；Llama 3 论文</text>
</svg>