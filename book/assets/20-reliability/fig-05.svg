<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">两段式 checkpoint：只有拷到主机内存的几秒挡住训练</text>
<text x="40" y="92" font-size="14" fill="#646A73">后台写远端要在下一次 checkpoint 之前完成；恢复时的读取仍在关键路径上</text>
<text x="148" y="172" font-size="14" fill="#1F2329" text-anchor="end">训练</text>
<rect x="160" y="150" width="1000" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="160" y="153" width="100" height="28" rx="4" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="210" y="172" font-size="12" fill="#646A73" text-anchor="middle">拷出</text>
<rect x="260" y="153" width="900" height="28" rx="4" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="710" y="172" font-size="12" fill="#245BDB" text-anchor="middle">继续训练</text>
<text x="148" y="220" font-size="14" fill="#1F2329" text-anchor="end">后台</text>
<rect x="160" y="198" width="1000" height="34" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="201" width="600" height="28" rx="4" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="560" y="220" font-size="12" fill="#2EA121" text-anchor="middle">写远端存储</text>
<rect x="40" y="262" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">公开数据</text>
<text x="56" y="323" font-size="14" fill="#646A73">MegaScale：第一阶段几秒</text>
<text x="56" y="346" font-size="14" fill="#646A73">ByteRobust：每步写，开销小于 0.9%</text>
<text x="56" y="369" font-size="14" fill="#646A73">CheckFreq：开销 3.5% 以内</text>
<rect x="612" y="262" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="293" font-size="18" fill="#1F2329" font-weight="bold">代价</text>
<text x="628" y="323" font-size="14" fill="#646A73">async_save 先拷到 CPU 缓冲，占内存</text>
<text x="628" y="346" font-size="14" fill="#646A73">同一时刻只保留一个在途请求</text>
<text x="628" y="369" font-size="14" fill="#646A73">恢复读取：MegaScale 瓶颈在 HDFS 带宽</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：MegaScale 论文；PyTorch DCP 异步保存教程；ByteRobust 论文；CheckFreq（FAST 2021）</text>
</svg>