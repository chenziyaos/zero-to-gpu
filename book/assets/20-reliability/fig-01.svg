<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一次故障的代价：写、等、恢复、重算</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇处理作业层面的 W_idle，用 ETTR 衡量</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">写 checkpoint</text>
<text x="56" y="211" font-size="14" fill="#646A73">阻塞训练（第 3、4 章）</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">发现</text>
<text x="347" y="211" font-size="14" fill="#646A73">心跳、超时、自检（第 5 章）</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">恢复</text>
<text x="638" y="211" font-size="14" fill="#646A73">隔离、补机、重启（第 8 章）</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">重算</text>
<text x="929" y="211" font-size="14" fill="#646A73">上次 checkpoint 之后（第 3</text>
<text x="929" y="234" font-size="14" fill="#646A73">章）</text>
<rect x="40" y="284" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">频率（第 1 章）</text>
<text x="56" y="346" font-size="14" fill="#646A73">Llama 3：54 天 419 次</text>
<text x="56" y="369" font-size="14" fill="#646A73">1024 卡 MTTF 7.9 小时</text>
<rect x="421" y="284" width="357" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="437" y="316" font-size="18" fill="#1F2329" font-weight="bold">不报错的（第 6、7 章）</text>
<text x="437" y="346" font-size="14" fill="#646A73">慢节点拖慢全体</text>
<text x="437" y="369" font-size="14" fill="#646A73">静默数据错误只表现为算错</text>
<rect x="803" y="284" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="316" font-size="18" fill="#1F2329" font-weight="bold">账本（第 9 章）</text>
<text x="819" y="346" font-size="14" fill="#646A73">16384 卡：约 65% 到约 95.2%</text>
<text x="819" y="369" font-size="14" fill="#646A73">先改阻塞，再改重启</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Llama 3 论文；MegaScale 论文；ByteRobust 论文；Kokolis et al.（Meta 研究集群）</text>
</svg>