<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">慢节点：不报错，但同步训练每步都等它</text>
<text x="40" y="92" font-size="14" fill="#646A73">生产集群的统计口径各不相同，下面各条分别标出</text>
<text x="348" y="168" font-size="14" fill="#1F2329" text-anchor="end">至少慢 10% 的作业占比</text>
<rect x="360" y="150" width="631" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="360" y="150" width="268" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="636" y="168" font-size="13" fill="#646A73">  42.5%（what-if）</text>
<text x="348" y="210" font-size="14" fill="#1F2329" text-anchor="end">尾部作业浪费的资源</text>
<rect x="360" y="192" width="631" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="360" y="192" width="284" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="652" y="210" font-size="13" fill="#646A73">  45%（what-if）</text>
<text x="348" y="252" font-size="14" fill="#1F2329" text-anchor="end">人工检查的大作业中遇到慢故障</text>
<rect x="360" y="234" width="631" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="360" y="234" width="374" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="742" y="252" font-size="13" fill="#646A73">  16 / 27（FALCON）</text>
<text x="348" y="294" font-size="14" fill="#1F2329" text-anchor="end">一个 1.5 倍慢节点的吞吐损失</text>
<rect x="360" y="276" width="631" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="360" y="276" width="210" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="578" y="294" font-size="13" fill="#646A73">  33.3%（配套代码模型）</text>
<rect x="40" y="332" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="361" font-size="15" fill="#1F2329">MegaScale：约 0.5% 的机器明显更慢，移除后 MFU 提升约 0.7%。FALCON：慢故障平均让作业完成时间延长到 1.34 倍。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：Lin et al. 慢节点 what-if 分析；Wu et al. FALCON；MegaScale 论文；Llama 3 论文</text>
</svg>