<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">W_host 的三个来源：同步点、未重叠的拷贝、提交开销</text>
<text x="40" y="92" font-size="14" fill="#646A73">每一项都是 GPU 在等主机：等主机发下一个任务，或等数据从主机内存搬过来</text>
<rect x="40" y="140" width="357" height="150" rx="12" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1"/>
<circle cx="69" cy="165" r="13" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5"/>
<text x="69" y="170" font-size="13" fill="#D83931" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="171" font-size="18" fill="#1F2329" font-weight="bold">同步点</text>
<text x="56" y="201" font-size="14" fill="#646A73">V100 上 2.9 µs 的 kernel，每次 launch 后</text>
<text x="56" y="224" font-size="14" fill="#646A73">都同步，含开销 9.6 µs</text>
<text x="56" y="247" font-size="14" fill="#646A73">处理：去掉多余同步，stream 间用 event 传依赖</text>
<text x="56" y="270" font-size="14" fill="#646A73">（第 6、10 章）</text>
<rect x="421" y="140" width="357" height="150" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="450" cy="165" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="450" y="170" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="469" y="171" font-size="18" fill="#1F2329" font-weight="bold">未重叠的拷贝</text>
<text x="437" y="201" font-size="14" fill="#646A73">PCIe Gen2 老笔记本：可分页 2.31 GB/s，</text>
<text x="437" y="224" font-size="14" fill="#646A73">pinned 5.77 GB/s</text>
<text x="437" y="247" font-size="14" fill="#646A73">处理：pinned 内存 + 多 stream 切块，把拷贝</text>
<text x="437" y="270" font-size="14" fill="#646A73">藏到计算后面（第 7 章）</text>
<rect x="803" y="140" width="357" height="150" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="832" cy="165" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="832" y="170" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="851" y="171" font-size="18" fill="#1F2329" font-weight="bold">提交开销</text>
<text x="819" y="201" font-size="14" fill="#646A73">每步只同步一次时仍是 3.8 µs，CUDA Graph 降</text>
<text x="819" y="224" font-size="14" fill="#646A73">到 3.4 µs</text>
<text x="819" y="247" font-size="14" fill="#646A73">处理：先删同步，再用 CUDA Graph 一次提交整串</text>
<text x="819" y="270" font-size="14" fill="#646A73">kernel（第 8 章）</text>
<rect x="40" y="326" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="355" font-size="15" fill="#1F2329">先用 nsys 看时间线上的空隙落在哪一类，再挑对应的办法；三类都消掉后，等待转到 kernel 内部（W_mem）。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：Gray, Getting Started with CUDA Graphs；Harris, How to Optimize Data Transfers in CUDA C/C++</text>
</svg>