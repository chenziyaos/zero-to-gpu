<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
<rect x="0" y="0" width="1200" height="530" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">同一份重叠代码：C1060 上 V2 快，C2050 上 V1 快</text>
<text x="40" y="92" font-size="14" fill="#646A73">串行与两种异步写法的总耗时，ms；V1 按块依次发 H2D、kernel、D2H，V2 先发完所有 H2D 再发 kernel 和 D2H</text>
<text x="248" y="168" font-size="14" fill="#1F2329" text-anchor="end">C1060 · 串行</text>
<rect x="260" y="150" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="150" width="654" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="922" y="168" font-size="13" fill="#646A73">12.92 ms  </text>
<text x="248" y="210" font-size="14" fill="#1F2329" text-anchor="end">C1060 · 异步 V1</text>
<rect x="260" y="192" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="192" width="690" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="958" y="210" font-size="13" fill="#646A73">13.64 ms  只有 1 个拷贝引擎</text>
<text x="248" y="252" font-size="14" fill="#1F2329" text-anchor="end">C1060 · 异步 V2</text>
<rect x="260" y="234" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="234" width="448" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="716" y="252" font-size="13" fill="#646A73">8.85 ms  </text>
<text x="248" y="294" font-size="14" fill="#1F2329" text-anchor="end">C2050 · 串行</text>
<rect x="260" y="276" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="276" width="505" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="773" y="294" font-size="13" fill="#646A73">9.98 ms  </text>
<text x="248" y="336" font-size="14" fill="#1F2329" text-anchor="end">C2050 · 异步 V1</text>
<rect x="260" y="318" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="318" width="290" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="558" y="336" font-size="13" fill="#646A73">5.74 ms  两个方向各有拷贝引擎</text>
<text x="248" y="378" font-size="14" fill="#1F2329" text-anchor="end">C2050 · 异步 V2</text>
<rect x="260" y="360" width="690" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="260" y="360" width="385" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="653" y="378" font-size="13" fill="#646A73">7.6 ms  </text>
<rect x="40" y="422" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="451" font-size="15" fill="#1F2329">计算能力 3.5 起有 Hyper-Q，两种发射顺序都能拿到同样的加速；新卡上先用 nsys 看时间线，再决定要不要调发射顺序。</text>
<text x="40" y="506" font-size="12" fill="#646A73">来源：Harris, How to Overlap Data Transfers in CUDA C/C++（NVIDIA 技术博客）</text>
</svg>