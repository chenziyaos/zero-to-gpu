<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">CUDA 线程层级：从 grid 到 warp</text>
<text x="40" y="92" font-size="14" fill="#646A73">grid 包含若干 block，每个 block 包含多个 warp</text>
<rect x="80" y="100" width="640" height="50" rx="12" fill="#FFFFFF" stroke="#82A7FC" stroke-width="1"/>
<text x="96" y="131" font-size="18" fill="#1F2329" font-weight="bold">grid = gridDim × 1</text>
<text x="96" y="161" font-size="14" fill="#646A73">gridDim.x, gridDim.y, gridDim.z</text>
<rect x="80" y="170" width="640" height="50" rx="12" fill="#FFFFFF" stroke="#8EE085" stroke-width="1"/>
<text x="96" y="201" font-size="18" fill="#1F2329" font-weight="bold">block = blockDim × 1</text>
<text x="96" y="231" font-size="14" fill="#646A73">blockDim.x, blockDim.y, blockDim.z；线程数上限可见规格</text>
<rect x="80" y="240" width="640" height="50" rx="12" fill="#FFFFFF" stroke="#FFBA6B" stroke-width="1"/>
<text x="96" y="271" font-size="18" fill="#1F2329" font-weight="bold">warp = 硬件调度单位</text>
<text x="96" y="301" font-size="14" fill="#646A73">最小并行执行的抽象；隐式组织</text>
<rect x="80" y="310" width="640" height="50" rx="12" fill="#FFFFFF" stroke="#F98E8B" stroke-width="1"/>
<text x="96" y="341" font-size="18" fill="#1F2329" font-weight="bold">thread = (threadIdx)</text>
<text x="96" y="371" font-size="14" fill="#646A73">执行单位</text>
<text x="400" y="400" font-size="12" fill="#4B5563" text-anchor="middle">块间无先后顺序；同一块内线程可用 __syncthreads() 同步；warp 内线程同时发射同一指令</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：NVIDIA CUDA Programming Guide Programming Model</text>
</svg>