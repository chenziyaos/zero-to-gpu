<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">DCQCN：交换机标记、接收端回 CNP、发送端降速</text>
<text x="40" y="92" font-size="14" fill="#646A73">目标是在队列涨到 PFC 阈值之前让发送端降速</text>
<rect x="40" y="150" width="344" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">拥塞点（交换机）</text>
<text x="56" y="211" font-size="14" fill="#646A73">队列超过 Kmin 按概率打 ECN 标记</text>
<polyline points="390,191 422,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="412,185 422,191 412,197" fill="#8F959E"/>
<rect x="428" y="150" width="344" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="457" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="457" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="476" y="181" font-size="18" fill="#1F2329" font-weight="bold">通知点（接收端）</text>
<text x="444" y="211" font-size="14" fill="#646A73">每条流每 50 微秒最多一个 CNP</text>
<polyline points="778,191 810,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="800,185 810,191 800,197" fill="#8F959E"/>
<rect x="816" y="150" width="344" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="845" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="845" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="864" y="181" font-size="18" fill="#1F2329" font-weight="bold">反应点（发送端）</text>
<text x="832" y="211" font-size="14" fill="#646A73">收到 CNP 降速，之后逐步提速</text>
<rect x="40" y="262" width="1120" height="128" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">公开部署的经验</text>
<text x="56" y="323" font-size="14" fill="#646A73">Meta：400G 用默认参数、ECN 阈值翻倍，性能下降；固件实现改过，CNP 计数不准</text>
<text x="56" y="346" font-size="14" fill="#646A73">Meta：400G 部署停用 DCQCN，只用 PFC 一年以上，改用接收端 CTS 准入</text>
<text x="56" y="369" font-size="14" fill="#646A73">Llama 3：spine 用深缓冲交换机吸收瞬时拥塞</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：DCQCN（SIGCOMM 2015）；Meta RoCE 博客；Llama 3 论文</text>
</svg>