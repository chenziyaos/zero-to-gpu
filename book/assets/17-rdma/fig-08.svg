<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<rect x="0" y="0" width="1200" height="500" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">PXN：跨轨道的数据先经 NVLink 换到同号卡</text>
<text x="40" y="92" font-size="14" fill="#646A73">128 台机器的 all-to-all 每卡带宽，流体模型</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">2:1，PXN 开</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="948" y="168" font-size="13" fill="#646A73">36.9 GB/s</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">2:1，PXN 关</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="495" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="743" y="210" font-size="13" fill="#646A73">26.1 GB/s</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">4:1，PXN 开</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="391" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="639" y="252" font-size="13" fill="#646A73">20.6 GB/s</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">4:1，PXN 关</text>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="249" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="497" y="294" font-size="13" fill="#646A73">13.1 GB/s</text>
<rect x="40" y="332" width="548" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="363" font-size="18" fill="#1F2329" font-weight="bold">PXN</text>
<text x="56" y="393" font-size="14" fill="#646A73">经 NVLink 和中间 GPU 用非本地网卡</text>
<text x="56" y="416" font-size="14" fill="#646A73">NCCL_PXN_DISABLE=1 关闭</text>
<rect x="612" y="332" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="363" font-size="18" fill="#1F2329" font-weight="bold">自适应路由</text>
<text x="628" y="393" font-size="14" fill="#646A73">按端口拥塞选出口，弥补哈希的概率性</text>
<text x="628" y="416" font-size="14" fill="#646A73">NCCL：IB 默认开，RoCE 默认关</text>
<text x="40" y="476" font-size="12" fill="#646A73">来源：sim_fabric.py sweep --nodes 128 实跑输出；NCCL 文档（NCCL_PXN_DISABLE，2.12 起）</text>
</svg>