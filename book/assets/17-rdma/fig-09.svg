<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect x="0" y="0" width="1200" height="520" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">主机侧：每张 GPU 用自己的集群网卡，直读显存</text>
<text x="40" y="92" font-size="14" fill="#646A73">DGX H100：8 块单口 ConnectX-7 做集群网络，另有 2 块双口做存储和管理</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">变量</text>
<text x="421" y="166" font-size="14" fill="#1F2329" font-weight="bold">作用</text>
<text x="831" y="166" font-size="14" fill="#1F2329" font-weight="bold">核对</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">NCCL_IB_HCA</text>
<text x="421" y="206" font-size="14" fill="#1F2329">指定用于通信的 RDMA 网卡</text>
<text x="831" y="206" font-size="14" fill="#1F2329">只列集群网卡</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">NCCL_IB_GID_INDEX</text>
<text x="421" y="244" font-size="14" fill="#1F2329">RoCE 模式的 GID 索引</text>
<text x="831" y="244" font-size="14" fill="#1F2329">和 show_gids 的 RoCEv2 一致</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">NCCL_NET_GDR_LEVEL</text>
<text x="421" y="282" font-size="14" fill="#1F2329">GPU 与网卡多远仍用 GPUDirect RDMA</text>
<text x="831" y="282" font-size="14" fill="#1F2329">PIX：同一 PCI 交换芯片</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">NCCL_CROSS_NIC</text>
<text x="421" y="320" font-size="14" fill="#1F2329">同一 ring 是否跨网卡</text>
<text x="831" y="320" font-size="14" fill="#1F2329">轨道优化网络不跨</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">NCCL_IB_QPS_PER_CONNECTION</text>
<text x="421" y="358" font-size="14" fill="#1F2329">每个连接的 QP 数，1 到 128</text>
<text x="831" y="358" font-size="14" fill="#1F2329">RoCE 多级网络按需加大</text>
<rect x="40" y="408" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="437" font-size="15" fill="#1F2329">用 NCCL_DEBUG=INFO 的启动日志核对：每个 rank 用了哪块网卡、是否用了 GPUDirect RDMA。</text>
<text x="40" y="496" font-size="12" fill="#646A73">来源：DGX H100 User Guide；ConnectX-7 Datasheet；NCCL 文档</text>
</svg>