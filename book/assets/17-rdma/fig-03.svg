<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">InfiniBand 与 RoCEv2：上限相同，不丢包和分流的做法不同</text>
<text x="40" y="92" font-size="14" fill="#646A73">Llama 3：405B 用 RoCE，较小模型用 Quantum2 IB，两套都是 400 Gbps</text>
<rect x="40" y="140" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">InfiniBand</text>
<text x="56" y="201" font-size="14" fill="#646A73">链路层逐跳信用流控</text>
<text x="56" y="224" font-size="14" fill="#646A73">下游有空间才给上游信用</text>
<text x="56" y="247" font-size="14" fill="#646A73">NCCL 默认打开自适应路由</text>
<rect x="612" y="140" width="548" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">RoCEv2</text>
<text x="628" y="201" font-size="14" fill="#646A73">封装在以太网、IPv4、UDP 里</text>
<text x="628" y="224" font-size="14" fill="#646A73">PFC 暂停帧做到不丢包</text>
<text x="628" y="247" font-size="14" fill="#646A73">UDP 目的端口 4791，源端口每 QP 随机</text>
<text x="628" y="270" font-size="14" fill="#646A73">同一 QP 走同一路径</text>
<rect x="40" y="326" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="355" font-size="15" fill="#1F2329">RoCE 的大规模部署要额外处理：ECMP 低熵、PFC 死锁和暂停风暴、拥塞控制调参。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：DCQCN（SIGCOMM 2015）；RDMA over Commodity Ethernet at Scale；Llama 3 论文；NCCL 文档</text>
</svg>