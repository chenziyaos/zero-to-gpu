<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">跨机这一跳：上限由网卡定，等待来自网络和主机</text>
<text x="40" y="92" font-size="14" fill="#646A73">本篇处理 W_comm 里跨机网络造成的等待</text>
<rect x="40" y="150" width="189" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">拓扑</text>
<text x="56" y="211" font-size="14" fill="#646A73">流量离不离开 leaf（第</text>
<text x="56" y="234" font-size="14" fill="#646A73">3 章）</text>
<polyline points="235,202 267,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,196 267,202 257,208" fill="#8F959E"/>
<rect x="273" y="150" width="189" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="302" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="302" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">哈希</text>
<text x="289" y="211" font-size="14" fill="#646A73">ECMP 让大流挤在一起（</text>
<text x="289" y="234" font-size="14" fill="#646A73">第 4 章）</text>
<polyline points="468,202 500,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,196 500,202 490,208" fill="#8F959E"/>
<rect x="506" y="150" width="189" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="535" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="535" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="554" y="181" font-size="18" fill="#1F2329" font-weight="bold">暂停</text>
<text x="522" y="211" font-size="14" fill="#646A73">PFC 按端口暂停（第 5</text>
<text x="522" y="234" font-size="14" fill="#646A73">章）</text>
<polyline points="700,202 732,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="722,196 732,202 722,208" fill="#8F959E"/>
<rect x="738" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="767" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="767" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="786" y="181" font-size="18" fill="#1F2329" font-weight="bold">拥塞控制</text>
<text x="754" y="211" font-size="14" fill="#646A73">ECN、CNP、接收端准入</text>
<text x="754" y="234" font-size="14" fill="#646A73">（第 6 章）</text>
<polyline points="933,202 965,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="955,196 965,202 955,208" fill="#8F959E"/>
<rect x="971" y="150" width="189" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="1000" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">多路径</text>
<text x="987" y="211" font-size="14" fill="#646A73">自适应路由、PXN（第 7</text>
<text x="987" y="234" font-size="14" fill="#646A73">章）</text>
<rect x="40" y="284" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="316" font-size="18" fill="#1F2329" font-weight="bold">上限（第 1、2 章）</text>
<text x="56" y="346" font-size="14" fill="#646A73">400 Gbps 网卡每方向 50 GB/s</text>
<text x="56" y="369" font-size="14" fill="#646A73">NVLink 每方向 450 GB/s，相差 9 倍</text>
<rect x="612" y="284" width="548" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="628" y="316" font-size="18" fill="#1F2329" font-weight="bold">主机与诊断（第 8、9 章）</text>
<text x="628" y="346" font-size="14" fill="#646A73">NCCL_IB_HCA、GID、GPUDirect RDMA</text>
<text x="628" y="369" font-size="14" fill="#646A73">一对网卡测到全规模</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：DCQCN（SIGCOMM 2015）；RDMA over Commodity Ethernet at Scale（SIGCOMM 2016）；Meta RoCE 博客；Llama 3 论文；NCCL 文档</text>
</svg>