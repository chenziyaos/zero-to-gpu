<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">token 总量除以有效吞吐，折合 226.9 个节点，和报告的 226.75 对得上</text>
<text x="40" y="92" font-size="14" fill="#646A73">节点秒 = 608B ÷ 73.7k（prefill）+ 168B ÷ 14.8k（decode）；prefill 占约 42.1%</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">阶段</text>
<text x="247" y="176" font-size="14" fill="#1F2329" font-weight="bold">token 数</text>
<text x="429" y="176" font-size="14" fill="#1F2329" font-weight="bold">每节点吞吐</text>
<text x="649" y="176" font-size="14" fill="#1F2329" font-weight="bold">节点秒</text>
<text x="868" y="176" font-size="14" fill="#1F2329" font-weight="bold">部署单元</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">prefill</text>
<text x="247" y="216" font-size="14" fill="#1F2329">608B</text>
<text x="429" y="216" font-size="14" fill="#1F2329">73.7k tok/s</text>
<text x="649" y="216" font-size="14" fill="#1F2329">8.250e+06</text>
<text x="868" y="216" font-size="14" fill="#1F2329">4 节点，EP32</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">decode</text>
<text x="247" y="254" font-size="14" fill="#1F2329">168B</text>
<text x="429" y="254" font-size="14" fill="#1F2329">14.8k tok/s</text>
<text x="649" y="254" font-size="14" fill="#1F2329">1.135e+07</text>
<text x="868" y="254" font-size="14" fill="#1F2329">18 节点，EP144</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">合计</text>
<text x="247" y="292" font-size="14" fill="#1F2329"></text>
<text x="429" y="292" font-size="14" fill="#1F2329"></text>
<text x="649" y="292" font-size="14" fill="#1F2329">1.960e+07</text>
<text x="868" y="292" font-size="14" fill="#1F2329">÷ 86400 = 226.9 节点</text>
<rect x="40" y="336" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="365" font-size="15" fill="#1F2329">报告的吞吐是有效吞吐：占用期间的空转已经折进去了，没被占用的节点时间才是峰谷 W_idle。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：DeepSeek 推理系统说明（Day 6）；主编核算</text>
</svg>