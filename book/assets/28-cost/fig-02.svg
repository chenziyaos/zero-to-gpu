<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">每百万 token 成本 = 卡时价 ÷ 3600 ÷（每卡吞吐 × 利用率）× 一百万</text>
<text x="40" y="92" font-size="14" fill="#646A73">算例：DeepSeek 解码，每卡时 2 美元，每卡约 1850 tok/s，得约 0.3003 美元每百万输出 token</text>
<rect x="40" y="150" width="357" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">卡时价</text>
<text x="56" y="211" font-size="14" fill="#646A73">采购、租赁、机房</text>
<text x="56" y="234" font-size="14" fill="#646A73">第 8 章</text>
<rect x="421" y="150" width="357" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="181" font-size="18" fill="#1F2329" font-weight="bold">每卡吞吐</text>
<text x="437" y="211" font-size="14" fill="#646A73">批大小、并行、单步时间</text>
<text x="437" y="234" font-size="14" fill="#646A73">第 2、4、5 章</text>
<rect x="803" y="150" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="819" y="181" font-size="18" fill="#1F2329" font-weight="bold">利用率</text>
<text x="819" y="211" font-size="14" fill="#646A73">峰谷、扩缩容、共池</text>
<text x="819" y="234" font-size="14" fill="#646A73">第 7 章</text>
<rect x="40" y="284" width="1120" height="49" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="56" y="313" font-size="15" fill="#1F2329">吞吐翻倍或利用率翻倍，单价都减半；卡时价翻倍，单价翻倍。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：DeepSeek 推理系统说明（Day 6）；主编核算</text>
</svg>