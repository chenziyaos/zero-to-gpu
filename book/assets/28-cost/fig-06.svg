<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect x="0" y="0" width="1200" height="410" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">按有效吞吐，输出成本是输入的 4.98 倍；R1 标价只差 3.98 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">每卡时 2 美元；美元每百万 token；输入吞吐含命中缓存的部分</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold"></text>
<text x="276" y="176" font-size="14" fill="#1F2329" font-weight="bold">每卡吞吐</text>
<text x="500" y="176" font-size="14" fill="#1F2329" font-weight="bold">成本</text>
<text x="724" y="176" font-size="14" fill="#1F2329" font-weight="bold">R1 标价</text>
<text x="948" y="176" font-size="14" fill="#1F2329" font-weight="bold">标价 ÷ 成本</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">输入（prefill）</text>
<text x="276" y="216" font-size="14" fill="#1F2329">9212 tok/s</text>
<text x="500" y="216" font-size="14" fill="#1F2329">0.0603</text>
<text x="724" y="216" font-size="14" fill="#1F2329">0.55（未命中）</text>
<text x="948" y="216" font-size="14" fill="#1F2329">9.1</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">输出（decode）</text>
<text x="276" y="254" font-size="14" fill="#1F2329">1850 tok/s</text>
<text x="500" y="254" font-size="14" fill="#1F2329">0.3003</text>
<text x="724" y="254" font-size="14" fill="#1F2329">2.19</text>
<text x="948" y="254" font-size="14" fill="#1F2329">7.3</text>
<rect x="40" y="298" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="327" font-size="15" fill="#1F2329">输出每步要读权重和平均 4,989 个 token 的 KV，受 W_mem 限制；输入一次算整段，受 T_compute 限制。</text>
<text x="40" y="386" font-size="12" fill="#646A73">来源：DeepSeek 推理系统说明（Day 6）；主编核算</text>
</svg>