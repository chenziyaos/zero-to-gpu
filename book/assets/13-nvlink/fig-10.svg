<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">NVLink 域：8 卡、72 卡、最多 256 卡</text>
<text x="40" y="92" font-size="14" fill="#646A73">域的聚合带宽用来比规模，估算通信时间用每卡每方向带宽</text>
