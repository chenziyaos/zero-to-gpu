<rect x="320" y="300" width="760" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="1088" y="315" font-size="13" fill="#646A73">216 TB/s</text>
<rect x="40" y="360" width="1120" height="73" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="389" font-size="15" fill="#1F2329">每卡视角：H100 900 GB/s，NVLink 5 是 1,800 GB/s，都是双向合计。NVLink Switch System 是 32 个节点、2:1 收敛的胖树，57.6 TB/s 指</text>
<text x="56" y="413" font-size="15" fill="#1F2329">all-to-all 带宽。</text>
<text x="40" y="476" font-size="12" fill="#646A73">来源：NVIDIA NVLink 产品页；GB300 NVL72 产品页；Hopper Architecture In-Depth</text>
