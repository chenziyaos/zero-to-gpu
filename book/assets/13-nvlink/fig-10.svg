<rect x="320" y="174" width="25" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="353" y="189" font-size="13" fill="#646A73">7.2 TB/s</text>
<text x="308" y="231" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">H100 + NVLink Switch · 256 卡</text>
<rect x="320" y="216" width="760" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
