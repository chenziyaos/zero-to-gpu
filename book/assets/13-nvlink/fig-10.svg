<rect x="320" y="258" width="760" height="20" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="320" y="258" width="457" height="20" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="785" y="273" font-size="13" fill="#646A73">130 TB/s</text>
<text x="308" y="315" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">NVLink 6 NVL72（初步）</text>
