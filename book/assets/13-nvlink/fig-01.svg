<text x="302" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="321" y="181" font-size="18" fill="#1F2329" font-weight="bold">读拓扑</text>
<text x="289" y="211" font-size="14" fill="#646A73">topo -m、nvlink -s、</text>
<text x="289" y="234" font-size="14" fill="#646A73">PCIe 回退（第 4、5</text>
<text x="289" y="257" font-size="14" fill="#646A73">章）</text>
<polyline points="468,214 500,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="490,208 500,214 490,220" fill="#8F959E"/>
