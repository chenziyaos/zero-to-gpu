<text x="1000" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">5</text>
<text x="1019" y="181" font-size="18" fill="#1F2329" font-weight="bold">划边界</text>
<text x="987" y="211" font-size="14" fill="#646A73">8 卡、72 卡、256 卡</text>
<text x="987" y="234" font-size="14" fill="#646A73">的 NVLink 域（第 9</text>
<text x="987" y="257" font-size="14" fill="#646A73">章）</text>
<rect x="40" y="318" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="346" font-size="15" fill="#1F2329">8 卡 H100：每卡 NVLink 900 GB/s 是双向合计，每方向 450 GB/s；all-reduce 的 busbw 上限 450 GB/s，algbw 上限约 257 GB/s。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：NVIDIA Hopper Architecture In-Depth；NVLink 产品页；nvidia-smi 文档；nccl-tests PERFORMANCE.md；Fabric Manager User Guide</text>
</svg>