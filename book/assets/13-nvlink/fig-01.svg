<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">定上限</text>
<text x="56" y="211" font-size="14" fill="#646A73">每卡每方向带宽，</text>
<text x="56" y="234" font-size="14" fill="#646A73">NVSwitch 聚合（第 1</text>
<text x="56" y="257" font-size="14" fill="#646A73">到 3 章）</text>
<polyline points="235,214 267,214" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="257,208 267,214 257,220" fill="#8F959E"/>
