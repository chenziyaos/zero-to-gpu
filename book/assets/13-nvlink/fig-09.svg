<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect x="0" y="0" width="1200" height="480" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">NVSwitch 机器：作业之前先确认 fabric 就绪</text>
<text x="40" y="92" font-size="14" fill="#646A73">H100 起链路由硬件训练，但每块 GPU 仍要向 fabric 注册</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">FM 启动</text>
<text x="56" y="211" font-size="14" fill="#646A73">systemctl start</text>
<text x="56" y="234" font-size="14" fill="#646A73">nvidia-fabricmanager</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">链路训练</text>
<text x="347" y="211" font-size="14" fill="#646A73">H100 起在 GPU 和 NVSwitch</text>
<text x="347" y="234" font-size="14" fill="#646A73">硬件层完成</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">GPU 注册</text>
<text x="638" y="211" font-size="14" fill="#646A73">Fabric State：In Progress</text>
<text x="638" y="234" font-size="14" fill="#646A73">→ Completed</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">作业启动</text>
<text x="929" y="211" font-size="14" fill="#646A73">过早启动报</text>
<text x="929" y="234" font-size="14" fill="#646A73">cudaErrorSystemNotReady</text>
<rect x="40" y="290" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="319" font-size="15" fill="#1F2329">停掉 FM 会丢失 fabric 状态，重启后要重置 fabric 里的全部 GPU。最低驱动：HGX H100 为 525 系列，HGX B200 / B300 为 570 系列。</text>
<rect x="40" y="364" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="393" font-size="15" fill="#1F2329">NVLS：第三代 NVSwitch 加 Hopper 及以后的 GPU；NCCL_NVLS_ENABLE 默认 2，同卡多 rank 时被静默关闭。</text>
<text x="40" y="456" font-size="12" fill="#646A73">来源：NVIDIA Fabric Manager User Guide；NCCL Environment Variables</text>
</svg>