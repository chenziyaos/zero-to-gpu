<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">机内两条路：NVLink 是 PCIe Gen5 的 7 倍</text>
<text x="40" y="92" font-size="14" fill="#646A73">厂商口径，双向合计；环形通信按最慢的一跳走</text>
<text x="268" y="178" font-size="14" fill="#1F2329" text-anchor="end">H100 NVLink（18 条）</text>
<rect x="280" y="160" width="666" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="160" width="666" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="954" y="178" font-size="13" fill="#646A73">900 GB/s  双向合计</text>
<text x="268" y="220" font-size="14" fill="#1F2329" text-anchor="end">PCIe Gen5 x16</text>
<rect x="280" y="202" width="666" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="202" width="93" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="381" y="220" font-size="13" fill="#646A73">126 GB/s  每方向 63，双向合计</text>
<rect x="40" y="268" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="297" font-size="15" fill="#1F2329">八卡做 all-reduce 时，只要环上有一跳走 PCIe，整个环都按这一跳的速度走（第 5 章）。所以机内通信的下限看最慢的路径。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：NVIDIA Hopper Architecture In-Depth（900 GB/s，PCIe Gen5 的 7 倍）；Wikipedia, PCI Express（Gen5 x16 每方向约 63 GB/s）</text>
</svg>