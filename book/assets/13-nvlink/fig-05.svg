<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<rect x="0" y="0" width="1200" height="560" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">topo -m：GPU 之间应该全是 NV#</text>
<text x="40" y="92" font-size="14" fill="#646A73">标记从快到慢排列；出现 PIX 以下就是走 PCIe</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">标记</text>
<text x="202" y="166" font-size="14" fill="#1F2329" font-weight="bold">含义</text>
<text x="817" y="166" font-size="14" fill="#1F2329" font-weight="bold">对卡间通信</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">NV#</text>
<text x="202" y="206" font-size="14" fill="#1F2329">经过 # 条绑定的 NVLink</text>
<text x="817" y="206" font-size="14" fill="#1F2329">NVLink，最快</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">PIX</text>
<text x="202" y="244" font-size="14" fill="#1F2329">经过一个 PCIe 交换芯片</text>
<text x="817" y="244" font-size="14" fill="#1F2329">PCIe</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">PXB</text>
<text x="202" y="282" font-size="14" fill="#1F2329">经过多个 PCIe 交换芯片，不经过主桥</text>
<text x="817" y="282" font-size="14" fill="#1F2329">PCIe，多一跳</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">PHB</text>
<text x="202" y="320" font-size="14" fill="#1F2329">经过 PCIe 和一个 PCIe 主桥（通常是 CPU）</text>
<text x="817" y="320" font-size="14" fill="#1F2329">流量过 CPU</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">NODE</text>
<text x="202" y="358" font-size="14" fill="#1F2329">经过同一 NUMA 节点内 PCIe 主桥之间的互连</text>
<text x="817" y="358" font-size="14" fill="#1F2329">同 CPU 跨主桥</text>
<rect x="40" y="372" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="396" font-size="14" fill="#1F2329" font-weight="bold">SYS</text>
<text x="202" y="396" font-size="14" fill="#1F2329">经过 NUMA 节点之间的 SMP 互连（QPI/UPI）</text>
<text x="817" y="396" font-size="14" fill="#1F2329">跨 CPU，最慢</text>
<rect x="40" y="446" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="475" font-size="15" fill="#1F2329">还要看链路是否在线：nvidia-smi nvlink -s；程序侧用 cudaDeviceCanAccessPeer() 判断，再用 cudaDeviceEnablePeerAccess() 打开。</text>
<text x="40" y="536" font-size="12" fill="#646A73">来源：NVIDIA nvidia-smi 文档（topo -m 图例）</text>
</svg>