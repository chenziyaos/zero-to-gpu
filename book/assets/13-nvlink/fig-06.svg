<svg xmlns="http://www.w3.org/2000/svg"
     width="1240"
     height="770"
     viewBox="-20 -20 1240 770">
<g id="o3:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="730" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a3:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">环形 all-reduce 的两阶段通信</tspan></tspan></text></g>
<g id="a3:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">Reduce-Scatter（N-1 轮，相加后转发）→ All-Gather（N-1 轮，纯转发）</tspan></tspan></text></g>
<g id="o3:2" transform="translate(40, 170)"><rect x="0" y="0" width="550" height="150" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a3:3" transform="translate(56, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">阶段 1 · Reduce-Scatter（轮次 1~N-1）</tspan></tspan></text></g>
<g id="a3:4" transform="translate(56, 212.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每轮：GPU 接收上游分片 → 与本地分片相加 → 转发给下游</tspan></tspan></text></g>
<g id="a3:5" transform="translate(56, 234.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">8 卡共 7 轮后，每卡持有一份"部分和"</tspan></tspan></text></g>
<g id="a3:6" transform="translate(56, 256.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">数据量：每轮 D/N</tspan></tspan></text></g>
<g id="o3:3" transform="translate(610, 170)"><rect x="0" y="0" width="550" height="150" fill="#e4fae1" stroke="#8ee085" stroke-width="1" rx="12" ry="12"/></g>
<g id="a3:7" transform="translate(626, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">阶段 2 · All-Gather（轮次 N~2N-2）</tspan></tspan></text></g>
<g id="a3:8" transform="translate(626, 212.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每轮：GPU 接收上游已聚合分片 → 直接转发</tspan></tspan></text></g>
<g id="a3:9" transform="translate(626, 234.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">8 卡再 7 轮后，每卡持有完整结果</tspan></tspan></text></g>
<g id="a3:10" transform="translate(626, 256.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">数据量：每轮同样 D/N</tspan></tspan></text></g>
<g id="o3:4" transform="translate(40, 360)"><rect x="0" y="0" width="1120" height="190" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a3:11" transform="translate(56, 371.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">时间与两列带宽的换算</tspan></tspan></text></g>
<g id="a3:12" transform="translate(56, 402.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">总轮次 2(N-1)，每轮发送 D/N 字节：t = 2(N-1) × D / (N × B)</tspan></tspan></text></g>
<g id="a3:13" transform="translate(56, 424.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">algbw = D / t（应用视角带宽）</tspan></tspan></text></g>
<g id="a3:14" transform="translate(56, 446.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">busbw = algbw × 2(N-1)/N（硬件视角带宽，反映链路实际负载）</tspan></tspan></text></g>
<g id="a3:15" transform="translate(56, 468.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">例：8 卡 H100、D=1 GB → t ≈ 3.9 ms，algbw ≈ 257 GB/s，busbw ≈ 450 GB/s</tspan></tspan></text></g>
<g id="o3:5" transform="translate(40, 590)"><rect x="0" y="0" width="1120" height="82" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a3:16" transform="translate(56, 599.823)"><text font-size="18" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">口径约定</tspan></tspan></text></g>
<g id="a3:17" transform="translate(56, 633.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">nccl-tests 输出的 busbw 与 B（链路带宽）直接可比；本篇约定 busbw ≥ 80%× B 即 PASS</tspan></tspan></text></g>
<g id="a3:18" transform="translate(40, 691.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：Patarasuk &amp; Yuan (JPDC 2009)；本篇 sim_nvlink.py</tspan></tspan></text></g>
</svg>