<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">两个工具分工：nvbandwidth 测卡对，nccl-tests 测集合通信</text>
<text x="40" y="92" font-size="14" fill="#646A73">验收带宽看大消息；小消息的时间主要是固定开销</text>
<rect x="40" y="140" width="548" height="150" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">nvbandwidth</text>
<text x="56" y="201" font-size="14" fill="#646A73">CE 拷贝：memcpy，拷贝引擎执行</text>
<text x="56" y="224" font-size="14" fill="#646A73">SM 拷贝：kernel，SM 执行</text>
<text x="56" y="247" font-size="14" fill="#646A73">nvbandwidth -p device_to_device</text>
<text x="56" y="270" font-size="14" fill="#646A73">输出 GPU 两两之间的带宽矩阵</text>
<rect x="612" y="140" width="548" height="150" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">nccl-tests（all_reduce_perf 等）</text>
<text x="628" y="201" font-size="14" fill="#646A73">扫描一组消息大小</text>
<text x="628" y="224" font-size="14" fill="#646A73">输出时间、algbw、busbw</text>
<text x="628" y="247" font-size="14" fill="#646A73">小消息看延迟</text>
<text x="628" y="270" font-size="14" fill="#646A73">大消息看带宽</text>
<rect x="40" y="326" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="355" font-size="15" fill="#1F2329">矩阵里某一格明显偏低，对照 topo -m 找这对卡；集合通信的 busbw 和每方向链路带宽比（第 7 章）。</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：NVIDIA nvbandwidth（GitHub）；nccl-tests PERFORMANCE.md</text>
</svg>