<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect x="0" y="0" width="1200" height="460" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">NVSwitch：任意两卡都用满自己的 NVLink</text>
<text x="40" y="92" font-size="14" fill="#646A73">交换底座的聚合带宽 = 每卡带宽 × 卡数</text>
<rect x="40" y="140" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">DGX H100</text>
<text x="56" y="201" font-size="14" fill="#646A73">4 颗第三代 NVSwitch</text>
<text x="56" y="224" font-size="14" fill="#646A73">每卡 900 GB/s</text>
<text x="56" y="247" font-size="14" fill="#646A73">8 × 900 GB/s = 7.2 TB/s</text>
<rect x="612" y="140" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">DGX B200</text>
<text x="628" y="201" font-size="14" fill="#646A73">2 颗第五代 NVLink 交换芯片</text>
<text x="628" y="224" font-size="14" fill="#646A73">每卡 1,800 GB/s</text>
<text x="628" y="247" font-size="14" fill="#646A73">8 × 1,800 GB/s = 14.4 TB/s</text>
<rect x="40" y="298" width="1120" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="329" font-size="18" fill="#1F2329" font-weight="bold">第三代 NVSwitch（H100 一代）</text>
<text x="56" y="359" font-size="14" fill="#646A73">每颗 64 个 NVLink4 端口，交换吞吐 13.6 Tbit/s（上一代 7.2 Tbit/s）</text>
<text x="56" y="382" font-size="14" fill="#646A73">组播和 SHARP 网内规约：加速 all_gather、reduce_scatter，最多 2 倍吞吐</text>
<text x="40" y="436" font-size="12" fill="#646A73">来源：DGX H100 / DGX B200 User Guide；NVLink 产品页；Hopper Architecture In-Depth</text>
</svg>