<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">挂死排查：按症状选工具，找到落后的那个 rank</text>
<text x="40" y="92" font-size="14" fill="#646A73">PyTorch 对 NCCL 默认 10 分钟超时，之后异步中止并崩溃</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">症状</text>
<text x="271" y="166" font-size="14" fill="#1F2329" font-weight="bold">工具</text>
<text x="790" y="166" font-size="14" fill="#1F2329" font-weight="bold">看什么</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">初始化卡住</text>
<text x="271" y="206" font-size="14" fill="#1F2329">NCCL_DEBUG=INFO，SUBSYS=INIT,BOOTSTRAP,NET</text>
<text x="790" y="206" font-size="14" fill="#1F2329">bootstrap、网卡选择、rank 同步</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">运行中卡住</text>
<text x="271" y="244" font-size="14" fill="#1F2329">NCCL RAS（2.24 起，本机 28028 端口，ncclras）</text>
<text x="790" y="244" font-size="14" fill="#1F2329">无响应的进程</text>
<rect x="40" y="258" width="1120" height="60" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">超时崩溃</text>
<text x="271" y="282" font-size="14" fill="#1F2329">Flight Recorder：TRACE_BUFFER_SIZE（默认 2000）、</text>
<text x="271" y="304" font-size="14" fill="#1F2329">DUMP_ON_TIMEOUT，fr_trace.py</text>
<text x="790" y="282" font-size="14" fill="#1F2329">各 rank 最后完成和卡住的调用</text>
<rect x="40" y="354" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="383" font-size="15" fill="#1F2329">多数 rank 卡在第 N 次、某个 rank 停在第 N − 1 次：问题在这个 rank。调大 timeout 只会卡得更久。</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：NCCL 文档（Logging、RAS）；PyTorch Flight Recorder 教程；torch.distributed 文档</text>
</svg>