<text x="56" y="367" font-size="15" fill="#1F2329">T = 2(n − 1)(α + S/(nB))：小消息看 α，大消息看 B。8 卡 algbw 上限 450 × 8/14 ≈ 257 GB/s。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：sim_collective.py 实跑输出（alpha-beta 模型，每步延迟 1 微秒）；nccl-tests PERFORMANCE.md</text>
