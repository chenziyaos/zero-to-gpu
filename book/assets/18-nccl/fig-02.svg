<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">NCCL 的三层选择：算法、协议、传输</text>
<text x="40" y="92" font-size="14" fill="#646A73">算法的可选项随版本增加</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">层</text>
<text x="216" y="166" font-size="14" fill="#1F2329" font-weight="bold">可选项</text>
<text x="762" y="166" font-size="14" fill="#1F2329" font-weight="bold">决定什么</text>
<rect x="40" y="182" width="1120" height="60" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">算法</text>
<text x="216" y="206" font-size="14" fill="#1F2329">Ring、Tree（2.5）；CollnetChain、CollnetDirect（2.14）；NVLS（2.17）；</text>
<text x="216" y="228" font-size="14" fill="#1F2329">NVLSTree（2.18）；PAT（2.23）</text>
<text x="762" y="206" font-size="14" fill="#1F2329">路线和步数</text>
<rect x="40" y="242" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="266" font-size="14" fill="#1F2329" font-weight="bold">协议</text>
<text x="216" y="266" font-size="14" fill="#1F2329">Simple、LL、LL128</text>
<text x="762" y="266" font-size="14" fill="#1F2329">每跳的同步方式、带宽折扣、延迟</text>
<rect x="40" y="280" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="304" font-size="14" fill="#1F2329" font-weight="bold">传输</text>
<text x="216" y="304" font-size="14" fill="#1F2329">机内 P2P、SHM、NVLS；跨机 NET（IB、RoCE、Socket）、COLLNET</text>
<text x="762" y="304" font-size="14" fill="#1F2329">物理通道</text>
<rect x="40" y="354" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="383" font-size="15" fill="#1F2329">协议在运行时按 NCCL_PROTO、算法和内部性能模型选择；先看 TUNING 日志知道它选了什么。</text>
<text x="40" y="446" font-size="12" fill="#646A73">来源：NCCL 文档（NCCL_ALGO、NCCL_PROTO）；Demystifying NCCL 表 II</text>
</svg>