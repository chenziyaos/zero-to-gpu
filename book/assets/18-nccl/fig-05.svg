<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">三种协议：用带宽换延迟</text>
<text x="40" y="92" font-size="14" fill="#646A73">论文给出的带宽利用率和每跳延迟量级</text>
<rect x="40" y="140" width="357" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">Simple</text>
<text x="56" y="201" font-size="14" fill="#646A73">内存栅栏同步</text>
<text x="56" y="224" font-size="14" fill="#646A73">带宽接近峰值</text>
<text x="56" y="247" font-size="14" fill="#646A73">每跳约 6 微秒</text>
<rect x="421" y="140" width="357" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="437" y="171" font-size="18" fill="#1F2329" font-weight="bold">LL</text>
<text x="437" y="201" font-size="14" fill="#646A73">4 字节数据 + 4 字节标志</text>
<text x="437" y="224" font-size="14" fill="#646A73">带宽 25% 到 50%</text>
<text x="437" y="247" font-size="14" fill="#646A73">每跳约 1 微秒</text>
<rect x="803" y="140" width="357" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="171" font-size="18" fill="#1F2329" font-weight="bold">LL128</text>
<text x="819" y="201" font-size="14" fill="#646A73">120 字节数据 + 8 字节标志</text>
<text x="819" y="224" font-size="14" fill="#646A73">带宽约 95%</text>
<text x="819" y="247" font-size="14" fill="#646A73">每跳约 2 微秒</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">LL128 需要 128 字节原子写不被拆分或重排；平台不保证时 NCCL 禁用它。强行打开可能损坏数据。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：Demystifying NCCL 论文表 I；NCCL 文档（NCCL_PROTO）</text>
</svg>