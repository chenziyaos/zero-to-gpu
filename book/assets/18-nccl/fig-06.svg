<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">NVLS 与 CollNet：把规约交给交换机</text>
<text x="40" y="92" font-size="14" fill="#646A73">主要加速 AllReduce；NVLS 也支持 ReduceScatter 和 AllGather</text>
<rect x="40" y="140" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="171" font-size="18" fill="#1F2329" font-weight="bold">NVLS（2.17 起）</text>
<text x="56" y="201" font-size="14" fill="#646A73">机内规约在 NVSwitch 完成</text>
<text x="56" y="224" font-size="14" fill="#646A73">第三代 NVSwitch，Hopper 及以后</text>
<text x="56" y="247" font-size="14" fill="#646A73">组播加规约最多 2 倍吞吐</text>
<rect x="612" y="140" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="171" font-size="18" fill="#1F2329" font-weight="bold">CollNet（2.14 起）</text>
<text x="628" y="201" font-size="14" fill="#646A73">规约卸载到支持 SHARP 的网络交换机</text>
<text x="628" y="224" font-size="14" fill="#646A73">Chain：沿链规约再广播</text>
<text x="628" y="247" font-size="14" fill="#646A73">Direct：机内 all-to-all</text>
<rect x="40" y="304" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="332" font-size="15" fill="#1F2329">NCCL_NVLS_ENABLE 默认 2：不支持时不报错；同一张卡上有多个 rank 时 NVLS 被静默关闭。看初始化日志确认。</text>
<text x="40" y="396" font-size="12" fill="#646A73">来源：NCCL 文档（NCCL_ALGO、NCCL_NVLS_ENABLE）；Demystifying NCCL；Hopper Architecture In-Depth</text>
</svg>