<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">CuTe 布局：坐标到索引的函数，加一套可组合的运算</text>
<text x="40" y="92" font-size="14" fill="#646A73">例子：Shape (4,2)、Stride (1,4) 是 4 × 2 的列主序矩阵，坐标 (i, j) 映射到 i × 1 + j × 4</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold">运算</text>
<text x="296" y="166" font-size="14" fill="#1F2329" font-weight="bold">做什么</text>
<text x="770" y="166" font-size="14" fill="#1F2329" font-weight="bold">用在哪</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">composition</text>
<text x="296" y="206" font-size="14" fill="#1F2329">把一个布局当作从另一个布局里挑坐标的函数</text>
<text x="770" y="206" font-size="14" fill="#1F2329">其余运算的基础</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">complement</text>
<text x="296" y="244" font-size="14" fill="#1F2329">找出一个布局没碰到的元素，表示成另一个布局</text>
<text x="770" y="244" font-size="14" fill="#1F2329">块与块之间怎么排</text>
<rect x="40" y="258" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">logical_divide</text>
<text x="296" y="282" font-size="14" fill="#1F2329">把 A 按 B 拆成两个 mode：B 指到的，和其余的</text>
<text x="770" y="282" font-size="14" fill="#1F2329">把数据按线程、按块划分</text>
<rect x="40" y="296" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="320" font-size="14" fill="#1F2329" font-weight="bold">logical_product</text>
<text x="296" y="320" font-size="14" fill="#1F2329">第一个 mode 是 A，第二个按 B 复制 A</text>
<text x="770" y="320" font-size="14" fill="#1F2329">从小块拼出大块</text>
<rect x="40" y="334" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="358" font-size="14" fill="#1F2329" font-weight="bold">Swizzle</text>
<text x="296" y="358" font-size="14" fill="#1F2329">索引的一段位与另一段位异或</text>
<text x="770" y="358" font-size="14" fill="#1F2329">把共享内存地址打散到不同 bank</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：NVIDIA CUTLASS 文档 CuTe Layouts、CuTe Layout Algebra；CUTLASS 源码 include/cute/swizzle.hpp</text>
</svg>