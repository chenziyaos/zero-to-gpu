<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">三层写法的分工：从左到右，交给编译器和库的越多</text>
<text x="40" y="92" font-size="14" fill="#646A73">同一个矩阵乘，各项决定由谁来做</text>
<rect x="40" y="140" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="166" font-size="14" fill="#1F2329" font-weight="bold"></text>
<text x="250" y="166" font-size="14" fill="#1F2329" font-weight="bold">手写 CUDA</text>
<text x="540" y="166" font-size="14" fill="#1F2329" font-weight="bold">Triton</text>
<text x="829" y="166" font-size="14" fill="#1F2329" font-weight="bold">CUTLASS / CuTe DSL</text>
<rect x="40" y="182" width="1120" height="38" rx="0" fill="#F0F4FF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="206" font-size="14" fill="#1F2329" font-weight="bold">分块的单位</text>
<text x="250" y="206" font-size="14" fill="#1F2329">线程：写一个线程做什么</text>
<text x="540" y="206" font-size="14" fill="#1F2329">程序：一个实例处理一整块</text>
<text x="829" y="206" font-size="14" fill="#1F2329">布局：用 Shape 和 Stride 描述</text>
<rect x="40" y="220" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="244" font-size="14" fill="#1F2329" font-weight="bold">共享内存与同步</text>
<text x="250" y="244" font-size="14" fill="#1F2329">自己分配、自己同步</text>
<text x="540" y="244" font-size="14" fill="#1F2329">编译器决定</text>
<text x="829" y="244" font-size="14" fill="#1F2329">显式，用布局和流水部件组装</text>
<rect x="40" y="258" width="1120" height="60" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="282" font-size="14" fill="#1F2329" font-weight="bold">流水与 warp 分工</text>
<text x="250" y="282" font-size="14" fill="#1F2329">自己写</text>
<text x="540" y="282" font-size="14" fill="#1F2329">num_stages、num_warps 交给</text>
<text x="540" y="304" font-size="14" fill="#1F2329">autotune</text>
<text x="829" y="282" font-size="14" fill="#1F2329">选 kernel 调度，如 warp 特化</text>
<rect x="40" y="318" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="342" font-size="14" fill="#1F2329" font-weight="bold">Tensor Core 指令</text>
<text x="250" y="342" font-size="14" fill="#1F2329">自己选、自己排寄存器</text>
<text x="540" y="342" font-size="14" fill="#1F2329">编译器按架构选</text>
<text x="829" y="342" font-size="14" fill="#1F2329">MMA 原子，用布局描述寄存器排布</text>
<rect x="40" y="356" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="380" font-size="14" fill="#1F2329" font-weight="bold">换一代架构</text>
<text x="250" y="380" font-size="14" fill="#1F2329">多数决定要重做</text>
<text x="540" y="380" font-size="14" fill="#1F2329">升级 Triton、重新 autotune</text>
<text x="829" y="380" font-size="14" fill="#1F2329">换对应架构的调度和原子</text>
<rect x="40" y="430" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="459" font-size="15" fill="#1F2329">Triton 文档的概括：CUDA 是标量程序、分块线程；Triton 是分块程序、标量线程。</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：Triton 文档 Introduction 与矩阵乘教程；NVIDIA CUTLASS 文档（GEMM API 3.x、CuTe Layouts、CUTLASS Python）</text>
</svg>