<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">CUTLASS 3.x 的 GEMM 分四层，定制通常只改其中一层</text>
<text x="40" y="92" font-size="14" fill="#646A73">从主机接口到单条指令；接口按 GEMM 算法结构组织，不绑定某一代 GPU</text>
<rect x="40" y="150" width="247" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">Device</text>
<text x="56" y="211" font-size="14" fill="#646A73">主机侧启动 kernel、管理参数</text>
<polyline points="293,215 325,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,209 325,215 315,221" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="347" y="181" font-size="18" fill="#1F2329" font-weight="bold">Kernel</text>
<text x="347" y="211" font-size="14" fill="#646A73">把 collective 排到各个输出</text>
<text x="347" y="234" font-size="14" fill="#646A73">块上</text>
<polyline points="584,215 616,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,209 616,215 606,221" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="130" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="638" y="181" font-size="18" fill="#1F2329" font-weight="bold">Collective</text>
<text x="638" y="211" font-size="14" fill="#646A73">块内主循环与尾声；可按 warp</text>
<text x="638" y="234" font-size="14" fill="#646A73">分角色</text>
<polyline points="875,215 907,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,209 907,215 897,221" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="929" y="181" font-size="18" fill="#1F2329" font-weight="bold">Tiled MMA / Copy</text>
<text x="929" y="207" font-size="18" fill="#1F2329" font-weight="bold">Atom</text>
<text x="929" y="237" font-size="14" fill="#646A73">单条 Tensor Core 指令与拷贝，</text>
<text x="929" y="260" font-size="14" fill="#646A73">用布局描述</text>
<rect x="40" y="320" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="349" font-size="15" fill="#1F2329">CUTLASS 4.x 的 CuTe DSL 用 Python 写同一套概念：@jit 写主机侧函数，@kernel 写 GPU kernel，重复调用复用编译缓存。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：NVIDIA CUTLASS 文档 CUTLASS 3.0 GEMM API、CUTLASS 3.0 Design、CUTLASS Python Overview</text>
</svg>