<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">FlashAttention 三代：同一个算子，利用率从 40% 以下到 75%</text>
<text x="40" y="92" font-size="14" fill="#646A73">占理论峰值的比例，%；区间画上限</text>
<text x="228" y="168" font-size="14" fill="#1F2329" text-anchor="end">FA-1</text>
<rect x="240" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="150" width="280" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="528" y="168" font-size="13" fill="#646A73">40%  25% 到 40%</text>
<text x="228" y="210" font-size="14" fill="#1F2329" text-anchor="end">FA-2 · A100</text>
<rect x="240" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="192" width="511" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="759" y="210" font-size="13" fill="#646A73">73%  50% 到 73%</text>
<text x="228" y="252" font-size="14" fill="#1F2329" text-anchor="end">FA-2 · H100</text>
<rect x="240" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="234" width="245" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="493" y="252" font-size="13" fill="#646A73">35%  没用上 TMA 与 warp 特化</text>
<text x="228" y="294" font-size="14" fill="#1F2329" text-anchor="end">FA-3 · H100 FP16</text>
<rect x="240" y="276" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="240" y="276" width="525" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="773" y="294" font-size="13" fill="#646A73">75%  740 TFLOPs/s</text>
<rect x="40" y="338" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="367" font-size="15" fill="#1F2329">第二代改的是工作划分，第三代用上了 Hopper 的异步硬件；740 ÷ 989.5 ≈ 74.8%，与论文的 75% 一致。</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Dao, FlashAttention-2；Shah et al., FlashAttention-3（两篇论文摘要）</text>
</svg>