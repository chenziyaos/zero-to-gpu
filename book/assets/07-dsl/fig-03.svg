<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550">
<rect x="0" y="0" width="1200" height="550" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Triton 的一个程序实例：拿块号、成块读、成块算、成块写</text>
<text x="40" y="92" font-size="14" fill="#646A73">矩阵乘里每个程序实例负责输出 C 的一块，沿 K 维循环累加</text>
<rect x="40" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">tl.program_id</text>
<text x="56" y="211" font-size="14" fill="#646A73">知道自己是第几块</text>
<polyline points="293,202 325,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,196 325,202 315,208" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">tl.load + mask</text>
<text x="347" y="211" font-size="14" fill="#646A73">读 A、B 各一块，越界部分屏蔽</text>
<polyline points="584,202 616,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,196 616,202 606,208" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">tl.dot</text>
<text x="638" y="211" font-size="14" fill="#646A73">块级矩阵乘，累加到</text>
<text x="638" y="234" font-size="14" fill="#646A73">accumulator</text>
<polyline points="875,202 907,202" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,196 907,202 897,208" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">tl.store</text>
<text x="929" y="211" font-size="14" fill="#646A73">把 C 的这一块写回</text>
<rect x="40" y="294" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="326" font-size="18" fill="#1F2329" font-weight="bold">你决定</text>
<text x="56" y="356" font-size="14" fill="#646A73">块大小、块的处理顺序（GROUP_SIZE_M）</text>
<text x="56" y="379" font-size="14" fill="#646A73">候选配置和 autotune 的 key</text>
<rect x="612" y="294" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="326" font-size="18" fill="#1F2329" font-weight="bold">编译器决定</text>
<text x="628" y="356" font-size="14" fill="#646A73">块内线程分工、是否经共享内存</text>
<text x="628" y="379" font-size="14" fill="#646A73">按目标架构选 Tensor Core 指令</text>
<rect x="40" y="435" width="1120" height="49" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="464" font-size="15" fill="#1F2329">autotune 的 key 一变，所有候选配置重测一遍；线上服务要离线调好常见形状。</text>
<text x="40" y="526" font-size="12" fill="#646A73">来源：Triton 文档 Tutorial: Matrix Multiplication；Introduction</text>
</svg>