<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">一个算子该停在哪一层：能往上就不往下</text>
<text x="40" y="92" font-size="14" fill="#646A73">从上往下逐级判断；每下一层，要你自己负责的事情就多一层</text>
<rect x="40" y="150" width="247" height="130" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">厂商库</text>
<text x="56" y="211" font-size="14" fill="#646A73">cuBLAS、cuDNN 直接满足就不写</text>
<polyline points="293,215 325,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,209 325,215 315,221" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="130" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">Triton</text>
<text x="347" y="211" font-size="14" fill="#646A73">要融合或改块调度；线程、共享内</text>
<text x="347" y="234" font-size="14" fill="#646A73">存交给编译器</text>
<polyline points="584,215 616,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,209 616,215 606,221" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="130" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">CUTLASS / CuTe</text>
<text x="670" y="207" font-size="18" fill="#1F2329" font-weight="bold">DSL</text>
<text x="638" y="237" font-size="14" fill="#646A73">要控制 warp 特化、TMA、</text>
<text x="638" y="260" font-size="14" fill="#646A73">Tensor Core 指令</text>
<polyline points="875,215 907,215" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,209 907,215 897,221" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="130" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">手写 CUDA</text>
<text x="929" y="211" font-size="14" fill="#646A73">以上都表达不了时</text>
<rect x="40" y="320" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="349" font-size="15" fill="#1F2329">比较时用同一把尺子：稠密口径的峰值，或同卡同形状的 cuBLAS；先校验结果，再比吞吐。</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：本篇第 1 至 9 章；Triton 文档；NVIDIA CUTLASS 文档</text>
</svg>