<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">算前 9 个输出块：行优先读 90 块，分组顺序只读 54 块</text>
<text x="40" y="92" font-size="14" fill="#646A73">A、B 各 9 × 9 个块时，算出前 9 个输出块要读进 SRAM 的块数</text>
<text x="208" y="168" font-size="14" fill="#1F2329" text-anchor="end">行优先顺序</text>
<rect x="220" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="150" width="700" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="928" y="168" font-size="13" fill="#646A73">90 块</text>
<text x="208" y="210" font-size="14" fill="#1F2329" text-anchor="end">分组顺序</text>
<rect x="220" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="192" width="420" height="26" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="648" y="210" font-size="13" fill="#646A73">54 块</text>
<rect x="40" y="254" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="283" font-size="15" fill="#1F2329">教程报告这在某些架构上快 10% 以上，例如 A100 上 220 → 245 TFLOPS。配置还要放得下：H100 单个线程块最多 227 KB 共享内存，静态分配限 48 KB。</text>
<text x="40" y="376" font-size="12" fill="#646A73">来源：Triton 文档 Tutorial: Matrix Multiplication（L2 Cache Optimizations）；NVIDIA Hopper Tuning Guide</text>
</svg>