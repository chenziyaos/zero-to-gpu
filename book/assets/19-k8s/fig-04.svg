<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">DRA 补上了设备属性和共享，抢占还不支持</text>
<text x="40" y="92" font-size="14" fill="#646A73">DRA 在 v1.30 首次提供，自 v1.35 起稳定</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">能力</text>
<text x="317" y="176" font-size="14" fill="#1F2329" font-weight="bold">设备插件</text>
<text x="745" y="176" font-size="14" fill="#1F2329" font-weight="bold">DRA</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">请求方式</text>
<text x="317" y="216" font-size="14" fill="#1F2329">逐个容器请求一个整数</text>
<text x="745" y="216" font-size="14" fill="#1F2329">ResourceClaim 引用 DeviceClass</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">按属性过滤</text>
<text x="317" y="254" font-size="14" fill="#1F2329">不支持，靠节点标签间接表达</text>
<text x="745" y="254" font-size="14" fill="#1F2329">CEL 按设备属性过滤</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">共享</text>
<text x="317" y="292" font-size="14" fill="#1F2329">不支持（time-slicing 是插件私有配置）</text>
<text x="745" y="292" font-size="14" fill="#1F2329">多个 Pod 引用同一个 claim</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">设备信息来源</text>
<text x="317" y="330" font-size="14" fill="#1F2329">ListAndWatch 上报计数</text>
<text x="745" y="330" font-size="14" fill="#1F2329">驱动发布 ResourceSlice</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">调度器抢占</text>
<text x="317" y="368" font-size="14" fill="#1F2329">支持</text>
<text x="745" y="368" font-size="14" fill="#1F2329">不支持</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：Kubernetes 文档（Dynamic Resource Allocation、Device Plugins）</text>
</svg>