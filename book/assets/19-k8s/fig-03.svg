<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">设备插件：GPU 进入调度器时只剩一个整数</text>
<text x="40" y="92" font-size="14" fill="#646A73">注册、上报、调度、分配四步；型号、拓扑、共享都不在这个整数里</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">注册</text>
<text x="56" y="211" font-size="14" fill="#646A73">kubelet.sock</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">上报</text>
<text x="347" y="211" font-size="14" fill="#646A73">ListAndWatch</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">调度</text>
<text x="638" y="211" font-size="14" fill="#646A73">按计数找节点</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">分配</text>
<text x="929" y="211" font-size="14" fill="#646A73">Allocate</text>
<rect x="40" y="262" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">写法限制</text>
<text x="56" y="323" font-size="14" fill="#646A73">只写在 limits；两者都写时必须相等</text>
<text x="56" y="346" font-size="14" fill="#646A73">只能是整数，不能超卖</text>
<text x="56" y="369" font-size="14" fill="#646A73">设备不能在容器间共享</text>
<rect x="612" y="262" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="628" y="293" font-size="18" fill="#1F2329" font-weight="bold">GPU Operator 管的组件</text>
<text x="628" y="323" font-size="14" fill="#646A73">驱动、设备插件、Container Toolkit</text>
<text x="628" y="346" font-size="14" fill="#646A73">GFD 节点标签、DCGM 监控</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Kubernetes 文档（Device Plugins、Schedule GPUs）；NVIDIA GPU Operator 文档</text>
</svg>