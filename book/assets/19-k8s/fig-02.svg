<g id="a2:22" transform="translate(56, 633.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">维度扩展：单一 → 多维度（拓扑、架构、显存、MIG），调度从"贪心装箱"升级为"精确决策"</tspan></tspan></text></g>
