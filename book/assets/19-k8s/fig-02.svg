<g id="a2:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">从无属性的"GPU 计数"（黑盒）到有属性的"结构化参数"，调度器能力升级</tspan></tspan></text></g>
<g id="o2:2" transform="translate(40, 170)"><rect x="0" y="0" width="540" height="380" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
