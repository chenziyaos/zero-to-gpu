<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect x="0" y="0" width="1200" height="460" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">Philly：已分配的 GPU 约 47.7% 周期被浪费，16 卡作业更低</text>
<text x="40" y="92" font-size="14" fill="#646A73">微软多租户训练集群两个月 trace；利用率按 GPU 周期统计</text>
<text x="268" y="168" font-size="14" fill="#1F2329" text-anchor="end">8 卡作业平均利用率</text>
<rect x="280" y="150" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="150" width="398" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="686" y="168" font-size="13" fill="#646A73">56.9%</text>
<text x="268" y="210" font-size="14" fill="#1F2329" text-anchor="end">16 卡作业平均利用率</text>
<rect x="280" y="192" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="192" width="240" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="528" y="210" font-size="13" fill="#646A73">34.3%</text>
<text x="268" y="252" font-size="14" fill="#1F2329" text-anchor="end">全部作业浪费的周期</text>
<rect x="280" y="234" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="234" width="334" height="26" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="622" y="252" font-size="13" fill="#646A73">47.7%</text>
<rect x="40" y="296" width="548" height="104" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="327" font-size="18" fill="#1F2329" font-weight="bold">排队</text>
<text x="56" y="357" font-size="14" fill="#646A73">三分之二卡在用时</text>
<text x="56" y="380" font-size="14" fill="#646A73">完全空闲的服务器不到 4.5%</text>
<rect x="612" y="296" width="548" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="327" font-size="18" fill="#1F2329" font-weight="bold">失败</text>
<text x="628" y="357" font-size="14" fill="#646A73">约 30% 作业被终止或失败</text>
<text x="628" y="380" font-size="14" fill="#646A73">失败前占用的卡时也计入损失</text>
<text x="40" y="436" font-size="12" fill="#646A73">来源：Jeon et al., Analysis of Large-Scale Multi-Tenant GPU Clusters for DNN Training Workloads, USENIX ATC 2019</text>
</svg>