<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">共享 GPU：按隔离需求选方式</text>
<text x="40" y="92" font-size="14" fill="#646A73">time-slicing 与 MPS 互斥，都按节点生效；请求多份共享 GPU 不保证成比例的算力</text>
<rect x="40" y="150" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="176" font-size="14" fill="#1F2329" font-weight="bold">方式</text>
<text x="273" y="176" font-size="14" fill="#1F2329" font-weight="bold">隔离</text>
<text x="759" y="176" font-size="14" fill="#1F2329" font-weight="bold">适合</text>
<rect x="40" y="192" width="1120" height="38" rx="0" fill="#FFF5EB" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="216" font-size="14" fill="#1F2329" font-weight="bold">time-slicing</text>
<text x="273" y="216" font-size="14" fill="#1F2329">不隔离：共享显存，同一故障域，一个崩全部崩</text>
<text x="759" y="216" font-size="14" fill="#1F2329">开发调试、能接受互相影响</text>
<rect x="40" y="230" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="254" font-size="14" fill="#1F2329" font-weight="bold">MPS</text>
<text x="273" y="254" font-size="14" fill="#1F2329">空间划分，显存和计算有上限</text>
<text x="759" y="254" font-size="14" fill="#1F2329">多个推理服务共卡</text>
<rect x="40" y="268" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="292" font-size="14" fill="#1F2329" font-weight="bold">MIG</text>
<text x="273" y="292" font-size="14" fill="#1F2329">硬件切分，各实例独立显存和计算单元（GPU-12）</text>
<text x="759" y="292" font-size="14" fill="#1F2329">生产负载、强隔离</text>
<rect x="40" y="306" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="330" font-size="14" fill="#1F2329" font-weight="bold">HAMi</text>
<text x="273" y="330" font-size="14" fill="#1F2329">隔离显存和算力，不改应用代码</text>
<text x="759" y="330" font-size="14" fill="#1F2329">异构设备集群</text>
<rect x="40" y="344" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="368" font-size="14" fill="#1F2329" font-weight="bold">DRA 共享</text>
<text x="273" y="368" font-size="14" fill="#1F2329">多个 Pod 引用同一个 claim</text>
<text x="759" y="368" font-size="14" fill="#1F2329">需要按属性申领的场景</text>
<text x="40" y="416" font-size="12" fill="#646A73">来源：NVIDIA k8s-device-plugin README；HAMi README；Kubernetes DRA 文档</text>
</svg>