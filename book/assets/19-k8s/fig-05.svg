<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550">
<rect x="0" y="0" width="1200" height="550" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">拓扑感知分三层：NVSwitch 机内全互联，要管的是 NUMA 和跨机</text>
<text x="40" y="92" font-size="14" fill="#646A73">配套代码把 H100 8 卡建成双环，与 DGX H100 的 4 个 NVSwitch 不符</text>
<rect x="40" y="150" width="357" height="150" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">机内 GPU 之间</text>
<text x="56" y="211" font-size="14" fill="#646A73">4 个 NVSwitch</text>
<text x="56" y="234" font-size="14" fill="#646A73">900 GB/s GPU 间带宽</text>
<text x="56" y="257" font-size="14" fill="#646A73">任意两卡一跳相连</text>
<text x="56" y="280" font-size="14" fill="#646A73">挑哪几张卡差别不大</text>
<rect x="421" y="150" width="357" height="150" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="437" y="181" font-size="18" fill="#1F2329" font-weight="bold">节点内 NUMA</text>
<text x="437" y="211" font-size="14" fill="#646A73">Topology Manager</text>
<text x="437" y="234" font-size="14" fill="#646A73">默认 none 不对齐</text>
<text x="437" y="257" font-size="14" fill="#646A73">single-numa-node 不满足就拒</text>
<text x="437" y="280" font-size="14" fill="#646A73">超过 8 个 NUMA 默认不启用</text>
<rect x="803" y="150" width="357" height="150" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="819" y="181" font-size="18" fill="#1F2329" font-weight="bold">跨机</text>
<text x="819" y="211" font-size="14" fill="#646A73">同机架带宽更好</text>
<text x="819" y="234" font-size="14" fill="#646A73">Kueue required-topology</text>
<text x="819" y="257" font-size="14" fill="#646A73">Llama 3 聚合层 1:7</text>
<text x="819" y="280" font-size="14" fill="#646A73">调度器按拓扑优化</text>
<text x="268" y="359" font-size="14" fill="#1F2329" text-anchor="end">8 卡作业平均利用率</text>
<rect x="280" y="340" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="340" width="398" height="26" rx="4" fill="#34C724" stroke="#34C724" stroke-width="1"/>
<text x="686" y="359" font-size="13" fill="#646A73">56.9%</text>
<text x="268" y="401" font-size="14" fill="#1F2329" text-anchor="end">16 卡作业平均利用率</text>
<rect x="280" y="382" width="700" height="26" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="280" y="382" width="240" height="26" rx="4" fill="#FF8800" stroke="#FF8800" stroke-width="1"/>
<text x="528" y="401" font-size="13" fill="#646A73">34.3%</text>
<rect x="40" y="438" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="467" font-size="15" fill="#1F2329">Philly 的建议：训练作业跑得久，用排队时间换局部性。</text>
<text x="40" y="526" font-size="12" fill="#646A73">来源：DGX H100 用户指南；Kubernetes Topology Manager 文档；Kueue TAS 文档；Llama 3 论文；Philly 论文</text>
</svg>