<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
<rect x="0" y="0" width="1200" height="450" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">坏卡：调度器只让新 Pod 避开，已分配的 Pod 要主动处理</text>
<text x="40" y="92" font-size="14" fill="#646A73">设备插件经 ListAndWatch 通知 kubelet；allocatable 减少，capacity 不变</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">发现</text>
<text x="56" y="211" font-size="14" fill="#646A73">插件上报、DCGM 告警</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">隔离</text>
<text x="347" y="211" font-size="14" fill="#646A73">污点或 cordon</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">排空</text>
<text x="638" y="211" font-size="14" fill="#646A73">从 checkpoint 迁走</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">验收</text>
<text x="929" y="211" font-size="14" fill="#646A73">诊断、烧机后放回</text>
<rect x="40" y="262" width="548" height="128" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">Kubernetes 能看到</text>
<text x="56" y="323" font-size="14" fill="#646A73">allocatable 减少，新 Pod 不再分到</text>
<text x="56" y="346" font-size="14" fill="#646A73">allocatedResourcesStatus（v1.36 Beta 默认开）</text>
<text x="56" y="369" font-size="14" fill="#646A73">PodResources 列出在用设备</text>
<rect x="612" y="262" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="628" y="293" font-size="18" fill="#1F2329" font-weight="bold">要自己处理</text>
<text x="628" y="323" font-size="14" fill="#646A73">已分到坏卡的 Pod 仍绑在坏卡上</text>
<text x="628" y="346" font-size="14" fill="#646A73">告警要分清硬件和程序错误</text>
<text x="628" y="369" font-size="14" fill="#646A73">修好的卡验收后才放回</text>
<text x="40" y="426" font-size="12" fill="#646A73">来源：Kubernetes 文档（Device Plugins）；NVIDIA GPU Operator 文档；dcgm-exporter README</text>
</svg>