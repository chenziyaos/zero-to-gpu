<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect x="0" y="0" width="1200" height="430" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">调度层的 W_idle：看不见、放不对、拼不齐、排不上</text>
<text x="40" y="92" font-size="14" fill="#646A73">作业在排队，或者占着卡没满负荷，都记在 W_idle</text>
<rect x="40" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="69" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="69" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">1</text>
<text x="88" y="181" font-size="18" fill="#1F2329" font-weight="bold">看见</text>
<text x="56" y="211" font-size="14" fill="#646A73">设备插件、DRA（第 2、3 章）</text>
<polyline points="293,191 325,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="315,185 325,191 315,197" fill="#8F959E"/>
<rect x="331" y="150" width="247" height="82" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<circle cx="360" cy="175" r="13" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1.5"/>
<text x="360" y="180" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">2</text>
<text x="379" y="181" font-size="18" fill="#1F2329" font-weight="bold">放对</text>
<text x="347" y="211" font-size="14" fill="#646A73">NUMA 与跨机拓扑（第 4 章）</text>
<polyline points="584,191 616,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="606,185 616,191 606,197" fill="#8F959E"/>
<rect x="622" y="150" width="247" height="82" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<circle cx="651" cy="175" r="13" fill="#E4FAE1" stroke="#8EE085" stroke-width="1.5"/>
<text x="651" y="180" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">3</text>
<text x="670" y="181" font-size="18" fill="#1F2329" font-weight="bold">拼齐</text>
<text x="638" y="211" font-size="14" fill="#646A73">gang 调度（第 5 章）</text>
<polyline points="875,191 907,191" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="897,185 907,191 897,197" fill="#8F959E"/>
<rect x="913" y="150" width="247" height="82" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<circle cx="942" cy="175" r="13" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1.5"/>
<text x="942" y="180" font-size="13" fill="#D46B08" font-weight="bold" text-anchor="middle">4</text>
<text x="961" y="181" font-size="18" fill="#1F2329" font-weight="bold">排上</text>
<text x="929" y="211" font-size="14" fill="#646A73">碎片、配额、抢占（第 6、7 章）</text>
<rect x="40" y="262" width="357" height="104" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="293" font-size="18" fill="#1F2329" font-weight="bold">损失量级（第 1 章）</text>
<text x="56" y="323" font-size="14" fill="#646A73">在用 GPU 约 47.7% 周期浪费</text>
<text x="56" y="346" font-size="14" fill="#646A73">空闲整机不到 4.5%</text>
<rect x="421" y="262" width="357" height="104" rx="12" fill="#F2F3F5" stroke="#DEE0E3" stroke-width="1"/>
<text x="437" y="293" font-size="18" fill="#1F2329" font-weight="bold">坏卡（第 8 章）</text>
<text x="437" y="323" font-size="14" fill="#646A73">allocatable 减少</text>
<text x="437" y="346" font-size="14" fill="#646A73">已分配 Pod 不会自动迁走</text>
<rect x="803" y="262" width="357" height="104" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="819" y="293" font-size="18" fill="#1F2329" font-weight="bold">共享（第 9 章）</text>
<text x="819" y="323" font-size="14" fill="#646A73">time-slicing 不隔离</text>
<text x="819" y="346" font-size="14" fill="#646A73">MPS、MIG 有限制</text>
<text x="40" y="406" font-size="12" fill="#646A73">来源：Philly 论文（ATC 2019）；Kubernetes、Kueue、Volcano、NVIDIA 设备插件文档</text>
</svg>