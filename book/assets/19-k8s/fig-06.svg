<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
<rect x="0" y="0" width="1200" height="530" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">逐个放 Pod：两个作业各占一半，8 张卡全部空转</text>
<text x="40" y="92" font-size="14" fill="#646A73">剩 8 张空卡分在两台机器；作业 A、B 各要 2 个 Pod、每个 Pod 4 张卡</text>
<rect x="40" y="150" width="548" height="128" rx="12" fill="#FFF1E0" stroke="#FFBA6B" stroke-width="1"/>
<text x="56" y="181" font-size="18" fill="#1F2329" font-weight="bold">逐个放 Pod</text>
<text x="56" y="211" font-size="14" fill="#646A73">机器 1：A 的 Pod 占 4 卡</text>
<text x="56" y="234" font-size="14" fill="#646A73">机器 2：B 的 Pod 占 4 卡</text>
<text x="56" y="257" font-size="14" fill="#646A73">A、B 各等 4 卡，互相不释放</text>
<rect x="612" y="150" width="548" height="128" rx="12" fill="#E4FAE1" stroke="#8EE085" stroke-width="1"/>
<text x="628" y="181" font-size="18" fill="#1F2329" font-weight="bold">gang 整组放</text>
<text x="628" y="211" font-size="14" fill="#646A73">A 的 2 个 Pod 一起放，占 8 卡</text>
<text x="628" y="234" font-size="14" fill="#646A73">B 一个 Pod 都不放，排队</text>
<text x="628" y="257" font-size="14" fill="#646A73">A 跑完释放，B 再整组放</text>
<rect x="40" y="308" width="1120" height="42" rx="0" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="52" y="334" font-size="14" fill="#1F2329" font-weight="bold">实现</text>
<text x="288" y="334" font-size="14" fill="#1F2329" font-weight="bold">机制</text>
<rect x="40" y="350" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="373" font-size="14" fill="#1F2329" font-weight="bold">Volcano</text>
<text x="288" y="373" font-size="14" fill="#1F2329">PodGroup 的 minMember 凑不齐，一个 Pod 都不调度</text>
<rect x="40" y="388" width="1120" height="38" rx="0" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="411" font-size="14" fill="#1F2329" font-weight="bold">Kueue</text>
<text x="288" y="411" font-size="14" fill="#1F2329">waitForPodsReady 超时未全部就绪就驱逐重排；blockAdmission 顺序准入</text>
<rect x="40" y="426" width="1120" height="38" rx="0" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1"/>
<text x="52" y="449" font-size="14" fill="#1F2329" font-weight="bold">Kubernetes</text>
<text x="288" y="449" font-size="14" fill="#1F2329">v1.37 原生 gang 为 Beta、默认关闭；凑不齐 minCount 一个都不绑定</text>
<text x="40" y="506" font-size="12" fill="#646A73">来源：Kueue 文档（All-or-nothing with ready Pods）；Volcano PodGroup 文档；Kubernetes Gang Scheduling 文档</text>
</svg>